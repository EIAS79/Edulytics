<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-labelledby="title description" lang="ar">
<title id="title">مستطيل بطول س + ٣ وعرض ص</title>
<desc id="description">شكل هندسي أصلي للصف التاسع: الطول يساوي س زائد ثلاثة والعرض يساوي ص. يُستخدم لشرح صيغتي المساحة والمحيط.</desc>
<rect width="680" height="340" fill="#fff"/>
<rect x="160" y="84" width="360" height="170" rx="2" stroke="#174b83" stroke-width="4" fill="#eaf4fd"/>
<path d="M160 84h18v18" stroke="#174b83" stroke-width="3" fill="none"/>
<text x="340" y="68" font-size="30" font-family="sans-serif" direction="rtl" text-anchor="middle" fill="#173b5f">س + ٣</text>
<text x="550" y="176" font-size="30" font-family="sans-serif" direction="rtl" text-anchor="middle" fill="#173b5f">ص</text>
<text x="340" y="300" font-size="21" font-family="sans-serif" direction="rtl" text-anchor="middle" fill="#173b5f">المساحة = (س + ٣) × ص</text>
</svg>