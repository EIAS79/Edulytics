<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750" role="img" aria-label="Original angle relationship teaching figures"><title>Angle postulates and theorems: six original diagrams</title><rect width="900" height="750" fill="white"/><g font-family="sans-serif"><g stroke="#cfdbe4" fill="none"><path d="M450 0V750M0 250H900M0 500H900"/></g>
