108.478" x2="132.865" y2="113.075" stroke="#6b8295" stroke-width="1.5"/><line x1="113.478" y1="124.009" x2="118.075" y2="127.865" stroke="#6b8295" stroke-width="1.5"/><line x1="100.881" y1="142" x2="111.273" y2="148" stroke="#6b8295" stroke-width="1.5"/><text x="120.799" y="158.5" fill="#24394d" text-anchor="middle" font-size="17">150</text><line x1="91.599" y1="161.905" x2="97.237" y2="163.958" stroke="#6b8295" stroke-width="1.5"/><line x1="85.914" y1="183.12" x2="91.823" y2="184.162" stroke="#6b8295" stroke-width="1.5"/><line x1="84" y1="205" x2="96" y2="205" stroke="#6b8295" stroke-width="1.5"/><text x="107" y="210" fill="#24394d" text-anchor="middle" font-size="17">180</text><line x1="210" y1="205" x2="309.694" y2="158.512" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="210" y1="205" x2="172.378" y2="101.634" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><path d="M248.065 187.25 A42 42 0 0 0 195.635 165.533" fill="none" stroke="#087f8c" stroke-width="2.5"/><text x="232.102" y="155.296" fill="#087f8c" text-anchor="middle" font-size="17">85°</text><text x="210" y="235" font-size="18" text-anchor="middle" fill="#24394d">|110 − 25| = 85°</text>
<text x="670" y="26" font-size="18" text-anchor="middle" fill="#24394d">2. Angle addition</text><line x1="665" y1="195" x2="785" y2="195" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="665" y1="195" x2="756.925" y2="117.865" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="665" y1="195" x2="633.942" y2="79.089" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><path d="M705 195 A40 40 0 0 0 695.642 169.288" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M699.472 166.075 A45 45 0 0 0 653.353 151.533" fill="none" stroke="#087f8c" stroke-width="2.5"/><text x="721.382" y="179.479" fill="#24394d" text-anchor="middle" font-size="17">40°</text><text x="686.631" y="133.426" fill="#24394d" text-anchor="middle" font-size="17">65°</text><text x="665" y="235" font-size="18" text-anchor="middle" fill="#24394d">40° + 65° = 105°</text>
<text x="210" y="277" font-size="18" text-anchor="middle" fill="#24394d">3. Vertical angles</text><line x1="210" y1="377" x2="322" y2="377" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="210" y1="377" x2="262.581" y2="278.11" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="210" y1="377" x2="98" y2="377" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="210" y1="377" x2="157.419" y2="475.89" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><path d="M246 377 A36 36 0 0 0 226.901 345.214" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M174 377 A36 36 0 0 0 193.099 408.786" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M232.535 334.619 A48 48 0 0 0 162 377" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M187.465 419.381 A48 48 0 0 0 258 377" fill="none" stroke="#087f8c" stroke-width="2.5"/><text x="259.716" y="352.128" fill="#24394d" text-anchor="middle" font-size="17">62°</text><text x="160.284" y="411.872" fill="#24394d" text-anchor="middle" font-size="17">62°</text><text x="172.917" y="320.284" fill="#24394d" text-anchor="middle" font-size="17">118°</text><text x="247.083" y="443.716" fill="#24394d" text-anchor="middle" font-size="17">118°</text><text x="210" y="478" font-size="18" text-anchor="middle" fill="#24394d">62° + 118° = 180°</text>
<text x="670" y="277" font-size="18" text-anchor="middle" fill="#24394d">4. Perpendicular lines</text><line x1="670" y1="377" x2="766" y2="377" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="670" y1="377" x2="670" y2="281" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="670" y1="377" x2="574" y2="377" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="670" y1="377" x2="670" y2="473" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><g stroke="#087f8c" fill="none" stroke-width="2"><path d="M692 377v-22h-22M648 377v-22h22M648 377v22h22M692 377v22h-22"/></g><text x="708.891" y="343.109" fill="#24394d" text-anchor="middle" font-size="17">90°</text><text x="631.109" y="343.109" fill="#24394d" text-anchor="middle" font-size="17">90°</text><text x="631.109" y="420.891" fill="#24394d" text-anchor="middle" font-size="17">90°</text><text x="708.891" y="420.891" fill="#24394d" text-anchor="middle" font-size="17">90°</text><text x="670" y="486" font-size="18" text-anchor="middle" fill="#24394d">4 × 90° = 360°</text>
<text x="210" y="526" font-size="18" text-anchor="middle" fill="#24394d">5. Bisector and vertical angles</text><line x1="210" y1="640" x2="296" y2="640" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="210" y1="640" x2="255.573" y2="567.068" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="210" y1="640" x2="172.3" y2="562.704" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="210" y1="640" x2="164.427" y2="712.932" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="210" y1="640" x2="247.7" y2="717.296" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><path d="M242 640 A32 32 0 0 0 226.957 612.862" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M226.957 612.862 A32 32 0 0 0 195.972 611.239" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M193.043 667.138 A32 32 0 0 0 224.028 668.761" fill="none" stroke="#087f8c" stroke-width="2.5"/><text x="253.731" y="620.76" fill="#24394d" text-anchor="middle" font-size="17">58°</text><text x="212.878" y="590.075" fill="#24394d" text-anchor="middle" font-size="17">58°</text><text x="207.383" y="694.931" fill="#24394d" text-anchor="middle" font-size="17">58°</text><text x="210" y="736" font-size="18" text-anchor="middle" fill="#24394d">116° / 2 = 58°</text>
<text x="670" y="526" font-size="18" text-anchor="middle" fill="#24394d">6. Interior ray in vertical angle</text><line x1="670" y1="633" x2="755" y2="633" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="670" y1="633" x2="638.158" y2="554.189" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="670" y1="633" x2="585" y2="633" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="670" y1="633" x2="607.835" y2="690.97" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><line x1="670" y1="633" x2="701.842" y2="711.811" stroke="#24394d" stroke-width="3" stroke-linecap="round"/><path d="M708 633 A38 38 0 0 0 655.765 597.767" fill="none" stroke="#087f8c" stroke-width="2.5"/><text x="704.67" y="586.6" fill="#24394d" text-anchor="middle" font-size="17">112°</text><path d="M636 633 A34 34 0 0 0 645.134 656.188" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M643.671 657.552 A36 36 0 0 0 683.486 666.379" fill="none" stroke="#087f8c" stroke-width="2.5"/><text x="616.966" y="658.891" fill="#24394d" text-anchor="middle" font-size="17">43°</text><text x="657.447" y="694.625" fill="#24394d" text-anchor="middle" font-size="17">69°</text><text x="670" y="736" font-size="18" text-anchor="middle" fill="#24394d">112° − 43° = 69°</text>
