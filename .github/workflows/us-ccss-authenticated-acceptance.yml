name: US CCSS Authenticated Academic Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/us-ccss-authenticated-acceptance.yml'
      - 'tools/Edulytics.CiFixtures/**'
      - 'tools/phase29/acceptance_two_school_https.py'
      - 'tools/phase29/b001_practice_attempt_probe.py'
      - 'tools/phase29/verify_main_content_parity.py'
      - 'tools/phase29/verify_g5_owner_content_delta.py'
      - 'tools/phase29/g5_stage_d_authenticated_https.py'
      - 'tools/phase29/test_verify_g5_owner_content_delta.py'
      - 'tools/curriculum/us-ccss-g1-stage-d-technical-reconciliation.cjs'
      - 'tests/us-ccss-g1-stage-d-technical-reconciliation.test.cjs'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-us-school-https:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: 'US-CCSS'
      EDULYTICS_B001_G1_ALL_READS: '0'
      EDULYTICS_B001_ALL500_READS: '1'
      EDULYTICS_B001_REQUIRE_ALL500_PRACTICE_CTA: '1'  # Fail closed on missing lesson Practice entry, not academic clearance
      EDULYTICS_B001_PROBE_500_ATTEMPTS: '1'  # Real disposable Practice generation + persistence probe
      EDULYTICS_B001_PROBE_500_MALFORMED_ANSWERS: '1'  # 500 additional wrong answers must score 0 and persist
      EDULYTICS_B001_REQUIRE_ALL500_GRADED: '1'  # Strict technical 500/500; NOT 500 academic approvals
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fail-closed B001 Practice form classification
        run: |
          python3 -m py_compile tools/phase29/acceptance_two_school_https.py tools/phase29/b001_practice_form_coverage.py
          python3 -m py_compile tools/phase29/g5_stage_d_authenticated_https.py
          python3 tools/phase29/b001_practice_form_coverage.py
          python3 -m py_compile tools/phase29/b001_practice_attempt_probe.py
          python3 -m py_compile tools/phase29/g2_late_companion_https.py
          python3 tools/phase29/b001_practice_attempt_probe.py
      - name: Reject unapproved Grade 5 source, metadata, lesson order and translation changes
        run: python3 -m unittest discover -s tools/phase29 -p 'test_verify_g5_owner_content_delta.py' -v
      - name: Verify main storage parity with SHA-pinned owner-consented G5 English corrections only
        run: python3 tools/phase29/verify_main_content_parity.py
      - name: Build application and apply only disposable schema
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln --no-restore
          # Match container production layout: published static-asset manifest
          # and wwwroot must both be present in Staging.
          dotnet publish src/Edulytics.Web/Edulytics.Web.csproj \
            --configuration Release --no-restore --output /tmp/us-ccss-web-publish
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Install isolated Chromium visual test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Create American primary and secondary school fixtures, then exercise real HTTPS student/teacher flows
        env:
          RENDER_SERVICE_ID: ci-disposable
          Edulytics__Deployment__CleanBootstrap: 'false'
          Edulytics__MeetingDemo__ResetAndSeed: 'true'
          Edulytics__Deployment__RunStartupMigrations: 'false'
        run: |
          set -euo pipefail
          rehearsal_password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$rehearsal_password"
          export Edulytics__MeetingDemo__Password="$rehearsal_password"
          if ! dotnet run --project tools/Edulytics.CiFixtures/Edulytics.CiFixtures.csproj -- academic > /tmp/us-ccss-fixture.log 2>&1; then
            echo 'Disposable US CCSS academic fixture failed; last diagnostic lines:'
            tail -n 100 /tmp/us-ccss-fixture.log
            exit 1
          fi
          if ! grep -q 'MEETING_DEMO_SEED_COMPLETED' /tmp/us-ccss-fixture.log; then
            tail -n 100 /tmp/us-ccss-fixture.log
            exit 1
          fi
          # Only the disposable American secondary fixture is assigned a
          # reviewed, source-backed Traditional / ALG1 course. All real-school
          # legacy adoptions remain unresolved until an authorized administrator
          # explicitly chooses their course; no default school data is migrated.
          # Require one and only one matching fixture row (fail closed).
          configured="$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -A -t -c "
            WITH selected AS (
              UPDATE \"SchoolCurriculumAdoptions\" a
              SET \"CurriculumPathway\"='Traditional',
                  \"CurriculumLevelKey\"='US-CCSS-MATH:L11:TRADITIONAL:COURSE-ALG1',
                  \"CurriculumLevelLabel\"='Algebra 1'
              FROM \"Schools\" s
              WHERE a.\"SchoolId\"=s.\"Id\"
                AND s.\"SchoolCode\"='REHEARSAL-US-SECONDARY'
                AND a.\"CurriculumLogicalLevel\"=11
                AND a.\"CurriculumPathway\" IN ('Course/pathway mapping', 'Traditional')
              RETURNING a.\"Id\"
            ) SELECT count(*) FROM selected;")"
          test "$configured" = 1
          echo 'DISPOSABLE_US_HIGH_SCHOOL_EXPLICIT_ALG1_COURSE_BOUND'
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/us-ccss-key.pem -out /tmp/us-ccss-cert.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          openssl pkcs12 -export -out /tmp/phase-uat-identity.pfx \
            -inkey /tmp/us-ccss-key.pem -in /tmp/us-ccss-cert.pem \
            -passout pass:local-test-tls >/dev/null 2>&1
          cp /tmp/us-ccss-cert.pem /tmp/phase-uat-cert.pem
          export ASPNETCORE_URLS='https://127.0.0.1:5052'
          export ASPNETCORE_Kestrel__Certificates__Default__Path=/tmp/phase-uat-identity.pfx
          export ASPNETCORE_Kestrel__Certificates__Default__Password=local-test-tls
          export Edulytics__MeetingDemo__ResetAndSeed='false'
          # Test the actual published web root (not development-only static
          # asset manifests). This is the Render-like deployable artifact.
          export ASPNETCORE_CONTENTROOT=/tmp/us-ccss-web-publish
          dotnet /tmp/us-ccss-web-publish/Edulytics.Web.dll > /tmp/us-ccss-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 100); do
            if curl --fail --silent --cacert /tmp/phase-uat-cert.pem https://localhost:5052/health/ready > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Disposable US CCSS web process exited before readiness'
              tail -n 100 /tmp/us-ccss-web.log
              exit 1
            fi
            sleep 3
          done
          test "$ready" = true
          # Grade 5 Stage D: two exact 2021 lesson learner pages, generated
          # selected families and disposable persisted correct/malformed grades.
          # The script restores the synthetic G5 enrollment before legacy B001
          # probes. Do not use this for the unimplemented teacher-rubric signoff.
          python3 tools/phase29/g5_stage_d_authenticated_https.py
          python3 tools/phase29/acceptance_two_school_https.py
          python3 tools/phase29/g2_late_companion_https.py
      - name: Preserve G5 real authenticated two-lesson rendering and persisted Practice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-stage-d-authenticated-two-lessons-technical-not-teacher-approval
          path: /tmp/g5-stage-d-authenticated-two-lessons.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve exact 500 lesson disposable real Practice generation and grading evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b001-500-real-practice-grade-probe-not-academic-acceptance
          path: /tmp/b001-500-real-practice-generation-and-grading-probe.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve G1 51-146 candidate family, authenticated grading and authored-task rendering proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-96-original-source-practice-https-candidate-not-academic-clearance
          path: /tmp/g1-96-source-family-https-candidate-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve original B001 500 lesson Practice entry availability matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b001-500-practice-entry-preflight-no-academic-approval
          path: /tmp/b001-500-lesson-practice-form-preflight.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve G2 44 exact source-companion authenticated and cross-school denial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-44-source-companions-https-not-academic-approval
          path: /tmp/g2-44-source-companions-authenticated-https-no-academic-approval.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve G1 lesson desktop/mobile visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t001-ten-lessons-rich-v2-desktop-mobile-chromium
          path: /tmp/g1-u01-l*.png
          if-no-files-found: warn
      - name: Verify only two synthetic schools were created
        run: |
          set -euo pipefail
          ids="$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -A -t -c 'SELECT "SchoolCode" FROM "Schools" ORDER BY "SchoolCode";')"
          test "$ids" = "$(printf 'REHEARSAL-US-PRIMARY\nREHEARSAL-US-SECONDARY')"
  # Use the already executed 500-lesson authenticated Practice probe artifact.
  # This job does NOT rerun lesson tests or grant academic/production acceptance.
  b001-authenticated-practice-persistence:
    name: b001-authenticated-practice-persistence
    needs: isolated-us-school-https
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read exact-run real Practice grading artifact (no replay)
        uses: actions/download-artifact@v4
        with:
          name: b001-500-real-practice-grade-probe-not-academic-acceptance
          path: /tmp/b001-practice-evidence
      - name: Fail closed unless all 500 real generated grades and bad submissions persisted
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json
          files=glob.glob('/tmp/b001-practice-evidence/*.json')
          if len(files)!=1:
              raise SystemExit('Missing or ambiguous 500-lesson real Practice artifact')
          with open(files[0],encoding='utf-8') as fh:
              d=json.load(fh)
          rows=d.get('lessons')
          if (d.get('batchId')!='US-CCSS-B001' or d.get('checked')!=500 or
              not isinstance(rows,list) or len(rows)!=500 or
              len({x.get('lessonCode') for x in rows})!=500 or
              d.get('generationAndSelfGradingPassed')!=500 or
              d.get('malformedAnswersRejectedAndPersisted')!=500 or
              d.get('malformedAnswersNotVerified')!=0 or
              d.get('releaseDecision')!='NO_GO' or
              d.get('productionAuthenticatedUatApproved')!=0):
              raise SystemExit('B001 real Practice evidence mismatch; refusing PASS')
          print('Verified actual previous-job Practice artifact: 500/500 persisted grades,')
          print('500/500 malformed answers rejected and persisted, NO academic release')
          PY

  g1-stage-d-technical-artifact:
    name: g1-exact-run-96-lesson-internal-technical-evidence
    needs: isolated-us-school-https
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Negative control / tampered evidence tests
        run: node --test tests/us-ccss-g1-stage-d-technical-reconciliation.test.cjs
      - name: Download original authenticated lesson rows from this SAME CI run and fail closed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g1-stage-d-exact-run
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name g1-96-original-source-practice-https-candidate-not-academic-clearance \
            --dir /tmp/g1-stage-d-exact-run
          test -s /tmp/g1-stage-d-exact-run/g1-96-source-family-https-candidate-evidence.json
          node tools/curriculum/us-ccss-g1-stage-d-technical-reconciliation.cjs \
            --artifact=/tmp/g1-stage-d-exact-run/g1-96-source-family-https-candidate-evidence.json \
            --output=/tmp/g1-stage-d-exact-run/g1-96-technical-evidence-reconciliation.json \
            --run-id="$GITHUB_RUN_ID"
          node -e "const a=require('/tmp/g1-stage-d-exact-run/g1-96-technical-evidence-reconciliation.json');if(a.rows.length!==96||a.digitalGradingPersisted!==95||a.sourceOriginalSelectedTextVerified!==90||a.selectedSourceTextFragmentsVerified!==190||a.publicationApproval!=='NOT_EVALUATED'||a.gradeRelease!=='NO_GO')process.exit(1)"
      - name: Retain original source-scoped verified technical report (NOT publication approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-96-per-lesson-internal-technical-evidence-not-publication-approval
          path: /tmp/g1-stage-d-exact-run/g1-96-technical-evidence-reconciliation.json
          if-no-files-found: warn
          retention-days: 14
