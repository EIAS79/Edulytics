name: Manual screenshot export

on:
  push:
    branches:
      - manual-screenshot-capture-20260902
    paths:
      - '.github/workflows/manual-capture-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for capture and download images
        shell: bash
        run: |
          set -euo pipefail
          base='https://edulytics-manual-capture-temp.onrender.com'
          mkdir -p screenshots
          for i in $(seq 1 120); do
            curl -fsSL --retry 3 --retry-delay 2 "$base/manifest.json" -o manifest.json || true
            status=$(jq -r '.status // "missing"' manifest.json 2>/dev/null || echo missing)
            count=$(jq -r '.screenshots | length // 0' manifest.json 2>/dev/null || echo 0)
            echo "capture status=$status count=$count"
            if [ "$status" = 'done' ]; then break; fi
            if [ "$status" = 'error' ]; then cat manifest.json; exit 1; fi
            sleep 10
          done
          test "$(jq -r '.status' manifest.json)" = 'done'
          jq -r '.screenshots[].filename' manifest.json | while IFS= read -r f; do
            echo "downloading $f"
            curl -fsSL --retry 5 --retry-delay 2 "$base/shots/$f" -o "screenshots/$f"
          done
          cp manifest.json screenshots/manifest.json
          echo "Downloaded $(find screenshots -type f -name '*.jpg' | wc -l) screenshots"
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: edulytics-real-manual-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 7
