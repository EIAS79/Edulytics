name: US CCSS B01 V9 Full-500 Global Root-Cause Graph

# Reuses verified source inventories; clusters causes across ALL 500.
# Discovery ONLY: no edits, certifications, merge, or deployment.
on:
  push:
    branches:
      - audit/us-ccss-b01-500-lesson-certification
    paths:
      - '.github/workflows/us-ccss-b01-v9-global-root-cause.yml'
      - 'tools/us-ccss-b01-v9-global-root-cause-graph.cjs'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssB01V9EffectiveRootCauseImpactTests.cs'
      - 'tools/us-ccss-b01-v9-effective-root-cause-reconciliation.cjs'
      - 'tools/us-ccss-b01-v9-source-figure-dependency-audit.cjs'
      - 'tools/us-ccss-b01-v9-activity-figure-source-contract.cjs'
      - 'tools/us-ccss-b01-v9-source-figure-dom-linkage-gate.cjs'
      - 'tests/academic-us-ccss-b01-v9-source-figure-dom-linkage-gate.test.cjs'
      - 'artifacts/academic-us-ccss/batches/B01-v9-original-teacher-figure-dom-asset-map-40.json'
      - 'artifacts/academic-us-ccss/batches/B01-v9-original-figure-383-media-byte-provenance.json'
      - 'tests/academic-us-ccss-b01-v9-original-figure-media-383.test.cjs'
      - 'artifacts/academic-us-ccss/batches/B01-v9-original-figure-alt-risk-triage-397.json'
      - 'tests/academic-us-ccss-b01-v9-original-figure-alt-risk-triage.test.cjs'
      - 'artifacts/academic-us-ccss/batches/B01-v9-source-figure-397-rights-attribution-triage.json'
      - 'tests/academic-us-ccss-b01-v9-figure-397-rights-attribution.test.cjs'
      - 'artifacts/academic-us-ccss/batches/B01-v9-original-figure-115-alt-modal-context.json'
      - 'tests/academic-us-ccss-b01-v9-figure-115-alt-modal-context.test.cjs'
      - 'tests/academic-us-ccss-b01-v9-activity-figure-source-contract.test.cjs'
      - 'tests/academic-us-ccss-b01-v9-source-figure-dependency-audit.test.cjs'
      - 'tests/academic-us-ccss-b01-v9-effective-root-cause-reconciliation.test.cjs'
      - 'src/Edulytics.Data/Seeding/CanonicalLessonContentMaterializer.cs'
      - 'src/Edulytics.Data/Seeding/CommonCoreB01V9SharedNonMeasureConceptTemplateCorrections.cs'
      - 'src/Edulytics.Data/Seeding/CommonCoreB01V9SharedComparisonProcedureCorrections.cs'
      - 'src/Edulytics.Data/Seeding/CommonCoreB01V9SharedGeometryProcedureCorrections.cs'
      - 'src/Edulytics.Data/Seeding/CommonCoreB01V9SharedAdditionProcedureCorrections.cs'
      - 'src/Edulytics.Data/Seeding/CommonCoreB01V9SharedSubtractionProcedureCorrections.cs'
      - 'src/Edulytics.Data/Seeding/CommonCoreB01V9UnrelatedGeometryConceptRuleCorrections.cs'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssB01V9UnrelatedGeometryConceptRuleCorrectionsTests.cs'
      - 'artifacts/academic-us-ccss/batches/B01-v9-geometry-concept-contamination-five-source-verified.json'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssB01V9SharedSubtractionProcedureCorrectionsTests.cs'
      - 'artifacts/academic-us-ccss/batches/B01-v9-shared-subtraction-procedure-16-source-bound-repair.json'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssB01V9SharedAdditionProcedureCorrectionsTests.cs'
      - 'artifacts/academic-us-ccss/batches/B01-v9-addition-template-25-source-goal-activity-reviewed.json'
      - 'tests/academic-us-ccss-b01-v9-addition-cohort-25.test.cjs'
      - 'artifacts/academic-us-ccss/batches/B01-v9-subtraction-55-source-goal-activity-purpose-reviewed.json'
      - 'tests/academic-us-ccss-b01-v9-subtraction-cohort-55.test.cjs'
      - 'tests/academic-us-ccss-b01-v9-complete-500-purpose-audit.test.cjs'
      - 'artifacts/academic-us-ccss/batches/B01-v9-full-500-source-purpose-comparison-coverage.json'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssB01V9SharedGeometryProcedureCorrectionsTests.cs'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/CommonCoreG4MultiplesSourceCorrectionTests.cs'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssB01V9SharedComparisonProcedureCorrectionsTests.cs'
      - 'src/Edulytics.Data/Seeding/CommonCoreB01V9LearnerVoiceSharedRootCorrection.cs'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssB01V9LearnerVoiceSharedRootCorrectionTests.cs'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssB01V9SharedNonMeasureConceptTemplateCorrectionsTests.cs'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/CommonCoreSourceBoundHtmlEntityCorrectionsTests.cs'
      - 'tests/Edulytics.Tests/Phase29/SourceBoundCommonCoreJsonMetadataReconciliationTests.cs'
      - 'src/Edulytics.Data/Seeding/MathematicsCanonicalLessonContentSeeder.cs'
      - 'src/Edulytics.Services/LessonContent/RichLessonContentV2RuntimeComposer.cs'
      - 'tests/academic-us-ccss-b01-v9-global-root-cause-graph.test.cjs'
      - 'tools/us-ccss-b01-v9-math-element-index.cjs'
      - 'tools/us-ccss-b01-v9-shared-root-cause-ledger.cjs'
      - 'artifacts/academic-us-ccss/batches/B01-lesson-manifest.json'
      - 'artifacts/academic-us-ccss/batches/B01-original-teacher-activity-local-index-500.json'
      - 'artifacts/academic-us-ccss/batches/B01-book-source-reference-index-500.json'
      - 'artifacts/academic-us-ccss/batches/B01-v9-source-goal-signal-memory-500.json'
      - 'artifacts/academic-us-ccss/batches/B01-v9-optional-source-purpose-fallback-reviewed-metadata.json'
      - 'tests/academic-us-ccss-b01-v9-optional-source-purpose-fallback.test.cjs'
      - 'artifacts/academic-us-ccss/batches/B01-v9-shared-comparison-procedure-44-source-reviewed-metadata.json'
      - 'artifacts/academic-us-ccss/batches/B01-v9-geometry-template-31-source-purpose-reviewed.json'
      - 'tests/academic-us-ccss-b01-v9-shared-geometry-purpose-31.test.cjs'
      - 'tests/academic-us-ccss-b01-v9-shared-comparison-cohort-44.test.cjs'
      - 'artifacts/academic-us-ccss/batches/B01-v9-source-lesson-activity-figure-context-40.json'
      - 'artifacts/academic-us-ccss/batches/B01-v9-original-activity-figure-frames-40.json'
      - 'artifacts/academic-us-ccss/batches/B01-v9-*-purpose-reviewed-metadata.json'
      - 'artifacts/academic-us-ccss/batches/B01-v9-nonlength-ruler-cohort-metadata.json'
      - 'artifacts/academic-us-ccss/batches/B01-v9-source-verified-nonmeasure-23-cohort.json'
      - 'artifacts/academic-us-ccss/batches/B01-v9-comparison-20-source-task-family-contract.json'
      - 'artifacts/academic-us-ccss/batches/B01-v9-learner-voice-2-cohort.json'
      - 'src/Edulytics.Core/Curriculum/LessonContent/Packs/us-ccss-math-g*-phase29-v1.lesson-content-pack.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usccss-b01-v9-global-graph
  cancel-in-progress: true

jobs:
  graph-b01-all-500:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Negative tests for complete coverage, identity drift and no fake certification
        run: |
          node --test tests/academic-us-ccss-b01-v9-optional-source-purpose-fallback.test.cjs
          node --test tests/academic-us-ccss-b01-v9-shared-comparison-cohort-44.test.cjs
          node --test tests/academic-us-ccss-b01-v9-shared-geometry-purpose-31.test.cjs
          node --test tests/academic-us-ccss-b01-v9-addition-cohort-25.test.cjs
          node --test tests/academic-us-ccss-b01-v9-subtraction-cohort-55.test.cjs
          node --test tests/academic-us-ccss-b01-v9-complete-500-purpose-audit.test.cjs
          node --test tests/academic-us-ccss-b01-v9-global-root-cause-graph.test.cjs
          node --test tests/academic-us-ccss-b01-v9-math-element-index.test.cjs tests/academic-us-ccss-b01-v9-shared-root-cause-ledger.test.cjs
      - name: Produce one global impact graph using existing 500-source inventories and V9 indexes
        run: node tools/us-ccss-b01-v9-global-root-cause-graph.cjs --out=b01-v9-global-root-cause-500.json
      - name: Verify report coverage and explicit no-go across EVERY node
        run: |
          node -e "const a=require('./b01-v9-global-root-cause-500.json');if(a.coverage.unique!==500||a.coverage.observed!==500||a.certificationDecision!=='BATCH_NO-GO'||a.repairDecision!=='NO_AUTOMATIC_REPAIR_AUTHORITY'||a.nodes.some(x=>x.academicDecision!=='NOT_CERTIFIED_BY_THIS_GRAPH'))process.exit(1);console.log(JSON.stringify({coverage:a.coverage,reviewedPurposes:a.academicSourcePurposeReviews,sharedTemplateGroups:a.repeatedExactLearnerTemplates.uniqueGroups,rootCauseCounts:Object.fromEntries(Object.entries(a.rootCauseSignals).map(([k,v])=>[k,v.candidateLessonCount])),academicDecision:a.certificationDecision}));"
      - name: Verify fail-closed 500-way effective cohort reconciliation with negative tests
        run: node --test tests/academic-us-ccss-b01-v9-effective-root-cause-reconciliation.test.cjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - name: Restore and compile REAL Rich V2 runtime and exact 500-way test
        run: |
          dotnet restore tests/Edulytics.Tests/Edulytics.Tests.csproj
          dotnet build tests/Edulytics.Tests/Edulytics.Tests.csproj --no-restore
      - name: Materialize 500 corrections and compose Rich V2 from actual application
        run: |
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-build \
            --filter 'FullyQualifiedName~UsCcssB01V9EffectiveRootCauseImpactTests|FullyQualifiedName~UsCcssB01V9SharedNonMeasureConceptTemplateCorrectionsTests|FullyQualifiedName~UsCcssB01V9LearnerVoiceSharedRootCorrectionTests|FullyQualifiedName~UsCcssB01V9SharedComparisonProcedureCorrectionsTests|FullyQualifiedName~UsCcssB01V9SharedGeometryProcedureCorrectionsTests|FullyQualifiedName~UsCcssB01V9SharedAdditionProcedureCorrectionsTests|FullyQualifiedName~UsCcssB01V9SharedSubtractionProcedureCorrectionsTests|FullyQualifiedName~UsCcssB01V9UnrelatedGeometryConceptRuleCorrectionsTests|FullyQualifiedName~CommonCoreG4MultiplesSourceCorrectionTests|FullyQualifiedName~SourceBoundCommonCoreJsonMetadataReconciliationTests|FullyQualifiedName~CommonCoreSourceBoundHtmlEntityCorrectionsTests|FullyQualifiedName~UsCommonCoreB01CollectiveRichV2AuditTests' \
            --logger 'console;verbosity=normal'
      - name: Join ALL 25 raw root cohorts to 500 effective Rich V2 facts and source purposes
        run: |
          node tools/us-ccss-b01-v9-effective-root-cause-reconciliation.cjs \
            --graph=b01-v9-global-root-cause-500.json \
            --effective=b01-v9-effective-root-cause-500.json \
            --out=b01-v9-global-effective-root-causes-500.json
          node -e "const r=require('./b01-v9-global-effective-root-causes-500.json');if(r.coverage.joined!==500||r.coverage.unique!==500||r.automaticFixAuthorization!==false||r.confirmedSemanticDefectsByThisTool!==0||r.academicDecision!=='BATCH_NO-GO'||r.groupCount!==25)process.exit(1);console.log(JSON.stringify({coverage:r.coverage,groupCount:r.groupCount,sharedPatternRoots:Object.fromEntries(Object.entries(r.sharedPatternRoots).map(([k,v])=>[k,{raw:v.rawCandidates,effective:v.effectiveMarkerStillPresent,changed:v.effectiveMarkerAbsent,visual:v.withComposedVisual}])),noVisual:r.richV2WithoutStructuralVisuals.count,decision:r.academicDecision}));"
      - name: Audit all 40 original-figure reference gaps as ONE dependency family
        run: |
          node --test tests/academic-us-ccss-b01-v9-source-figure-dependency-audit.test.cjs
          node tools/us-ccss-b01-v9-source-figure-dependency-audit.cjs \
            --graph=b01-v9-global-root-cause-500.json \
            --effective=b01-v9-global-effective-root-causes-500.json \
            --out=b01-v9-source-figure-dependencies-40.json
          node -e "const r=require('./b01-v9-source-figure-dependencies-40.json');if(r.cohorts.length!==40||r.academicDecision!=='BATCH_NO-GO'||r.figureReplacementAuthority!==false||r.cohorts.some(x=>x.releaseDisposition!=='BLOCKED_AWAITING_SOURCE_ACTIVITY_FIGURE_AND_RENDERED_COMPARISON'))process.exit(1);console.log(JSON.stringify({figureReferences:r.cohorts.length,causeBreakdown:r.structuralCorrelationTotals,academicDecision:r.academicDecision}));"
      - name: Verify exact original 336 figure-frame / 383 CMS URL linkage unresolved for 40
        run: |
          node --test tests/academic-us-ccss-b01-v9-activity-figure-source-contract.test.cjs
          node tools/us-ccss-b01-v9-activity-figure-source-contract.cjs \
            --graph=b01-v9-global-root-cause-500.json \
            --effective=b01-v9-global-effective-root-causes-500.json \
            --out=b01-v9-activity-figure-source-guard-40.json
          node -e "const r=require('./b01-v9-activity-figure-source-guard-40.json');if(r.coverage.manifestLessons!==500||r.coverage.lessonIdentitiesJoined!==40||r.coverage.sourceFigureFrames!==336||r.coverage.sourceCMSAssetLocators!==383||r.blockedSourceFigureLessons!==40||r.figureAssetReuseAuthorization!==false||r.academicDecision!=='BATCH_NO-GO')process.exit(1);console.log(JSON.stringify({coverage:r.coverage,visualsBlocked:r.blockedSourceFigureLessons,decision:r.academicDecision}));"
      - name: Prove original source figure frame to CMS record linkage while preserving strict L6 math/rights NO-GO
        run: |
          node --test tests/academic-us-ccss-b01-v9-source-figure-dom-linkage-gate.test.cjs
          node tools/us-ccss-b01-v9-source-figure-dom-linkage-gate.cjs \
            --out=b01-v9-source-figure-dom-links-40.json
          node -e "const r=require('./b01-v9-source-figure-dom-links-40.json');if(r.coverage.manifestLessons!==500||r.coverage.exactFrameToOriginalMediaDOMPointers!==397||r.coverage.uniquePublisherMediaURLs!==383||r.coverage.unlinkedFigureFrames!==0||r.independentlyVerifiedVisualMathematics!==0||r.blockedLessonsForMathRightsAndL6!==40||r.releaseEligible!==false)process.exit(1);console.log(JSON.stringify({sourceDom:r.coverage,blocked:r.blockedLessonsForMathRightsAndL6,decision:r.academicDecision}));"
      - name: Verify 397 source figure frames and 383 fetched original image-byte fingerprints (NO rights/math/browser PASS)
        run: |
          node --test tests/academic-us-ccss-b01-v9-original-figure-media-383.test.cjs
          node --test tests/academic-us-ccss-b01-v9-original-figure-alt-risk-triage.test.cjs
          node --test tests/academic-us-ccss-b01-v9-figure-397-rights-attribution.test.cjs
          node --test tests/academic-us-ccss-b01-v9-figure-115-alt-modal-context.test.cjs
          node -e "const a=require('./artifacts/academic-us-ccss/batches/B01-v9-original-figure-383-media-byte-provenance.json');if(a.scope.originalMathVisualsIndependentlyVerified!==0||a.scope.rightsVerifiedAssets!==0||a.scope.fullL6LessonsVerified!==0||a.academicDecision!=='BATCH_NO-GO'||a.lessons.length!==40||a.assets.length!==383)process.exit(1);console.log(JSON.stringify({teacherFigureFrames:a.scope.sourceOriginalFigureFrames,livePublisherMediaBytesVerified:a.scope.HTTP200CompleteMediaFilesRead,uniqueByteHashes:a.scope.distinctContentByteSha256,formats:a.scope.mediaFormatCounts,rightsPass:a.scope.rightsVerifiedAssets,academicDecision:a.academicDecision}));"
      - name: Preserve complete source-linked graph and impact groups, never an academic certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b01-v9-global-root-cause-500-review-only
          path: |
            b01-v9-global-root-cause-500.json
            b01-v9-effective-root-cause-500.json
            b01-v9-global-effective-root-causes-500.json
            b01-v9-source-figure-dependencies-40.json
            b01-v9-activity-figure-source-guard-40.json
            b01-v9-source-figure-dom-links-40.json
          if-no-files-found: warn
          retention-days: 30
