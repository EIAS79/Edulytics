name: UAE Grade 9 General Stage D - G7-parity first-party release checks and separate literal-parity diagnostics

on:
  push:
    branches:
      - fix/g9-general-full-year-scope-86
    paths:
      - '.github/workflows/uae-grade9-general-stage-d.yml'
      - 'tools/curriculum/uae_g9_stage_d_semantic_gate.py'
      - 'tools/curriculum/uae_g9_first_party_stage_d_gate.py'
      - 'artifacts/curriculum-delivery/UAE-MOE-MATH/G9/**'
      - 'src/Edulytics.Core/Curriculum/LessonContent/**'
      - 'src/Edulytics.Core/Mathematics/**'
      - 'src/Edulytics.Services/Mathematics/**'
      - 'src/Edulytics.Services/LessonContent/LessonContentPolicy.cs'
      - 'src/Edulytics.Services/LessonContent/LessonContentService.cs'
      - 'tests/academic-uae-grade9*.test.cjs'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UaeG9*.cs'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UaeGrade9ArabicPathwayPolicyTests.cs'
      - 'src/Edulytics.Web/wwwroot/lesson-labs/uae-g9-general/**'
  pull_request:
    branches:
      - main
    # Do not make the still-red G9 source gate block unrelated grade PRs
    # that only modify shared math engines or other RichV2 lessons.
    paths:
      - '.github/workflows/uae-grade9-general-stage-d.yml'
      - 'tools/curriculum/uae_g9_stage_d_semantic_gate.py'
      - 'artifacts/curriculum-delivery/UAE-MOE-MATH/G9/**'
      - 'src/Edulytics.Core/Curriculum/LessonContent/RichV2/uae-g9-general-*'
      - 'src/Edulytics.Core/Curriculum/LessonContent/Packs/uae-g9-general-*'
      - 'src/Edulytics.Core/Curriculum/LessonBlueprints/Packs/uae-g9-general-*'
      - 'tests/academic-uae-grade9*.test.cjs'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UaeG9*.cs'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UaeGrade9ArabicPathwayPolicyTests.cs'
      - 'src/Edulytics.Web/wwwroot/lesson-labs/uae-g9-general/**'
  workflow_dispatch:

concurrency:
  # Cancel older runs of the same event/ref; retain independent PR and push gates.
  group: uae-g9-stage-d-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  grade9-node-and-academic-gate:
    name: G9 first-party source acceptance and prepared lesson tests (literal parity reported separately)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact candidate ref
        run: |
          echo "CandidateSha=${GITHUB_SHA}"
          echo "TestedRefKind=${GITHUB_REF}"
      # The Grade 7 release path accepts owner-authorized first-party teaching
      # content without falsely certifying 1:1 publisher exercise parity.
      # This is a REQUIRED step; source evidence or author approval failures block CI.
      - name: G7-parity owner first-party source acceptance
        run: |
          set -euo pipefail
          python3 tools/curriculum/uae_g9_first_party_stage_d_gate.py --phase structural
          python3 tools/curriculum/uae_g9_first_party_stage_d_gate.py --phase source
          python3 - <<'PY'
          import json
          from pathlib import Path
          for phase in ('structural', 'source'):
              report = json.loads(Path(f'artifacts/uae-g9-stage-d/grade9-first-party-{phase}-gate.json').read_text(encoding='utf-8'))
              if report.get('status') != 'PASS' or report.get('unpassed'):
                  raise SystemExit(f'FIRST_PARTY_{phase.upper()}_NO_GO: release evidence is not acceptable')
          source = json.loads(Path('artifacts/uae-g9-stage-d/grade9-first-party-source-gate.json').read_text(encoding='utf-8'))
          if source.get('ownerFirstPartyPublicationScope') != 'OWNER_APPROVED_LIMITED_FIRST_PARTY':
              raise SystemExit('OWNER_SCOPE_NOT_APPROVED')
          if source.get('publisherSourceLiteralParity') not in ('UNKNOWN', 'VERIFIED'):
              raise SystemExit('INVALID_PUBLISHER_LITERAL_PARITY')
          print('G7_PARITY_FIRST_PARTY_ACCEPTED; PUBLISHER_LITERAL_PARITY=' + source['publisherSourceLiteralParity'])
          PY
      - name: Upload Grade 9 first-party source acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade9-first-party-stage-d-source-evidence
          path: artifacts/uae-g9-stage-d/grade9-first-party-*-gate.json
          if-no-files-found: error
      - name: Run prepared Grade 9 Arabic tests
        run: |
          set -o pipefail
          mapfile -t files < <(find tests -maxdepth 1 -name 'academic-uae-grade9*.test.cjs' ! -name 'academic-uae-grade9-strict-source-index-gate.test.cjs' | sort)
          test "${#files[@]}" -gt 0
          node --test "${files[@]}" 2>&1 | tee g9-node-tests.log
      - name: Upload prepared Grade 9 Node test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade9-node-test-log
          path: g9-node-tests.log
          if-no-files-found: warn
      # Separate non-release publisher item-parity diagnostics: preserve genuine
      # test failures and artifacts, but do not veto first-party owner approval.
      - name: Strict source-index lock — publisher literal parity diagnostic
        id: publisher_literal_node
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          node --test tests/academic-uae-grade9-strict-source-index-gate.test.cjs 2>&1 | tee g9-source-gate.log
      - name: Independent Python source-parity evidence gate
        id: publisher_literal_python
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/curriculum/uae_g9_stage_d_semantic_gate.py --json | tee g9-python-source-parity.json
      - name: Verify independently reported publisher parity is genuine and separate from first-party release
        if: always()
        env:
          PUBLISHER_NODE_OUTCOME: ${{ steps.publisher_literal_node.outcome }}
          PUBLISHER_PYTHON_OUTCOME: ${{ steps.publisher_literal_python.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('g9-python-source-parity.json')
          if not path.is_file():
              raise SystemExit('SOURCE_DIAGNOSTIC_MISSING: Python source result absent')
          report = json.loads(path.read_text(encoding='utf-8'))
          if report.get('gate') != 'UAE_G9_GENERAL_SOURCE_ATOMIC_PARITY':
              raise SystemExit('SOURCE_DIAGNOSTIC_INVALID_GATE')
          result = report.get('releaseDecision')
          raw = report.get('verifiedRawSourceLessons')
          target = report.get('verifiedCanonicalLessons')
          node = os.environ['PUBLISHER_NODE_OUTCOME']
          python = os.environ['PUBLISHER_PYTHON_OUTCOME']
          if result == 'NO_GO':
              if not isinstance(raw, int) or not isinstance(target, int):
                  raise SystemExit('SOURCE_DIAGNOSTIC_MISSING_COUNTS')
              if not (0 <= raw <= 86 and 0 <= target <= 82):
                  raise SystemExit('SOURCE_DIAGNOSTIC_INVALID_COUNTS')
              if not report.get('failures'):
                  raise SystemExit('SOURCE_DIAGNOSTIC_NO_EXPLANATION')
              if any('invalid or missing gate evidence:' in failure for failure in report['failures']):
                  raise SystemExit('SOURCE_DIAGNOSTIC_INVALID_EVIDENCE_NOT_WAIVED')
              if node != 'failure' or python != 'failure':
                  raise SystemExit('SOURCE_DIAGNOSTIC_INCONSISTENT_RED_STATUS')
              status = f'UNKNOWN: {raw}/86 raw and {target}/82 canonical independent atomic audits; separate from owner-approved first-party scope'
          elif result == 'PASS':
              if raw != 86 or target != 82 or node != 'success' or python != 'success':
                  raise SystemExit('SOURCE_DIAGNOSTIC_FALSE_PASS')
              status = 'VERIFIED: full publisher atomic-parity diagnostics succeeded'
          else:
              raise SystemExit('SOURCE_DIAGNOSTIC_INVALID_RESULT')
          print(status)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as summary:
              summary.write('Publisher source-literal parity (NOT the first-party acceptance gate): ' + status + '\\n')
          PY
      - name: Upload independent Python source-parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade9-python-source-parity
          path: g9-python-source-parity.json
          if-no-files-found: warn
      - name: Upload strict source gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade9-source-gate-log
          path: g9-source-gate.log
          if-no-files-found: warn

  grade9-dotnet-tests:
    name: G9 scoped .NET tests (diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200' # Must match repository global.json exactly.
      - name: Build once and run scoped G9 tests
        run: |
          dotnet restore tests/Edulytics.Tests/Edulytics.Tests.csproj
          dotnet build tests/Edulytics.Tests/Edulytics.Tests.csproj --configuration Release --no-restore
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~UaeG9|FullyQualifiedName~UaeGrade9ArabicPathwayPolicyTests|FullyQualifiedName~UaeGrade7ArabicPathwayPolicyTests' --logger 'console;verbosity=normal' --logger 'trx;LogFileName=g9-scoped.trx' --results-directory ./g9-test-results
      - name: Fail closed if zero Grade 9 tests were executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = sorted(Path('g9-test-results').glob('*.trx'))
          if not files:
              raise SystemExit('NO_G9_TRX: no Grade 9 .NET test report was produced')
          total = 0
          failed = 0
          for file in files:
              root = ET.parse(file).getroot()
              counters = next((node for node in root.iter() if node.tag.endswith('Counters')), None)
              if counters is None:
                  raise SystemExit('INVALID_G9_TRX: missing test counters')
              total += int(counters.attrib.get('total', 0))
              failed += int(counters.attrib.get('failed', 0))
          print('Grade 9 scoped .NET tests:', total, 'total,', failed, 'failed')
          if total == 0:
              raise SystemExit('ZERO_G9_TESTS: a successful empty test filter is not acceptance')
          if failed:
              raise SystemExit('FAILED_G9_TESTS: math tests must pass')
          PY
      - name: Verify unpublished Grade 9 General authoring labs are absent from production publish
        run: |
          dotnet publish src/Edulytics.Web/Edulytics.Web.csproj --configuration Release --no-restore --output ./g9-publish-check
          test -f g9-publish-check/Edulytics.Web.dll
          test -d g9-publish-check/wwwroot
          test -f g9-publish-check/Edulytics.Web.staticwebassets.endpoints.json
          if test -d g9-publish-check/wwwroot/lesson-labs/uae-g9-general &&
             find g9-publish-check/wwwroot/lesson-labs/uae-g9-general -type f -print -quit | grep -q .; then
            echo 'NO_GO: Unverified Grade 9 General HTML/JS leaked into deployable wwwroot' >&2
            exit 1
          fi
          if grep -l 'lesson-labs/uae-g9-general' g9-publish-check/Edulytics.Web.staticwebassets.endpoints.json; then
            echo 'NO_GO: Unverified Grade 9 General leaked into static asset manifest' >&2
            exit 1
          fi
          echo 'PASS: Grade 9 General source drafts stay in Git but are not production static assets'

      - name: Upload Grade 9 .NET test result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade9-dotnet-trx
          path: g9-test-results/*.trx
          if-no-files-found: warn
