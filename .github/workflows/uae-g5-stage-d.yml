name: UAE Grade 5 Common Stage D - fail-closed diagnostics
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/uae-g5-stage-d.yml'
      - 'tools/curriculum/uae_g5_stage_d_gate.py'
      - 'tools/curriculum/uae_g5_stage_d_authenticated_https.py'
      - 'tools/curriculum/uae_g5_stage_d_browser_rtl.py'
      - 'tools/Edulytics.CiFixtures/**'
      - 'src/Edulytics.Services/LessonContent/**'
      - 'artifacts/curriculum-delivery/UAE-MOE-MATH/G5/**'
      - 'src/Edulytics.Core/Curriculum/**'
      - 'src/Edulytics.Core/Mathematics/**'
      - 'src/Edulytics.Services/Mathematics/**'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uae-g5-stage-d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  structural:
    name: G5 127 IDs, Arabic and registrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/curriculum/uae_g5_stage_d_gate.py --phase structural
      - run: python3 tools/math_intelligence/math_registry_integrity.py --strict
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-structural-${{ github.run_id }}
          path: artifacts/uae-g5-stage-d/grade5-structural-gate.json
          if-no-files-found: ignore
          retention-days: 30
  source:
    name: G5 owner-selected local books and first-party rights (2026-27 parity UNKNOWN)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/curriculum/uae_g5_stage_d_gate.py --phase source
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-source-${{ github.run_id }}
          path: artifacts/uae-g5-stage-d/grade5-source-gate.json
          if-no-files-found: error
          retention-days: 30
  math:
    name: G5 candidate math and UAE/US shared regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - name: Restore once, build Release once
        run: |
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
      - name: Grade 5 exact mathematics and lesson tests
        run: |
          mkdir -p artifacts/uae-g5-stage-d/trx
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~UaeGrade5' --logger 'trx;LogFileName=g5.trx' --results-directory artifacts/uae-g5-stage-d/trx
      - name: Impacted G1-G4 UAE and US reader regressions
        run: |
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~UaeGrade1Arabic|FullyQualifiedName~UaeGrade2|FullyQualifiedName~UaeGrade3|FullyQualifiedName~UaeGrade4|FullyQualifiedName~Phase29LessonReaderFinalPolishTests|FullyQualifiedName~Phase29LessonContentVisualContractTests|FullyQualifiedName~CommonCorePhase04SourceEntityPresentationTests' --logger 'trx;LogFileName=g5-impact.trx' --results-directory artifacts/uae-g5-stage-d/trx
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-math-${{ github.run_id }}
          path: artifacts/uae-g5-stage-d/trx/
          if-no-files-found: ignore
          retention-days: 30
  e2e:
    name: UAE G5 all 127 Arabic learner pages + 381 persisted Practice attempts
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: UAE-G5
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile dedicated UAE G5 HTTPS and Chromium RTL probes
        run: |
          python3 -m py_compile tools/curriculum/uae_g5_stage_d_authenticated_https.py
          python3 -m py_compile tools/curriculum/uae_g5_stage_d_browser_rtl.py
      - name: Build and migrate disposable PostgreSQL only
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln --configuration Release --no-restore
          dotnet publish src/Edulytics.Web/Edulytics.Web.csproj --configuration Release --no-restore --output /tmp/g2-web-publish
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Install pinned Playwright Chromium for real Arabic desktop/mobile screenshots
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
      - name: Real HTTPS with four authenticated UAE roles and all 127 pages/381 persisted grades
        env:
          Edulytics__Deployment__CleanBootstrap: 'false'
          Edulytics__MeetingDemo__ResetAndSeed: 'true'
          Edulytics__Deployment__RunStartupMigrations: 'false'
          RENDER_SERVICE_ID: ci-disposable
        run: |
          set -euo pipefail
          export Edulytics__MeetingDemo__Password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$Edulytics__MeetingDemo__Password"
          if ! dotnet run --project tools/Edulytics.CiFixtures/Edulytics.CiFixtures.csproj -- academic > /tmp/g2-fixture.log 2>&1; then
            echo 'UAE Grade5 disposable school fixture did not complete'
            tail -n 90 /tmp/g2-fixture.log | grep -Eiv 'password|credential|secret' || true
            exit 1
          fi
          grep -q 'MEETING_DEMO_SEED_COMPLETED' /tmp/g2-fixture.log
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/g2-key.pem -out /tmp/g2-cert.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          openssl pkcs12 -export -out /tmp/g2-identity.pfx \
            -inkey /tmp/g2-key.pem -in /tmp/g2-cert.pem \
            -passout pass:local-test-tls >/dev/null 2>&1
          cp /tmp/g2-cert.pem /tmp/phase-uat-cert.pem
          export ASPNETCORE_URLS='https://127.0.0.1:5052'
          export ASPNETCORE_Kestrel__Certificates__Default__Path=/tmp/g2-identity.pfx
          export ASPNETCORE_Kestrel__Certificates__Default__Password=local-test-tls
          export Edulytics__MeetingDemo__ResetAndSeed='false'
          export ASPNETCORE_CONTENTROOT=/tmp/g2-web-publish
          dotnet /tmp/g2-web-publish/Edulytics.Web.dll > /tmp/g2-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 100); do
            if curl --fail --silent --cacert /tmp/phase-uat-cert.pem https://localhost:5052/health/ready > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -n 110 /tmp/g2-web.log | grep -Eiv 'password|credential|secret' || true
              exit 1
            fi
            sleep 3
          done
          test "$ready" = true
          if ! python3 tools/curriculum/uae_g5_stage_d_authenticated_https.py; then
            echo 'UAE Grade5 authenticated isolated HTTPS probe failed; sanitized app diagnostics:'
            tail -n 130 /tmp/g2-web.log | grep -Eiv 'password|credential|secret' || true
            exit 1
          fi
          # A real Chromium engine, not HTML markers alone: both desktop/mobile,
          # every canonical Arabic lesson and eight full-page evidence images.
          if ! python3 tools/curriculum/uae_g5_stage_d_browser_rtl.py; then
            echo 'UAE Grade5 authenticated Chromium RTL visual smoke probe failed'
            tail -n 90 /tmp/g2-web.log | grep -Eiv 'password|credential|secret' || true
            exit 1
          fi
      - name: Derive real authenticated and Chromium gates from measured evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/uae-g5-stage-d
          python3 - <<'PY'
          import os,json,pathlib
          output=pathlib.Path("artifacts/uae-g5-stage-d")
          auth=json.loads(pathlib.Path("/tmp/uae-g5-stage-d-authenticated-127-lessons.json").read_text())
          visual=json.loads(pathlib.Path("/tmp/uae-g5-stage-d-browser-rtl/report.json").read_text())
          sha=os.environ["GITHUB_SHA"]
          assert auth["candidateSha"]==visual["candidateSha"]==sha
          assert auth["grade"]==5 and auth["lessonPageCount"]==127
          assert auth["correctAttemptPersistenceCount"]==127
          assert auth["wrongAttemptPersistenceCount"]==127
          assert auth["malformedAttemptRejectionCount"]==127
          assert auth["crossSchoolAccessDenied"] is True
          assert all(auth["roleLogins"].values())
          assert visual["rtlDesktopLessons"]==127 and visual["rtlMobileLessons"]==127
          assert visual["screenshotsWritten"]>=8
          for phase,checks in (
              ("authenticated-e2e",{"learnerPages":127,"persistedAnswerAttempts":381,
                  "fiveRoleLogins":True,"crossTenantAccessDenied":True}),
              ("arabic-visual",{"chromiumDesktopPages":127,"chromiumMobilePages":127,
                  "screenshotSamples":visual["screenshotsWritten"],"humanReview":"NOT_DONE"})):
              (output/f"grade5-{phase}-gate.json").write_text(json.dumps({
                "phase":phase,"status":"PASS","candidateSha":sha,
                "checks":checks,"limitedToDisposableCi":True,
                "humanAcademicApproval":"NOT_CLAIMED"},indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-authenticated-e2e
          path: artifacts/uae-g5-stage-d/grade5-authenticated-e2e-gate.json
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-arabic-visual
          path: artifacts/uae-g5-stage-d/grade5-arabic-visual-gate.json
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-browser-screenshot-evidence
          path: /tmp/uae-g5-stage-d-browser-rtl/
          if-no-files-found: warn
  final:
    name: G5 evidence-linked owner-approved first-party candidate decision
    if: always()
    needs: [structural, source, math, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve current-run Grade 5 structural proof
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g5-structural-${{ github.run_id }}
          path: artifacts/uae-g5-stage-d/
      - name: Retrieve current-run Grade 5 selected-source proof
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g5-source-${{ github.run_id }}
          path: artifacts/uae-g5-stage-d/
      - name: Retrieve current-run mathematics TRX results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g5-math-${{ github.run_id }}
          path: artifacts/uae-g5-stage-d/trx/
      - name: Retrieve current-run authenticated HTTPS evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g5-authenticated-e2e
          path: artifacts/uae-g5-stage-d/
      - name: Retrieve current-run Chromium desktop/mobile evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g5-arabic-visual
          path: artifacts/uae-g5-stage-d/
      - name: Evaluate current-run artifacts and exact SHA for owner-approved release
        env:
          STRUCTURAL_RESULT: ${{ needs.structural.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          MATH_RESULT: ${{ needs.math.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: python3 tools/curriculum/uae_g5_stage_d_gate.py --phase final
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-final-${{ github.run_id }}
          path: artifacts/uae-g5-stage-d/grade5-final-gate.json
          if-no-files-found: error
          retention-days: 30
