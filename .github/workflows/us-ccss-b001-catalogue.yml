name: US CCSS B001 Source Catalogue

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Edulytics.Core/Curriculum/LessonBlueprints/Packs/us-ccss-math-grade[1-4]-im-k5-2021.lesson-blueprint.json'
      - 'src/Edulytics.Core/Curriculum/LessonContent/Packs/us-ccss-math-g[1-4]-phase29-v1.lesson-content-pack.json'
      - 'docs/curriculum/us-ccss-g1-g12-structural-audit.json'
      - 'docs/curriculum/batches/US-CCSS-B001-*'
      - 'tools/curriculum/us-ccss-b001-inventory.cjs'
      - 'tests/us-ccss-b001-inventory.test.cjs'
      - 'tests/us-ccss-b001-original-source-intake.test.cjs'
      - 'tests/us-ccss-b001-im2021-source-fingerprint-triage.test.cjs'
      - 'tests/us-ccss-b001-im2021-original-student-pdf-source-links.test.cjs'
      - 'tests/us-ccss-b001-500-original-pedagogy-packets.test.cjs'
      - 'tests/us-ccss-b001-g1-u02-original-pdf-task-review.test.cjs'
      - 'tools/curriculum/us-ccss-b001-build-500-reviewer-worklist.cjs'
      - 'tools/curriculum/us-ccss-b001-source-remediation-500.cjs'
      - 'tests/us-ccss-b001-source-remediation-500.test.cjs'
      - 'tests/us-ccss-b001-500-reviewer-worklist.test.cjs'
      - '.github/workflows/us-ccss-b001-catalogue.yml'
  push:
    branches: [main]
    paths:
      - 'src/Edulytics.Core/Curriculum/LessonBlueprints/Packs/us-ccss-math-grade[1-4]-im-k5-2021.lesson-blueprint.json'
      - 'src/Edulytics.Core/Curriculum/LessonContent/Packs/us-ccss-math-g[1-4]-phase29-v1.lesson-content-pack.json'
      - 'docs/curriculum/us-ccss-g1-g12-structural-audit.json'
      - 'docs/curriculum/batches/US-CCSS-B001-*'
      - 'tools/curriculum/us-ccss-b001-inventory.cjs'
      - 'tests/us-ccss-b001-inventory.test.cjs'
      - 'tests/us-ccss-b001-original-source-intake.test.cjs'
      - 'tests/us-ccss-b001-im2021-source-fingerprint-triage.test.cjs'
      - 'tests/us-ccss-b001-im2021-original-student-pdf-source-links.test.cjs'
      - 'tests/us-ccss-b001-500-original-pedagogy-packets.test.cjs'
      - 'tests/us-ccss-b001-g1-u02-original-pdf-task-review.test.cjs'
      - 'tools/curriculum/us-ccss-b001-build-500-reviewer-worklist.cjs'
      - 'tools/curriculum/us-ccss-b001-source-remediation-500.cjs'
      - 'tests/us-ccss-b001-source-remediation-500.test.cjs'
      - 'tests/us-ccss-b001-500-reviewer-worklist.test.cjs'
      - '.github/workflows/us-ccss-b001-catalogue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-catalogue:
    name: b001-source-catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: node --check tools/curriculum/us-ccss-b001-inventory.cjs
      - name: Deterministic catalogue check
        run: node tools/curriculum/us-ccss-b001-inventory.cjs --check
      - name: Source-content mapping tests
        run: node --test tests/us-ccss-b001-inventory.test.cjs
      - name: Exact 500 on-device source evidence crosswalk (snapshot consistency only)
        run: node --test tests/us-ccss-b001-original-source-intake.test.cjs
      - name: Original-source 500 lesson file fingerprints and diagnostics (not certification)
        run: node --test tests/us-ccss-b001-im2021-source-fingerprint-triage.test.cjs
      - name: Original 500 student-task PDF link correspondence (not academic signoff)
        run: node --test tests/us-ccss-b001-im2021-original-student-pdf-source-links.test.cjs
      - name: Original 2021 500 lesson purposes and student-facing activities (not approval)
        run: node --test tests/us-ccss-b001-500-original-pedagogy-packets.test.cjs
      - name: G1 U02 L04-L10 original task-PDF text and unresolved activity review evidence (no teacher approval)
        run: node --test tests/us-ccss-b001-g1-u02-original-pdf-task-review.test.cjs
      - name: Cross-check 500 source dossiers and produce internal evidence-based verification worklist
        run: |
          node --check tools/curriculum/us-ccss-b001-build-500-reviewer-worklist.cjs
          node --test tests/us-ccss-b001-500-reviewer-worklist.test.cjs
          node tools/curriculum/us-ccss-b001-build-500-reviewer-worklist.cjs --out=/tmp/b001-review-worklist
      - name: Preserve all-500 internal source verification worklist (NO academic approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b001-500-source-pdf-math-internal-verification-worklist
          path: /tmp/b001-review-worklist/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify all 500 original source/embedded learner data and enumerate remediation priorities
        run: |
          node --check tools/curriculum/us-ccss-b001-source-remediation-500.cjs
          node --test tests/us-ccss-b001-source-remediation-500.test.cjs
          node tools/curriculum/us-ccss-b001-source-remediation-500.cjs --out=/tmp/b001-500-remediation
      - name: Preserve full 500-lesson P2/P3 risk ledger (not academic acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b001-500-source-aligned-remediation-ledger
          path: /tmp/b001-500-remediation/
          if-no-files-found: warn
          retention-days: 30
