name: B001 Effective Learner Content Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssB001EffectiveLearnerContentAuditTests.cs'
      - 'docs/curriculum/batches/US-CCSS-B001-CATALOGUE.json'
      - 'src/Edulytics.Core/Curriculum/LessonContent/Packs/us-ccss-math-g[1-4]-phase29-v1.lesson-content-pack.json'
      - 'src/Edulytics.Data/Seeding/CommonCore*.cs'
      - 'src/Edulytics.Data/Seeding/CanonicalLessonContentMaterializer.cs'
      - 'src/Edulytics.Data/Seeding/MathematicsCanonicalLessonContentSeeder.cs'
      - 'src/Edulytics.Services/LessonContent/RichLessonContentV2RuntimeComposer*.cs'
      - 'src/Edulytics.Core/Mathematics/Practice/**'
      - 'src/Edulytics.Services/Mathematics/ExactSkillContractQuestionEngine.cs'
      - '.github/workflows/us-ccss-b001-effective-content.yml'
  push:
    branches: [main]
    paths:
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssB001EffectiveLearnerContentAuditTests.cs'
      - 'docs/curriculum/batches/US-CCSS-B001-CATALOGUE.json'
      - 'src/Edulytics.Core/Curriculum/LessonContent/Packs/us-ccss-math-g[1-4]-phase29-v1.lesson-content-pack.json'
      - 'src/Edulytics.Data/Seeding/CommonCore*.cs'
      - 'src/Edulytics.Data/Seeding/CanonicalLessonContentMaterializer.cs'
      - 'src/Edulytics.Data/Seeding/MathematicsCanonicalLessonContentSeeder.cs'
      - 'src/Edulytics.Services/LessonContent/RichLessonContentV2RuntimeComposer*.cs'
      - 'src/Edulytics.Core/Mathematics/Practice/**'
      - 'src/Edulytics.Services/Mathematics/ExactSkillContractQuestionEngine.cs'
      - '.github/workflows/us-ccss-b001-effective-content.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-source-rich:
    name: b001-effective-learner-content-review
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - name: Restore unit-test project
        run: dotnet restore tests/Edulytics.Tests/Edulytics.Tests.csproj
      - name: Execute actual Rich V2 learner composer for B001 500 lessons
        run: |
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-restore \
            --filter 'FullyQualifiedName~UsCcssB001EffectiveLearnerContentAuditTests' \
            --logger 'console;verbosity=normal'
      - name: Upload learner content gap evidence regardless of test conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b001-500-effective-learner-content-triage
          path: artifacts/curriculum-delivery/US-CCSS-MATH/B001/effective-learner-content-triage.json
          if-no-files-found: warn
          retention-days: 30

  # Exact-SHA source inventory and authentic independent mathematical checks.
  # These existing tests do NOT certify academic parity for all 500 lessons.
  b001-source-and-math:
    name: b001-independent-source-content-and-math
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - name: Cross-check all 500 source-goal and original-student-activity packets
        run: |
          node --test tests/us-ccss-b001-500-original-pedagogy-packets.test.cjs
          node --test tests/us-ccss-b001-im2021-original-student-pdf-source-links.test.cjs
          node --test tests/us-ccss-b001-500-reviewer-worklist.test.cjs
          node --test tests/us-ccss-b001-source-remediation-500.test.cjs
      - name: Restore the source-mathematics test project
        run: dotnet restore tests/Edulytics.Tests/Edulytics.Tests.csproj
      - name: Run existing independent mathematical/source-goal tests
        run: |
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-restore \
            --filter 'FullyQualifiedName~UsCcssB001SourceGoalPracticeQuestionsTests|FullyQualifiedName~UsCommonCoreOrphanChildIndependentOracleTests|FullyQualifiedName~CommonCoreG2HundredsPlaceValueSourceCorrectionsTests' \
            --logger 'console;verbosity=normal'
      - name: Preserve strict educational scope
        run: |
          echo '500 source-linked identities audited; existing targeted independent mathematical tests passed.'
          echo 'NOT 500 lesson-specific academic approvals, original student activity parity, or live UAT.'
