name: UAE Grade 9 General isolated 0-to-82 database release rehearsal

# Mirrors Grade 7 scoped release rehearsal. This is disposable PostgreSQL
# and never targets Neon or Render. Publisher item parity remains UNKNOWN.
on:
  push:
    branches: [fix/g9-general-full-year-scope-86, main]
    paths:
      # A retired academic pathway must pass all four exact-main G9 gates.
      - 'src/Edulytics.Core/Curriculum/MathematicsCurriculumPackRegistry.cs'
      - 'docs/PHASE_29_SOURCE_ACQUISITION_MATRIX.json'
      - 'tests/Edulytics.Tests/Phase29/Phase29CurriculumExperienceRuntimeTests.cs'
      - '.github/workflows/uae-grade9-general-isolated-82-import.yml'
      - 'src/Edulytics.Core/Curriculum/**'
      - 'src/Edulytics.Data/Seeding/**'
      - 'src/Edulytics.Web/Program.cs'
      - 'tools/curriculum/uae_g9_first_party_stage_d_gate.py'
      - 'artifacts/curriculum-delivery/UAE-MOE-MATH/G9/**'
  pull_request:
    branches: [main]
    paths:
      # A retired academic pathway must pass all four exact-main G9 gates.
      - 'src/Edulytics.Core/Curriculum/MathematicsCurriculumPackRegistry.cs'
      - 'docs/PHASE_29_SOURCE_ACQUISITION_MATRIX.json'
      - 'tests/Edulytics.Tests/Phase29/Phase29CurriculumExperienceRuntimeTests.cs'
      - '.github/workflows/uae-grade9-general-isolated-82-import.yml'
      - 'src/Edulytics.Core/Curriculum/**'
      - 'src/Edulytics.Data/Seeding/**'
      - 'src/Edulytics.Web/Program.cs'
      - 'artifacts/curriculum-delivery/UAE-MOE-MATH/G9/**'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: g9-disposable-82-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scoped-82-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      GITHUB_RELEASE_CANDIDATE_SHA: ${{ github.sha }}
      CI: 'true'
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: UAE-G9
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm independently approved first-party source scope and Arabic lesson structure
        run: |
          set -euo pipefail
          python3 tools/curriculum/uae_g9_first_party_stage_d_gate.py --phase structural
          python3 tools/curriculum/uae_g9_first_party_stage_d_gate.py --phase source
          python3 tools/curriculum/uae_g9_richv2_runtime_gate.py --require-ready
      - name: Migrate and seed disposable PostgreSQL 18
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Verify clean seed has 82 canonical Published lessons before rehearsal
        run: |
          set -euo pipefail
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumPedagogicalLessons" WHERE "Code" LIKE '"'"'PED:UAE-MOE-MATH:L9:GENERAL:%'"'"'')" = 82
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumLessonContents" c JOIN "CurriculumPedagogicalLessons" p ON p."Id"=c."LessonNodeId" WHERE p."Code" LIKE '"'"'PED:UAE-MOE-MATH:L9:GENERAL:%'"'"' AND c."Status"=3')" = 82
      - name: Remove only candidate G9 lessons in disposable CI fixture, then pin unaffected record digests
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          CREATE TEMP TABLE g9_disposable_ids ON COMMIT DROP AS
          SELECT "Id" FROM "CurriculumPedagogicalLessons" WHERE
            "Code" LIKE 'PED:UAE-MOE-MATH:L9:GENERAL:%';
          DO $$ BEGIN
            IF (SELECT COUNT(*) FROM g9_disposable_ids) <> 82 THEN
              RAISE EXCEPTION 'Disposable G9 needs exactly 82 candidate lessons';
            END IF;
          END $$;
          DELETE FROM "CurriculumLessonContents"
             WHERE "LessonNodeId" IN (SELECT "Id" FROM g9_disposable_ids);
          DELETE FROM "CurriculumPedagogicalLessonOutcomes"
             WHERE "PedagogicalLessonId" IN (SELECT "Id" FROM g9_disposable_ids);
          DELETE FROM "CurriculumPedagogicalLessons"
             WHERE "Id" IN (SELECT "Id" FROM g9_disposable_ids);
          COMMIT;
          SQL
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumPedagogicalLessons" WHERE "Code" LIKE '"'"'PED:UAE-MOE-MATH:L9:GENERAL:%'"'"'')" = 0
          psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT md5(string_agg(to_jsonb(t)::text,chr(10) ORDER BY t."Id")) FROM "CurriculumPedagogicalLessons" t' > /tmp/g9-other-lessons-before
          psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT md5(string_agg(to_jsonb(t)::text,chr(10) ORDER BY t."Id")) FROM "CurriculumLessonContents" t' > /tmp/g9-other-content-before
          psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumPedagogicalLessons"' > /tmp/g9-other-lesson-count
      - name: Run scoped importer twice, verify 82 Published Arabic lessons and unchanged unrelated identities
        env:
          Edulytics__Deployment__CleanBootstrap: 'false'
          EDULYTICS_G9_SCOPED_RELEASE: CONFIRM_SEED_ONLY_UAE_GRADE9_GENERAL_ARABIC_82
        run: |
          set -euo pipefail
          other_count="$(cat /tmp/g9-other-lesson-count)"
          test "$other_count" -ge 4800
          for n in 1 2; do
            dotnet run --project src/Edulytics.Web/Edulytics.Web.csproj --configuration Release --no-build --no-launch-profile -- --urls http://127.0.0.1:18419 >"/tmp/g9-scoped-$n.log" 2>&1 &
            pid=$!
            found=false
            for attempt in $(seq 1 100); do
              if grep -q 'UAE_G9_SCOPED_PRODUCTION_82_LESSONS_AND_82_METADATA_PASS' "/tmp/g9-scoped-$n.log"; then found=true; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 2
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if [ "$found" != true ]; then
              tail -n 65 "/tmp/g9-scoped-$n.log" | grep -Eiv 'password|credential|secret|connection' || true
              exit 1
            fi
            test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumPedagogicalLessons" WHERE "Code" LIKE '"'"'PED:UAE-MOE-MATH:L9:GENERAL:%'"'"'')" = 82
            test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumLessonContents" c JOIN "CurriculumPedagogicalLessons" p ON p."Id"=c."LessonNodeId" WHERE p."Code" LIKE '"'"'PED:UAE-MOE-MATH:L9:GENERAL:%'"'"' AND c."Status"=3')" = 82
            test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumPedagogicalLessons"')" = "$((other_count+82))"
          done
          psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT md5(string_agg(to_jsonb(t)::text,chr(10) ORDER BY t.\"Id\")) FROM \"CurriculumPedagogicalLessons\" t WHERE t.\"Code\" NOT LIKE 'PED:UAE-MOE-MATH:L9:GENERAL:%'" > /tmp/g9-other-lessons-after
          psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT md5(string_agg(to_jsonb(t)::text,chr(10) ORDER BY t.\"Id\")) FROM \"CurriculumLessonContents\" t WHERE t.\"LessonNodeId\" NOT IN (SELECT p.\"Id\" FROM \"CurriculumPedagogicalLessons\" p WHERE p.\"Code\" LIKE 'PED:UAE-MOE-MATH:L9:GENERAL:%')" > /tmp/g9-other-content-after
          diff /tmp/g9-other-lessons-before /tmp/g9-other-lessons-after
          diff /tmp/g9-other-content-before /tmp/g9-other-content-after
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumPedagogicalLessons" WHERE "Code" LIKE '"'"'PED:UAE-MOE-MATH:L7:GENERAL:%'"'"'')" = 78
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumPedagogicalLessons" WHERE "Code" LIKE '"'"'PED:UAE-MOE-MATH:L8:GENERAL:%'"'"'')" = 76
          echo 'G9_ISOLATED_POSTGRES_0_TO_82_IDEMPOTENT_AND_UNRELATED_UNCHANGED_PASS'
      - name: Record exact G9 disposable DB evidence without claiming live production
        if: success()
        run: |
          mkdir -p artifacts/uae-g9-stage-d
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('artifacts/uae-g9-stage-d/grade9-isolated-import.json').write_text(json.dumps({
            "candidateSha":os.environ["GITHUB_SHA"],
            "testEnvironment":"GITHUB_ACTIONS_POSTGRES18_DISPOSABLE",
            "status":"PASS",
            "targetLessons":82,
            "importRuns":2,
            "otherCurriculaUnchanged":True,
            "publisherLiteralParity":"UNKNOWN",
            "authenticatedStudentE2E":"NOT_TESTED",
            "productionWritten":False
          },indent=2)+"\n")
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade9-disposable-0-to-82-db-evidence
          path: artifacts/uae-g9-stage-d/grade9-isolated-import.json
          if-no-files-found: warn
          retention-days: 30
