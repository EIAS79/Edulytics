name: UAE Grade 7 General Arabic Stage D - fail-closed diagnostics
on:
  push:
    branches:
      - curriculum/uae-g7-arabic-student-first-abc-20261115
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/uae-g7-stage-d.yml'
      - 'tools/curriculum/uae_g7_stage_d_gate.py'
      - 'artifacts/curriculum-delivery/UAE-MOE-MATH/G7/**'
      - 'src/Edulytics.Core/Curriculum/**'
      - 'src/Edulytics.Core/Mathematics/**'
      - 'src/Edulytics.Services/LessonContent/**'
      - 'tests/academic-uae-grade7-arabic-*.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uae-g7-stage-d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  structure:
    name: G7 structural, Arabic identity, term and learner ordering
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source-index, pack, 78 lessons and real source guard
        run: python3 tools/curriculum/uae_g7_stage_d_gate.py --phase structural
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g7-structure-${{ github.run_id }}
          path: artifacts/uae-g7-stage-d/grade7-structural-gate.json
          if-no-files-found: error
          retention-days: 30
  source:
    name: G7 source handoff and per-element parity - fail closed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify selected Arabic-source handoff without inventing 100 percent
        run: python3 tools/curriculum/uae_g7_stage_d_gate.py --phase source
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g7-source-${{ github.run_id }}
          path: artifacts/uae-g7-stage-d/grade7-source-gate.json
          if-no-files-found: error
          retention-days: 30
  lesson-tests:
    name: G7 native Node tests for all 78 lessons
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute all A-C-authored G7 lesson tests, not just parse them
        run: node --test --test-reporter=tap tests/academic-uae-grade7-arabic-u*l*.test.cjs > /tmp/g7-lessons.tap 2>&1 || { tail -n 160 /tmp/g7-lessons.tap; exit 1; }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g7-lesson-tests-${{ github.run_id }}
          path: /tmp/g7-lessons.tap
          if-no-files-found: error
          retention-days: 30
  compile-and-regressions:
    name: Build candidate once and run affected mathematics regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - name: Shared restore and Release build
        run: |
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
      - name: Shared UAE and US geometry regressions
        run: |
          mkdir -p artifacts/uae-g7-stage-d/trx
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~UaeGrade7ArabicPathwayPolicyTests|FullyQualifiedName~UaeGrade7FirstPartyReferenceRightsTests|FullyQualifiedName~UaeGrade7PracticeGenerationPreflightTests|FullyQualifiedName~UaeGrade7Unit9ExactSolidPracticeTests|FullyQualifiedName~UaeGrade1ArabicStudentLocaleTests|FullyQualifiedName~UaeG6|FullyQualifiedName~UaeGrade5|FullyQualifiedName~UaeG5|FullyQualifiedName~UsCcssG7' --logger 'trx;LogFileName=g7-shared-impact.trx' --results-directory artifacts/uae-g7-stage-d/trx
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g7-shared-math-${{ github.run_id }}
          path: artifacts/uae-g7-stage-d/trx
          if-no-files-found: ignore
          retention-days: 30
# Real authenticated Grade7 API/RTL, exact source item 1:1, isolated DB
# migration and persisted Practice acceptance are NOT tested by this workflow.
# Do not treat these diagnostic jobs as a release gate or a publishing approval.

  authenticated-e2e:
    name: G7 real authenticated HTTPS, 78 lessons, 234 attempts, Chromium desktop/mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: UAE-G7
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and migrate on disposable PostgreSQL only
        run: |
          set -euo pipefail
          python3 -m py_compile tools/curriculum/uae_g7_stage_d_authenticated_https.py tools/curriculum/uae_g7_stage_d_browser_rtl.py
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
          dotnet publish src/Edulytics.Web/Edulytics.Web.csproj -c Release --no-restore -o /tmp/g7-web-publish
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Require exactly 78 Arabic Published G7 General identities, no legacy English refs
        run: |
          set -euo pipefail
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT COUNT(*) FROM \"CurriculumPedagogicalLessons\" WHERE \"Code\" LIKE 'PED:UAE-MOE-MATH:L7:GENERAL:%'")" = 78
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT COUNT(*) FROM \"CurriculumLessonContents\" c JOIN \"CurriculumPedagogicalLessons\" l ON l.\"Id\"=c.\"LessonNodeId\" WHERE l.\"Code\" LIKE 'PED:UAE-MOE-MATH:L7:GENERAL:%' AND c.\"Status\"=3")" = 78
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT COUNT(*) FROM \"CurriculumPackContentNodes\" WHERE \"Code\" LIKE 'UAE:REF:TEXTBOOK:G7:GENERAL:%' OR \"Code\" LIKE 'UAE:CATALOG:G7:GENERAL:%'")" = 0
      - name: Run isolated four-role Grade7 HTTPS and actual Chromium mobile/desktop
        env:
          Edulytics__Deployment__CleanBootstrap: 'false'
          Edulytics__MeetingDemo__ResetAndSeed: 'true'
          Edulytics__Deployment__RunStartupMigrations: 'false'
          RENDER_SERVICE_ID: ci-disposable
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
          export Edulytics__MeetingDemo__Password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$Edulytics__MeetingDemo__Password"
          if ! dotnet run --project tools/Edulytics.CiFixtures/Edulytics.CiFixtures.csproj -- academic > /tmp/g7-fixture.log 2>&1; then
            tail -n 80 /tmp/g7-fixture.log | grep -Eiv 'password|credential|secret|connection' || true
            exit 1
          fi
          grep -q 'MEETING_DEMO_SEED_COMPLETED' /tmp/g7-fixture.log
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/g7-key.pem -out /tmp/g7-cert.pem -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          openssl pkcs12 -export -out /tmp/g7-identity.pfx -inkey /tmp/g7-key.pem -in /tmp/g7-cert.pem -passout pass:local-test-tls >/dev/null 2>&1
          cp /tmp/g7-cert.pem /tmp/phase-uat-cert.pem
          export ASPNETCORE_URLS='https://127.0.0.1:5052'
          export ASPNETCORE_Kestrel__Certificates__Default__Path=/tmp/g7-identity.pfx
          export ASPNETCORE_Kestrel__Certificates__Default__Password=local-test-tls
          export Edulytics__MeetingDemo__ResetAndSeed='false'
          export ASPNETCORE_CONTENTROOT=/tmp/g7-web-publish
          dotnet /tmp/g7-web-publish/Edulytics.Web.dll >/tmp/g7-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent --cacert /tmp/phase-uat-cert.pem https://localhost:5052/health/ready >/dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 3
          done
          if [ "$ready" != true ]; then
            tail -n 80 /tmp/g7-web.log | grep -Eiv 'password|credential|secret|connection' || true
            exit 1
          fi
          python3 tools/curriculum/uae_g7_stage_d_authenticated_https.py || { tail -n 80 /tmp/g7-web.log | grep -Eiv 'password|credential|secret|connection' || true; exit 1; }
          python3 tools/curriculum/uae_g7_stage_d_browser_rtl.py
      - name: Verify 78 pages, 234 actual persisted attempt responses, 156 rendered viewports
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          auth=json.loads(pathlib.Path('/tmp/uae-g7-stage-d-authenticated-78-lessons.json').read_text())
          rtl=json.loads(pathlib.Path('/tmp/uae-g7-stage-d-browser-rtl/report.json').read_text())
          assert auth['candidateSha']==rtl['candidateSha']==os.environ['GITHUB_SHA']
          assert auth['grade']==7 and auth['lessonPageCount']==78
          assert auth['correctAttemptPersistenceCount']==auth['wrongAttemptPersistenceCount']==auth['malformedAttemptRejectionCount']==78
          assert auth['crossSchoolAccessDenied'] is True and all(auth['roleLogins'].values())
          assert auth['negativeEnglishFallbackChecks']==78
          assert rtl['rtlDesktopLessons']==rtl['rtlMobileLessons']==78 and rtl['screenshotsWritten']>=8
          out=pathlib.Path('artifacts/uae-g7-stage-d/grade7-e2e.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'candidateSha':os.environ['GITHUB_SHA'],'status':'PASS','authenticatedLearnerPages':78,'negativeEnglishFallbackChecks':78,'persistedPracticeAttempts':234,'chromiumPagesDesktopMobile':156,'screenshots':rtl['screenshotsWritten'],'sourceLiteralParity':'UNKNOWN','productionWritten':False},indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g7-authenticated-e2e
          path: artifacts/uae-g7-stage-d/grade7-e2e.json
          if-no-files-found: error
          retention-days: 30

  scoped-production-rehearsal:
    name: G7 isolated production 0-to-78 import twice; preserve 5,155 unrelated records
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: UAE-G7
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - name: Migrate and seed disposable PostgreSQL 18
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Verify scoped production baseline and reimport twice without altering unrelated grades
        run: |
          set -euo pipefail
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumPedagogicalLessons"')" = 5009
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumLessonContents"')" = 5009
          psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          CREATE TEMP TABLE g7_cutover_fixture_ids ON COMMIT DROP AS
          SELECT "Id" FROM "CurriculumPedagogicalLessons" WHERE
            "Code" LIKE 'PED:UAE-MOE-MATH:L7:GENERAL:%' OR
            "Code" LIKE 'PED:US-CCSS-MATH:HS:ADV:PRECALC:OPENSTAX-2017:%';
          DO $$ BEGIN
            IF (SELECT COUNT(*) FROM g7_cutover_fixture_ids) <> 151 THEN
              RAISE EXCEPTION 'Expected exactly 78 G7 plus 73 G12 fixture candidates';
            END IF;
          END $$;
          DELETE FROM "CurriculumLessonContents"
            WHERE "LessonNodeId" IN (SELECT "Id" FROM g7_cutover_fixture_ids);
          DELETE FROM "CurriculumPedagogicalLessonOutcomes"
            WHERE "PedagogicalLessonId" IN (SELECT "Id" FROM g7_cutover_fixture_ids);
          DELETE FROM "CurriculumPedagogicalLessons"
            WHERE "Id" IN (SELECT "Id" FROM g7_cutover_fixture_ids);
          COMMIT;
          SQL
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumPedagogicalLessons"')" = 4858
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumLessonContents"')" = 4858
          psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT md5(string_agg(to_jsonb(x)::text,chr(10) ORDER BY x."Id")) FROM "CurriculumPedagogicalLessons" x' >/tmp/g7-other-lesson-hash
          psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT md5(string_agg(to_jsonb(x)::text,chr(10) ORDER BY x."Id")) FROM "CurriculumLessonContents" x' >/tmp/g7-other-content-hash
          export EDULYTICS_G7_SCOPED_RELEASE=CONFIRM_SEED_ONLY_UAE_GRADE7_ARABIC_78
          for n in 1 2; do
            dotnet run --project src/Edulytics.Web/Edulytics.Web.csproj --configuration Release --no-build --no-launch-profile -- --urls http://127.0.0.1:18417 >"/tmp/g7-scoped-$n.log" 2>&1 &
            pid=$!
            success=false
            for step in $(seq 1 100); do
              if grep -q 'UAE_G7_SCOPED_PRODUCTION_78_LESSONS_AND_78_METADATA_PASS' "/tmp/g7-scoped-$n.log"; then success=true; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 2
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if [ "$success" != true ]; then
              tail -n 65 "/tmp/g7-scoped-$n.log" | grep -Eiv 'password|credential|secret|connection' || true
              exit 1
            fi
            test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumPedagogicalLessons"')" = 4936
            test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumLessonContents"')" = 4936
          done
          unset EDULYTICS_G7_SCOPED_RELEASE
          psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT md5(string_agg(to_jsonb(x)::text,chr(10) ORDER BY x.\"Id\")) FROM \"CurriculumPedagogicalLessons\" x WHERE x.\"Code\" NOT LIKE 'PED:UAE-MOE-MATH:L7:GENERAL:%'" >/tmp/g7-other-lesson-after
          psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT md5(string_agg(to_jsonb(x)::text,chr(10) ORDER BY x.\"Id\")) FROM \"CurriculumLessonContents\" x WHERE x.\"LessonNodeId\" NOT IN (SELECT \"Id\" FROM \"CurriculumPedagogicalLessons\" WHERE \"Code\" LIKE 'PED:UAE-MOE-MATH:L7:GENERAL:%')" >/tmp/g7-other-content-after
          diff /tmp/g7-other-lesson-hash /tmp/g7-other-lesson-after
          diff /tmp/g7-other-content-hash /tmp/g7-other-content-after
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT COUNT(*) FROM \"CurriculumPedagogicalLessons\" WHERE \"Code\" LIKE 'PED:UAE-MOE-MATH:L6:GENERAL:%'")" = 128
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT COUNT(*) FROM \"CurriculumPedagogicalLessons\" WHERE \"Code\" LIKE 'PED:UAE-MOE-MATH:L7:ADVANCED:%'")" = 62
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT COUNT(*) FROM \"CurriculumPedagogicalLessons\" WHERE \"Code\" LIKE 'PED:US-CCSS-MATH:G7:%'")" = 145
          mkdir -p artifacts/uae-g7-stage-d
          python3 - <<'PY'
          import os,json,pathlib
          pathlib.Path('artifacts/uae-g7-stage-d/grade7-scoped-production.json').write_text(json.dumps({
            'phase':'scoped-production','status':'PASS','candidateSha':os.environ['GITHUB_SHA'],
            'approvedArabicLessonCount':78,'canonicalMetadataCount':78,
            'unrelatedRecordsPreserved':4858,'independentRunCount':2,
            'otherGradeDataChanged':False,'productionDatabaseWritten':False,
            'database':'disposable PostgreSQL 18'},indent=2)+'\n')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g7-scoped-production
          path: artifacts/uae-g7-stage-d/grade7-scoped-production.json
          if-no-files-found: warn
          retention-days: 30

  final:
    name: G7 current-SHA first-party release readiness - all technical gates
    if: always()
    needs: [structure, source, lesson-tests, compile-and-regressions, authenticated-e2e, scoped-production-rehearsal]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read exact-run Grade7 structural gate
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g7-structure-${{ github.run_id }}
          path: artifacts/uae-g7-stage-d
      - name: Read exact-run Grade7 owner-authorized source gate
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g7-source-${{ github.run_id }}
          path: artifacts/uae-g7-stage-d
      - name: Read Grade7 real authenticated HTTPS/Chromium gate
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g7-authenticated-e2e
          path: artifacts/uae-g7-stage-d
      - name: Read Grade7 production-scoped 0-to-78 rehearsal
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g7-scoped-production
          path: artifacts/uae-g7-stage-d
      - name: Reject incomplete, cross-SHA or fabricated source evidence
        env:
          STRUCTURE_RESULT: "${{ needs.structure.result }}"
          SOURCE_RESULT: "${{ needs.source.result }}"
          LESSON_TESTS_RESULT: "${{ needs['lesson-tests'].result }}"
          COMPILE_RESULT: "${{ needs['compile-and-regressions'].result }}"
          AUTH_E2E_RESULT: "${{ needs['authenticated-e2e'].result }}"
          SCOPED_RESULT: "${{ needs['scoped-production-rehearsal'].result }}"
        run: python3 tools/curriculum/uae_g7_stage_d_final.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g7-final-${{ github.run_id }}
          path: artifacts/uae-g7-stage-d/grade7-final-release-gate.json
          if-no-files-found: error
          retention-days: 30
