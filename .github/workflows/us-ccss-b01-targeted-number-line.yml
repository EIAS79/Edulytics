name: US CCSS B01 Targeted G2 U04 Evidence

on:
  push:
    branches: [audit/us-ccss-b01-500-lesson-certification]
    paths:
      - '.github/workflows/us-ccss-b01-targeted-number-line.yml'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssB01G2U04NumberLineEffectiveContractTests.cs'
      # The shared 125+lesson correction registry changes for unrelated lessons.
      # For L10 family updates, run this targeted job manually; the final gate
      # still re-verifies all lessons on the release candidate.
      - 'src/Edulytics.Services/LessonContent/UsCcssB01SourceBoundNumberLineVisuals.cs'
      - 'tools/us-ccss-b01-practice-source-conflicts.py'
      - 'tests/academic-us-ccss-b01-practice-source-conflicts.test.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g2-u04-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-scoped L10 families; reject legacy place-value fallback
        run: python3 tests/academic-us-ccss-b01-practice-source-conflicts.test.py
      - name: Test ONLY Grade 2 Unit 4 scoped source-to-Rich contracts
        run: |
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj \
            --filter 'FullyQualifiedName~UsCcssB01G2U04NumberLineEffectiveContractTests' \
            --logger 'console;verbosity=detailed'
