name: Phase18 Controlled Load Test

on:
  push:
    branches:
      - phase18/controlled-load-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Progressive read-only load against staging homepage
        shell: bash
        env:
          TARGET_URL: https://staging.edulytiks.com/
        run: |
          set -euo pipefail
          python3 <<'PY'
          import concurrent.futures
          import statistics
          import time
          import urllib.request

          TARGET = "https://staging.edulytiks.com/"
          stages = [
              ("single", 1, 1),
              ("low", 10, 2),
              ("moderate", 25, 5),
              ("school-burst", 50, 10),
          ]

          def one_request(index):
              req = urllib.request.Request(
                  TARGET,
                  headers={"User-Agent": "Edulytics-Phase18-ControlledLoad/1.0"},
                  method="GET",
              )
              started = time.perf_counter()
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      response.read(1024)
                      return response.status, (time.perf_counter() - started) * 1000, None
              except Exception as exc:
                  return 0, (time.perf_counter() - started) * 1000, repr(exc)

          total_failures = 0
          for name, total, concurrency in stages:
              stage_started = time.perf_counter()
              with concurrent.futures.ThreadPoolExecutor(max_workers=concurrency) as pool:
                  results = list(pool.map(one_request, range(total)))

              codes = [status for status, _, _ in results]
              timings = [ms for _, ms, _ in results]
              failures = [(status, err) for status, _, err in results if status != 200]
              total_failures += len(failures)
              elapsed = time.perf_counter() - stage_started

              sorted_timings = sorted(timings)
              p95_index = max(0, min(len(sorted_timings) - 1, int(len(sorted_timings) * 0.95) - 1))
              p95 = sorted_timings[p95_index]

              print(
                  f"STAGE {name}: total={total} concurrency={concurrency} "
                  f"http200={codes.count(200)} failures={len(failures)} "
                  f"avg_ms={statistics.mean(timings):.1f} p95_ms={p95:.1f} "
                  f"max_ms={max(timings):.1f} elapsed_s={elapsed:.2f}"
              )

              if failures:
                  for status, err in failures[:5]:
                      print(f"  failure status={status} error={err}")

              time.sleep(3)

          if total_failures:
              raise SystemExit(f"FAIL: {total_failures} requests were not HTTP 200")

          print("PASS: controlled read-only staging load completed with all requests HTTP 200")
          PY
