name: Phase29 Cambridge Primary Rollout

on:
  push:
    branches:
      - phase29/curriculum-experience-and-content
    paths:
      - 'tools/phase29/cambridge_primary_dfe_rollout.py'
      - '.github/workflows/phase29-cambridge-primary-rollout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: phase29/curriculum-experience-and-content
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic PDF parser
        run: python -m pip install --disable-pip-version-check 'pypdf==6.1.1'

      - name: Normalize known DfE Year 6 source-label drift
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/phase29/cambridge_primary_dfe_rollout.py')
          text = p.read_text(encoding='utf-8')
          old = '        guide = re.search(rf"(?m)^{re.escape(code)}\\s+Teaching guidance\\s*$", after)\n'
          new = '''        guide = None\n        for guide_code in (code, code.replace("/", "")):\n            candidate = re.search(\n                rf"(?m)^{re.escape(guide_code)}\\s+Teaching guidance\\s*$",\n                after,\n            )\n            if candidate is not None and (guide is None or candidate.start() < guide.start()):\n                guide = candidate\n'''
          if old not in text:
              raise SystemExit('FAIL: expected parser line not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Extend blueprint contract for fail-closed supporting-only documents
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/Edulytics.Core/Curriculum/PedagogicalLessonBlueprint.cs')
          text = p.read_text(encoding='utf-8')
          old = '''        var diagnostics =
            document.AcquisitionDiagnostics;

        if (diagnostics.UnitCount !=
                document.Units.Count ||
            diagnostics.LessonCount !=
                document.Lessons.Count ||
            diagnostics.EffectiveOfficialStandardCount <= 0 ||
            diagnostics.AddressingCoverageCount !=
                diagnostics.EffectiveOfficialStandardCount ||
            diagnostics.FormalMappingCount !=
                document.Lessons.Sum(
                    x => x.OutcomeCodes.Count))
        {
            throw new InvalidOperationException(
                $"Blueprint acquisition diagnostics drift: " +
                $"{document.BlueprintCode}.");
        }
'''
          new = '''        var diagnostics =
            document.AcquisitionDiagnostics;

        var formalMappingCount =
            document.Lessons.Sum(
                x => x.OutcomeCodes.Count);

        var hasFormalMappings =
            formalMappingCount > 0;

        var hasResolvedAlignment =
            document.Lessons
                .SelectMany(x => x.Alignments)
                .Any(
                    x =>
                        x.ResolutionKind is
                            "ExactAcceptedStandard" or
                            "SubpartToAcceptedParent" ||
                        !string.IsNullOrWhiteSpace(
                            x.OutcomeCode));

        var supportingOnly =
            !hasFormalMappings &&
            !hasResolvedAlignment &&
            document.Lessons.All(
                x => x.OutcomeCodes.Count == 0);

        var diagnosticsDrift =
            diagnostics.UnitCount !=
                document.Units.Count ||
            diagnostics.LessonCount !=
                document.Lessons.Count ||
            diagnostics.FormalMappingCount !=
                formalMappingCount;

        if (hasFormalMappings)
        {
            diagnosticsDrift =
                diagnosticsDrift ||
                diagnostics.EffectiveOfficialStandardCount <= 0 ||
                diagnostics.AddressingCoverageCount !=
                    diagnostics.EffectiveOfficialStandardCount;
        }
        else
        {
            diagnosticsDrift =
                diagnosticsDrift ||
                !supportingOnly ||
                diagnostics.EffectiveOfficialStandardCount != 0 ||
                diagnostics.AddressingCoverageCount != 0;
        }

        if (diagnosticsDrift)
        {
            throw new InvalidOperationException(
                $"Blueprint acquisition diagnostics drift: " +
                $"{document.BlueprintCode}.");
        }
'''
          if old not in text:
              raise SystemExit('FAIL: expected V1 diagnostics contract not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Generate Cambridge Primary Stages 2-6
        run: |
          set -euo pipefail
          python tools/phase29/cambridge_primary_dfe_rollout.py --stages 2,3,4,5,6 --write-audit
          python tools/phase29/full_curriculum_closure_audit.py --write-report

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.200'

      - name: Restore and build
        run: |
          set -euo pipefail
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln --no-restore

      - name: Phase 29 regression gate
        run: |
          set -euo pipefail
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-build --filter 'FullyQualifiedName~Phase29'

      - name: Commit generated source-backed content
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/phase29/cambridge_primary_dfe_rollout.py \
            src/Edulytics.Core/Curriculum/PedagogicalLessonBlueprint.cs \
            src/Edulytics.Core/Curriculum/LessonBlueprints/Packs/cambridge-primary-stage{2,3,4,5,6}-dfe-ogl-v1.lesson-blueprint.json \
            src/Edulytics.Core/Curriculum/LessonContent/Packs/cambridge-primary-stage{2,3,4,5,6}-dfe-ogl-v1.lesson-content-pack.json \
            docs/PHASE_29_CAMBRIDGE_PRIMARY_2_6_ROLLOUT_AUDIT.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Phase29: add Cambridge Primary Stage2-6 source-backed lessons'
          git push origin HEAD:phase29/curriculum-experience-and-content
