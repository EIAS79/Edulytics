name: US CCSS B01 500-Lesson Release Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/us-ccss-b01-500-release.yml'
      - 'artifacts/academic-us-ccss/batches/B01-lesson-manifest.json'
      - 'artifacts/academic-us-ccss/04-lesson-certification-records.json'
      - 'artifacts/academic-us-ccss/04-lesson-academic-audit.json'
      - 'tools/us-ccss-b01-release-gate.cjs'
      - 'tools/us-ccss-b01-bulk-content-screen.cjs'
      - 'tools/us-ccss-lesson-certification-records.cjs'
      - 'tests/academic-us-ccss-b01-release-gate.test.cjs'
      - 'tests/academic-us-ccss-b01-bulk-content-screen.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-b01-manifest-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove 500-lesson release refuses fake or incomplete evidence
        run: node --test tests/academic-us-ccss-b01-release-gate.test.cjs tests/academic-us-ccss-b01-bulk-content-screen.test.cjs
      - name: Screen ALL 500 learner content bodies together
        run: node tools/us-ccss-b01-bulk-content-screen.cjs --output=b01-bulk-screen.json
      - name: Save 500-row bulk content screen, even when issues are found
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b01-bulk-content-screen
          path: b01-bulk-screen.json
          retention-days: 30
      - name: Validate exact lesson identities and report true collective evidence coverage
        run: node tools/us-ccss-b01-release-gate.cjs --status

  release-all-500-only:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    needs: [validate-b01-manifest-and-safety]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recheck content of the entire 500-lesson batch before collective acceptance
        run: node tools/us-ccss-b01-bulk-content-screen.cjs --check
      - name: Make ONE automatic batch certification decision (no per-lesson signoff)
        run: node tools/us-ccss-b01-release-gate.cjs --release-check
