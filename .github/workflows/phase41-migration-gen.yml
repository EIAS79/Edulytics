name: Phase41 Migration Generator

on:
  push:
    branches:
      - phase41-online-assessments

permissions:
  contents: write

concurrency:
  group: phase41-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.200"

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Edulytics.sln

      - name: Generate migration only when model is pending
        shell: bash
        run: |
          set -euo pipefail
          if dotnet ef migrations has-pending-model-changes \
            --project src/Edulytics.Data/Edulytics.Data.csproj \
            --startup-project src/Edulytics.Web/Edulytics.Web.csproj \
            --context EdulyticsDbContext; then
            echo "No pending model changes."
            exit 0
          fi

          dotnet ef migrations add Phase41OnlineAssessmentDelivery \
            --project src/Edulytics.Data/Edulytics.Data.csproj \
            --startup-project src/Edulytics.Web/Edulytics.Web.csproj \
            --context EdulyticsDbContext

          git config user.name "Edulytics CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/Edulytics.Data/Migrations
          git commit -m "Phase 41: generate online assessment migration [skip-migration-gen]"
          git push origin HEAD:phase41-online-assessments
