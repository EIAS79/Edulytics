name: Grade 12 Precalculus Stage D - Real Candidate Gates
on:
  push:
    branches:
      - curriculum/us-ccss-g12-precalculus-abc-20261106
    paths:
      - '.github/workflows/us-ccss-g12-stage-d.yml'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G12/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/curriculum/g12_stage_d_*.cjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/us-ccss-g12-stage-d.yml'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G12/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/curriculum/g12_stage_d_*.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 73 ordered lesson and Stage D ledger contracts
        run: node tools/curriculum/g12_stage_d_structure_gate.cjs
      - name: Verify owner-authorized 73 canonical student body candidates and attribution credits
        run: node tools/curriculum/g12_stage_d_canonical_73_gate.cjs
  shared-dotnet-build-and-first-lesson-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - name: Restore solution
        run: dotnet restore Edulytics.sln
      - name: Compile full solution
        run: dotnet build Edulytics.sln --no-restore --configuration Release
      - name: Execute Grade 12 first-lesson source/registry tests on GitHub Actions
        run: dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-build --no-restore --configuration Release --filter FullyQualifiedName~Grade12PrecalculusSection11SourceContractsTests --logger "trx;LogFileName=g12-u01-l01.trx" --results-directory ./artifacts/g12-stage-d-trx
      - name: Execute all 73 Grade 12 actual RichV2 embedded-registry loading tests
        run: dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-build --no-restore --configuration Release --filter FullyQualifiedName~Grade12PrecalculusAllLessonRegistryRuntimeTests --logger "trx;LogFileName=g12-all73-runtime-registry.trx" --results-directory ./artifacts/g12-stage-d-trx
      - name: Render all independently authored Grade12 typed mathematical graphs in real SVG renderer
        run: dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-build --no-restore --configuration Release --filter FullyQualifiedName~Grade12PrecalculusAllSourceGraphRenderTests --logger "trx;LogFileName=g12-math-svg-rendering.trx" --results-directory ./artifacts/g12-stage-d-trx
      - name: Materialize and validate all 73 published canonical Grade12 lesson candidates
        run: dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-build --no-restore --configuration Release --filter FullyQualifiedName~Grade12PrecalculusCanonical73PublishedCandidateTests --logger "trx;LogFileName=g12-canonical-73.trx" --results-directory ./artifacts/g12-stage-d-trx
      - name: Independently generate and grade six source-aligned numerical Practice subsets
        run: dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-build --no-restore --configuration Release --filter FullyQualifiedName~Grade12PrecalculusScopedPracticeContractStageDTests --logger "trx;LogFileName=g12-six-partial-practice-families.trx" --results-directory ./artifacts/g12-stage-d-trx
      - name: Verify exact Grade12 additional function families and global presentation contracts
        run: dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-build --no-restore --configuration Release --filter "FullyQualifiedName~Grade12Section11AdditionalFunctionFamilyInteractionTests|FullyQualifiedName~LessonPracticeInteractionRegistryTests|FullyQualifiedName~SupportingLessonPracticeR7R9ClosureTests" --logger "trx;LogFileName=g12-new-family-runtime.trx" --results-directory ./artifacts/g12-stage-d-trx
      - name: Upload focused test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade12-stage-d-first-lesson-tests
          path: artifacts/g12-stage-d-trx/
          if-no-files-found: ignore
  content-shard-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [G12-D1, G12-D2, G12-D3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check authoring schemas, question keys and lesson codes in each shard
        run: node tools/curriculum/g12_stage_d_content_shard.cjs ${{ matrix.shard }}
      - name: Independent mathematical oracle for 12 alternating sequence teacher keys
        if: matrix.shard == 'G12-D3'
        run: node tools/curriculum/g12_stage_d_sequence_sign_gate.cjs
  fail-closed-final-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [structural-source-inventory, shared-dotnet-build-and-first-lesson-contracts, content-shard-static, isolated-grade12-73-lesson-authenticated-https]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner academic authorization and independent Stage D runtime release evidence (fail closed)
        run: node tools/curriculum/g12_stage_d_final_gate.cjs
  isolated-grade12-73-lesson-authenticated-https:
    runs-on: ubuntu-latest
    needs: structural-source-inventory
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: 'US-CCSS'
      EDULYTICS_CI_G12_PRECALC: 'true'
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile isolated Grade12 HTTPS probe
        run: python3 -m py_compile tools/phase29/g12_stage_d_authenticated_https.py
      - name: Build published web artifact and migrate disposable PostgreSQL
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln --no-restore --configuration Release
          dotnet publish src/Edulytics.Web/Edulytics.Web.csproj --configuration Release --no-restore --output /tmp/g12-web-publish
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Test 73 learner pages and persisted Practice with secondary school fixture
        env:
          Edulytics__Deployment__CleanBootstrap: 'false'
          Edulytics__MeetingDemo__ResetAndSeed: 'true'
          Edulytics__Deployment__RunStartupMigrations: 'false'
          RENDER_SERVICE_ID: ci-disposable
        run: |
          set -euo pipefail
          export Edulytics__MeetingDemo__Password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$Edulytics__MeetingDemo__Password"
          if ! dotnet run --project tools/Edulytics.CiFixtures/Edulytics.CiFixtures.csproj -- academic > /tmp/g12-fixture.log 2>&1; then
            echo 'Grade12 disposable school fixture did not complete'
            tail -n 100 /tmp/g12-fixture.log
            exit 1
          fi
          grep -q 'MEETING_DEMO_SEED_COMPLETED' /tmp/g12-fixture.log
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/g12-key.pem -out /tmp/g12-cert.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          openssl pkcs12 -export -out /tmp/g12-identity.pfx \
            -inkey /tmp/g12-key.pem -in /tmp/g12-cert.pem \
            -passout pass:local-test-tls >/dev/null 2>&1
          cp /tmp/g12-cert.pem /tmp/phase-uat-cert.pem
          export ASPNETCORE_URLS='https://127.0.0.1:5052'
          export ASPNETCORE_Kestrel__Certificates__Default__Path=/tmp/g12-identity.pfx
          export ASPNETCORE_Kestrel__Certificates__Default__Password=local-test-tls
          export Edulytics__MeetingDemo__ResetAndSeed='false'
          export ASPNETCORE_CONTENTROOT=/tmp/g12-web-publish
          dotnet /tmp/g12-web-publish/Edulytics.Web.dll > /tmp/g12-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 100); do
            if curl --fail --silent --cacert /tmp/phase-uat-cert.pem https://localhost:5052/health/ready > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -n 100 /tmp/g12-web.log
              exit 1
            fi
            sleep 3
          done
          test "$ready" = true
          if ! python3 tools/phase29/g12_stage_d_authenticated_https.py; then
            echo 'Grade12 authenticated runtime encountered an application exception; sanitized disposable web diagnostics:'
            tail -n 180 /tmp/g12-web.log | grep -Ev 'password|Password|password=' || true
            exit 1
          fi
      - name: Preserve genuine Grade12 disposable E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g12-stage-d-authenticated-73-learner-lessons-and-practice
          path: /tmp/g12-stage-d-authenticated-73-lessons.json
          if-no-files-found: warn
          retention-days: 14
