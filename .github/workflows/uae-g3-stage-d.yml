name: UAE Grade 3 Common Arabic Stage D - fail-closed candidate gates

on:
  push:
    branches: [curriculum/uae-g3-arabic-a-b-c-20261109]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/uae-g3-stage-d.yml'
      - 'tools/curriculum/uae_g3_stage_d_gate.py'
      - 'artifacts/curriculum-delivery/UAE-MOE-MATH/G3/**'
      - 'src/Edulytics.Core/Curriculum/**'
      - 'src/Edulytics.Services/Mathematics/**'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uae-g3-stage-d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  CI: 'true'

jobs:
  structural:
    name: G3 109 unique IDs and Arabic lesson contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/curriculum/uae_g3_stage_d_gate.py --phase structural
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-stage-d-structural-${{ github.run_id }}
          path: artifacts/uae-g3-stage-d/grade3-structural-gate.json
          retention-days: 30

  source_handoff:
    name: G3 source/teacher/2026-27 parity gate (fail closed)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/curriculum/uae_g3_stage_d_gate.py --phase handoff
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-stage-d-source-${{ github.run_id }}
          path: artifacts/uae-g3-stage-d/grade3-handoff-gate.json
          retention-days: 30

  dotnet:
    name: G3 shared build, exact math and G1-G2-US regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - name: Restore solution once
        run: dotnet restore Edulytics.sln
      - name: Compile solution including G3 questions and all test sources
        run: dotnet build Edulytics.sln -c Release --no-restore
      - name: Run UAE Grade 3 unit and exact mathematics tests
        run: |
          mkdir -p artifacts/uae-g3-stage-d/trx
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-build --no-restore \
            --filter 'FullyQualifiedName~UaeGrade3' \
            --logger 'trx;LogFileName=uae-g3-math.trx' \
            --results-directory artifacts/uae-g3-stage-d/trx
      - name: Run UAE G1/G2 and US learner-content regressions
        run: |
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-build --no-restore \
            --filter 'FullyQualifiedName~UaeGrade1Arabic|FullyQualifiedName~UaeGrade1Related|FullyQualifiedName~UaeGrade2|FullyQualifiedName~Phase29LessonReaderFinalPolishTests|FullyQualifiedName~Phase29LessonContentVisualContractTests|FullyQualifiedName~CommonCorePhase04SourceEntityPresentationTests' \
            --logger 'trx;LogFileName=g1-g2-us-regressions.trx' \
            --results-directory artifacts/uae-g3-stage-d/trx
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-stage-d-dotnet-${{ github.run_id }}
          path: artifacts/uae-g3-stage-d/trx/
          if-no-files-found: ignore
          retention-days: 30

  final:
    name: G3 final candidate - evidence-linked fail-closed release gate
    if: always()
    needs: [structural, source_handoff, dotnet, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download authenticated HTTPS Practice evidence for this run
        uses: actions/download-artifact@v4
        with:
          name: uae-g3-stage-d-109-authenticated-https-${{ github.run_id }}
          path: artifacts/uae-g3-stage-d/runtime/
      - name: Download desktop/mobile Chromium screenshots for this run
        uses: actions/download-artifact@v4
        with:
          name: uae-g3-stage-d-browser-rtl-${{ github.run_id }}
          path: artifacts/uae-g3-stage-d/browser/
      - name: Retrieve current-run structural source identity artifact
        uses: actions/download-artifact@v4
        with:
          name: g3-stage-d-structural-${{ github.run_id }}
          path: artifacts/uae-g3-stage-d/structural/
      - name: Retrieve current-run selected local-source proof
        uses: actions/download-artifact@v4
        with:
          name: g3-stage-d-source-${{ github.run_id }}
          path: artifacts/uae-g3-stage-d/source/
      - name: Retrieve current-run .NET test result artifacts
        uses: actions/download-artifact@v4
        with:
          name: g3-stage-d-dotnet-${{ github.run_id }}
          path: artifacts/uae-g3-stage-d/trx/
      - name: Evaluate dependency status and actual evidence artifacts
        env:
          STRUCTURAL_JOB_RESULT: ${{ needs.structural.result }}
          SOURCE_JOB_RESULT: ${{ needs.source_handoff.result }}
          DOTNET_JOB_RESULT: ${{ needs.dotnet.result }}
          E2E_JOB_RESULT: ${{ needs.e2e.result }}
        run: python3 tools/curriculum/uae_g3_stage_d_gate.py --phase final
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-stage-d-final-${{ github.run_id }}
          path: artifacts/uae-g3-stage-d/grade3-final-gate.json
          retention-days: 30

  e2e:
    name: UAE G3 all 109 Arabic learner pages + 327 persisted Practice attempts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: UAE-G3
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile dedicated UAE G3 HTTPS and Chromium RTL probes
        run: |
          python3 -m py_compile tools/curriculum/uae_g3_stage_d_authenticated_https.py
          python3 -m py_compile tools/curriculum/uae_g3_stage_d_browser_rtl.py
      - name: Build and migrate disposable PostgreSQL only
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln --configuration Release --no-restore
          dotnet publish src/Edulytics.Web/Edulytics.Web.csproj --configuration Release --no-restore --output /tmp/g2-web-publish
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Install pinned Playwright Chromium for real Arabic desktop/mobile screenshots
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
      - name: Real HTTPS with four authenticated UAE roles and all 109 pages/327 persisted grades
        env:
          Edulytics__Deployment__CleanBootstrap: 'false'
          Edulytics__MeetingDemo__ResetAndSeed: 'true'
          Edulytics__Deployment__RunStartupMigrations: 'false'
          RENDER_SERVICE_ID: ci-disposable
        run: |
          set -euo pipefail
          export Edulytics__MeetingDemo__Password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$Edulytics__MeetingDemo__Password"
          if ! dotnet run --project tools/Edulytics.CiFixtures/Edulytics.CiFixtures.csproj -- academic > /tmp/g2-fixture.log 2>&1; then
            echo 'UAE Grade3 disposable school fixture did not complete'
            tail -n 90 /tmp/g2-fixture.log | grep -Eiv 'password|credential|secret' || true
            exit 1
          fi
          grep -q 'MEETING_DEMO_SEED_COMPLETED' /tmp/g2-fixture.log
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/g2-key.pem -out /tmp/g2-cert.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          openssl pkcs12 -export -out /tmp/g2-identity.pfx \
            -inkey /tmp/g2-key.pem -in /tmp/g2-cert.pem \
            -passout pass:local-test-tls >/dev/null 2>&1
          cp /tmp/g2-cert.pem /tmp/phase-uat-cert.pem
          export ASPNETCORE_URLS='https://127.0.0.1:5052'
          export ASPNETCORE_Kestrel__Certificates__Default__Path=/tmp/g2-identity.pfx
          export ASPNETCORE_Kestrel__Certificates__Default__Password=local-test-tls
          export Edulytics__MeetingDemo__ResetAndSeed='false'
          export ASPNETCORE_CONTENTROOT=/tmp/g2-web-publish
          dotnet /tmp/g2-web-publish/Edulytics.Web.dll > /tmp/g2-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 100); do
            if curl --fail --silent --cacert /tmp/phase-uat-cert.pem https://localhost:5052/health/ready > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -n 110 /tmp/g2-web.log | grep -Eiv 'password|credential|secret' || true
              exit 1
            fi
            sleep 3
          done
          test "$ready" = true
          if ! python3 tools/curriculum/uae_g3_stage_d_authenticated_https.py; then
            echo 'UAE Grade3 authenticated isolated HTTPS probe failed; sanitized app diagnostics:'
            tail -n 130 /tmp/g2-web.log | grep -Eiv 'password|credential|secret' || true
            exit 1
          fi
          # A real Chromium engine, not HTML markers alone: both desktop/mobile,
          # every canonical Arabic lesson and eight full-page evidence images.
          if ! python3 tools/curriculum/uae_g3_stage_d_browser_rtl.py; then
            echo 'UAE Grade3 authenticated Chromium RTL visual smoke probe failed'
            tail -n 90 /tmp/g2-web.log | grep -Eiv 'password|credential|secret' || true
            exit 1
          fi
      - name: Preserve real UAE Grade3 disposable E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-g3-stage-d-109-authenticated-https-${{ github.run_id }}
          path: /tmp/uae-g3-stage-d-authenticated-109-lessons.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve Grade3 real Chromium RTL screenshot and responsive DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-g3-stage-d-browser-rtl-${{ github.run_id }}
          path: /tmp/uae-g3-stage-d-browser-rtl/
          if-no-files-found: warn
          retention-days: 30
