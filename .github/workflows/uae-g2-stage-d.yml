name: UAE Grade 2 Arabic Stage D - actual isolated candidate checks
on:
  push:
    branches: [curriculum/uae-g2-arabic-abc-20261109]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/uae-g2-stage-d.yml'
      - 'tools/curriculum/uae_g2_stage_d_gate.py'
      - 'artifacts/curriculum-delivery/UAE-MOE-MATH/G2/**'
      - 'src/Edulytics.Core/Curriculum/**'
      - 'src/Edulytics.Services/Mathematics/**'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uae-g2-stage-d-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
jobs:
  structural:
    name: G2 exact 99 lesson identities and Arabic bodies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/curriculum/uae_g2_stage_d_gate.py --phase structural
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-stage-d-structural
          path: artifacts/uae-g2-stage-d/
  source:
    name: G2 source parity and edition gate - fail closed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/curriculum/uae_g2_stage_d_gate.py --phase source
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-stage-d-source
          path: artifacts/uae-g2-stage-d/
  dotnet:
    name: G2 shared build and real question verifier/regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - run: dotnet restore Edulytics.sln
      - run: dotnet build Edulytics.sln --configuration Release --no-restore
      - name: Execute all Grade 2 written-but-unrun exact-family tests
        run: |
          mkdir -p artifacts/uae-g2-stage-d/trx
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --configuration Release --no-build --no-restore \
            --filter 'FullyQualifiedName~UaeGrade2' --logger 'trx;LogFileName=grade2-math.trx' \
            --results-directory artifacts/uae-g2-stage-d/trx
      - name: G1 shared and US learner content regressions
        run: |
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --configuration Release --no-build --no-restore \
            --filter 'FullyQualifiedName~UaeGrade1Arabic|FullyQualifiedName~UaeGrade1Related|FullyQualifiedName~Phase29LessonReaderFinalPolishTests|FullyQualifiedName~Phase29LessonContentVisualContractTests' \
            --logger 'trx;LogFileName=grade1-us-regression.trx' --results-directory artifacts/uae-g2-stage-d/trx
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-stage-d-dotnet
          path: artifacts/uae-g2-stage-d/trx/
          if-no-files-found: ignore
  final:
    name: G2 final candidate truth - not equivalent to publication
    runs-on: ubuntu-24.04
    if: always()
    needs: [structural, source, dotnet, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Evidence-bound fail-closed summary
        env:
          STRUCTURAL_JOB_RESULT: ${{ needs.structural.result }}
          SOURCE_JOB_RESULT: ${{ needs.source.result }}
          DOTNET_JOB_RESULT: ${{ needs.dotnet.result }}
          AUTHENTICATED_E2E_JOB_RESULT: ${{ needs.e2e.result }}
          ARABIC_BROWSER_JOB_RESULT: ${{ needs.e2e.result }}
        run: python3 tools/curriculum/uae_g2_stage_d_gate.py --phase final
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-stage-d-final
          path: artifacts/uae-g2-stage-d/
  e2e:
    name: UAE G2 all 99 Arabic learner pages + 297 persisted Practice attempts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: UAE-G2
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile dedicated UAE G2 HTTPS and Chromium RTL probes
        run: |
          python3 -m py_compile tools/curriculum/uae_g2_stage_d_authenticated_https.py
          python3 -m py_compile tools/curriculum/uae_g2_stage_d_browser_rtl.py
      - name: Build and migrate disposable PostgreSQL only
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln --configuration Release --no-restore
          dotnet publish src/Edulytics.Web/Edulytics.Web.csproj --configuration Release --no-restore --output /tmp/g2-web-publish
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Install pinned Playwright Chromium for real Arabic desktop/mobile screenshots
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
      - name: Real HTTPS with four authenticated UAE roles and all 99 pages/297 persisted grades
        env:
          Edulytics__Deployment__CleanBootstrap: 'false'
          Edulytics__MeetingDemo__ResetAndSeed: 'true'
          Edulytics__Deployment__RunStartupMigrations: 'false'
          RENDER_SERVICE_ID: ci-disposable
        run: |
          set -euo pipefail
          export Edulytics__MeetingDemo__Password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$Edulytics__MeetingDemo__Password"
          if ! dotnet run --project tools/Edulytics.CiFixtures/Edulytics.CiFixtures.csproj -- academic > /tmp/g2-fixture.log 2>&1; then
            echo 'UAE Grade2 disposable school fixture did not complete'
            tail -n 90 /tmp/g2-fixture.log | grep -Eiv 'password|credential|secret' || true
            exit 1
          fi
          grep -q 'MEETING_DEMO_SEED_COMPLETED' /tmp/g2-fixture.log
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/g2-key.pem -out /tmp/g2-cert.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          openssl pkcs12 -export -out /tmp/g2-identity.pfx \
            -inkey /tmp/g2-key.pem -in /tmp/g2-cert.pem \
            -passout pass:local-test-tls >/dev/null 2>&1
          cp /tmp/g2-cert.pem /tmp/phase-uat-cert.pem
          export ASPNETCORE_URLS='https://127.0.0.1:5052'
          export ASPNETCORE_Kestrel__Certificates__Default__Path=/tmp/g2-identity.pfx
          export ASPNETCORE_Kestrel__Certificates__Default__Password=local-test-tls
          export Edulytics__MeetingDemo__ResetAndSeed='false'
          export ASPNETCORE_CONTENTROOT=/tmp/g2-web-publish
          dotnet /tmp/g2-web-publish/Edulytics.Web.dll > /tmp/g2-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 100); do
            if curl --fail --silent --cacert /tmp/phase-uat-cert.pem https://localhost:5052/health/ready > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -n 110 /tmp/g2-web.log | grep -Eiv 'password|credential|secret' || true
              exit 1
            fi
            sleep 3
          done
          test "$ready" = true
          if ! python3 tools/curriculum/uae_g2_stage_d_authenticated_https.py; then
            echo 'UAE Grade2 authenticated isolated HTTPS probe failed; sanitized app diagnostics:'
            tail -n 130 /tmp/g2-web.log | grep -Eiv 'password|credential|secret' || true
            exit 1
          fi
          # A real Chromium engine, not HTML markers alone: both desktop/mobile,
          # every canonical Arabic lesson and eight full-page evidence images.
          if ! python3 tools/curriculum/uae_g2_stage_d_browser_rtl.py; then
            echo 'UAE Grade2 authenticated Chromium RTL visual smoke probe failed'
            tail -n 90 /tmp/g2-web.log | grep -Eiv 'password|credential|secret' || true
            exit 1
          fi
      - name: Preserve real UAE Grade2 disposable E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-g2-stage-d-99-authenticated-https-${{ github.run_id }}
          path: /tmp/uae-g2-stage-d-authenticated-99-lessons.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve Grade2 real Chromium RTL screenshot and responsive DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-g2-stage-d-browser-rtl-${{ github.run_id }}
          path: /tmp/uae-g2-stage-d-browser-rtl/
          if-no-files-found: warn
          retention-days: 30

