name: Mathematics Intelligence Foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/Edulytics.Core/Mathematics/**'
      - 'src/Edulytics.Core/Curriculum/LessonContent/**'
      - 'src/Edulytics.Core/Edulytics.Core.csproj'
      - 'src/Edulytics.Data/Seeding/**'
      - 'src/Edulytics.Services/Mathematics/**'
      - 'src/Edulytics.Services/Practice/**'
      - 'src/Edulytics.Web/Presentation/PracticeMathVisualRenderer.cs'
      - 'src/Edulytics.Web/Views/StudentPractice/Attempt.cshtml'
      - 'tools/math_intelligence/**'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/**'
      - '.github/workflows/math-intelligence-foundation.yml'
      - 'docs/math-v2/MATHEMATICS_PRACTICE_COMPLETION_MASTER_PLAN.md'
      - 'docs/math-v2/POLISH_1569_PRACTICE_REMEDIATION_MASTER_PLAN.md'
  push:
    branches:
      - main
    paths:
      - 'src/Edulytics.Core/Mathematics/**'
      - 'src/Edulytics.Core/Curriculum/LessonContent/**'
      - 'src/Edulytics.Core/Edulytics.Core.csproj'
      - 'src/Edulytics.Data/Seeding/**'
      - 'src/Edulytics.Services/Mathematics/**'
      - 'src/Edulytics.Services/Practice/**'
      - 'src/Edulytics.Web/Presentation/PracticeMathVisualRenderer.cs'
      - 'src/Edulytics.Web/Views/StudentPractice/Attempt.cshtml'
      - 'tools/math_intelligence/**'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/**'
      - '.github/workflows/math-intelligence-foundation.yml'
      - 'docs/math-v2/MATHEMATICS_PRACTICE_COMPLETION_MASTER_PLAN.md'
      - 'docs/math-v2/POLISH_1569_PRACTICE_REMEDIATION_MASTER_PLAN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue-skill-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Polish official-source audit dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet beautifulsoup4 pypdf
      - name: Reconstruct Polish official Outcome evidence
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/polish_outcome_source_audit.py --write-report
      - name: Run Mathematics V2 registry integrity audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/math_registry_integrity.py --strict --write-report
      - name: Run catalogue and SkillContract baseline audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/catalogue_skill_baseline.py --strict --write-report
      - name: Run deterministic lesson-skill candidate resolution audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/lesson_skill_resolution_audit.py --strict --write-report
      - name: Run deterministic lesson semantic-content audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/lesson_semantic_content_audit.py --strict --write-report
      - name: Run fail-closed V2 generation readiness audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/lesson_generation_readiness_audit.py --strict --write-report
      - name: Run Supporting Practice remediation closure audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/supporting_practice_remediation_closure_audit.py --strict --write-report
      - name: Build full Practice completion matrix
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/full_practice_completion_matrix.py --strict --require-complete --write-report
      - name: Publish full Practice completion dashboard
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(
              "artifacts/math-intelligence/full-practice-completion-matrix.json"
          ).read_text(encoding="utf-8"))
          s = report["summary"]
          lines = [
              "# Mathematics Practice Completion",
              "",
              f"- Catalogue lessons: **{s['lessonCount']:,}**",
              f"- Practice-eligible: **{s['practiceEligibleLessonCount']:,}**",
              f"- READY_VERIFIED: **{s['READY_VERIFIED']:,}**",
              f"- Non-standalone with evidence: **{s['NON_STANDALONE_WITH_EVIDENCE']:,}**",
              f"- Practice-eligible blocked: **{s.get('practiceEligibleBlockedCount', 0):,}**",
              f"- Completion: **{s['completionPercent']:.2f}%**",
              f"- Internal matrix blockers: **{s['internalBlockerCount']:,}**",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Run final Practice programme closure audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/practice_programme_final_closure_audit.py --strict --write-report
      - name: Run Stage 17 Grade 1-6 closure audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/stage17_grade1_6_closure_audit.py --strict --write-report
      - name: Run Stage 18 Practice migration closure audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/stage18_practice_closure_audit.py --strict --write-report
      - name: Run Stage 19 Assessment Builder migration closure audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/stage19_assessment_builder_closure_audit.py --strict --write-report
      - name: Run Stage 20 Diagnostic adaptive migration closure audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/stage20_diagnostic_adaptive_closure_audit.py --strict --write-report
      - name: Run Stage 21 Reassessment migration closure audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/stage21_reassessment_closure_audit.py --strict --write-report
      - name: Run Stage 22 Game runtime migration closure audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/stage22_game_runtime_closure_audit.py --strict --write-report
      - name: Run Stage 23 IGCSE Extended gate closure audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/stage23_igcse_extended_gate_audit.py --strict --write-report
      - name: Run Stage 24 AS/A-Level 9709 gate closure audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/stage24_as_a_level_9709_gate_audit.py --strict --write-report
      - name: Run Stage 25 IB AA HL-style gate closure audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/stage25_ib_aa_hl_style_gate_audit.py --strict --write-report
      - name: Run Stages 26-28 final production closure audit
        run: |
          set -euo pipefail
          python3 tools/math_intelligence/stage26_28_production_closure_audit.py --strict --write-report
      - name: Upload Mathematics Intelligence audits
        uses: actions/upload-artifact@v7.0.1
        with:
          name: math-intelligence-catalogue-baseline-${{ github.sha }}
          path: |
            artifacts/math-intelligence/pl-outcome-source-evidence.json
            artifacts/math-intelligence/math-registry-integrity.json
            artifacts/math-intelligence/catalogue-skill-baseline.json
            artifacts/math-intelligence/lesson-skill-resolution-audit.json
            artifacts/math-intelligence/lesson-semantic-content-audit.json
            artifacts/math-intelligence/lesson-generation-readiness-audit.json
            artifacts/math-intelligence/supporting-practice-remediation-closure-audit.json
            artifacts/math-intelligence/full-practice-completion-matrix.json
            artifacts/math-intelligence/supporting-practice-completion.json
            artifacts/math-intelligence/content-repair-audit.json
            artifacts/math-intelligence/lesson-skill-mapping-audit.json
            artifacts/math-intelligence/question-family-coverage-audit.json
            artifacts/math-intelligence/visual-representation-coverage-audit.json
            artifacts/math-intelligence/solver-verifier-coverage-audit.json
            artifacts/math-intelligence/difficulty-grade-coverage-audit.json
            artifacts/math-intelligence/practice-readiness-by-curriculum.json
            artifacts/math-intelligence/practice-readiness-by-domain.json
            artifacts/math-intelligence/practice-readiness-by-level.json
            artifacts/math-intelligence/practice-programme-final-closure-audit.json
            artifacts/math-intelligence/stage17-grade1-6-closure-audit.json
            artifacts/math-intelligence/stage18-practice-closure-audit.json
            artifacts/math-intelligence/stage19-assessment-builder-closure-audit.json
            artifacts/math-intelligence/stage20-diagnostic-adaptive-closure-audit.json
            artifacts/math-intelligence/stage21-reassessment-closure-audit.json
            artifacts/math-intelligence/stage22-game-runtime-closure-audit.json
            artifacts/math-intelligence/stage23-igcse-extended-gate-audit.json
            artifacts/math-intelligence/stage24-as-a-level-9709-gate-audit.json
            artifacts/math-intelligence/stage25-ib-aa-hl-style-gate-audit.json
            artifacts/math-intelligence/stage26-28-production-closure-audit.json
          retention-days: 14

  math-foundation-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Edulytics.sln
      - name: Run Mathematics Intelligence foundation tests
        run: |
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj \
            --configuration Release \
            --no-restore \
            --filter "FullyQualifiedName~MathematicsIntelligence"
