name: UAE Grade 9 General real isolated four-role E2E and 82x2 Arabic RTL

# Never use real schools, Neon or Render. Prepared G9 digital candidates are
# intentionally not READY_VERIFIED: this must fail until independent grader CI passes.
on:
  push:
    branches: [fix/g9-general-full-year-scope-86]
    paths:
      - '.github/workflows/uae-grade9-general-authenticated-e2e.yml'
      - 'tools/curriculum/uae_g9_stage_d_*.py'
      - 'tools/Edulytics.CiFixtures/MeetingDemoProvisioner.cs'
      - 'src/Edulytics.Core/Curriculum/**'
      - 'src/Edulytics.Services/**'
      - 'src/Edulytics.Web/**'
      - 'artifacts/curriculum-delivery/UAE-MOE-MATH/G9/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/uae-grade9-general-authenticated-e2e.yml'
      - 'tools/curriculum/uae_g9_stage_d_*.py'
      - 'tools/Edulytics.CiFixtures/MeetingDemoProvisioner.cs'
      - 'src/Edulytics.Core/Curriculum/**'
      - 'src/Edulytics.Services/**'
      - 'src/Edulytics.Web/**'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: g9-fourrole-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-82-lessons-160-practice-164-viewports:
    name: G9 real four-role HTTPS and 80 eligible digital lessons plus 2 teacher-only
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: 'true'
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: UAE-G9
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile checks and build clean disposable PostgreSQL 18
        run: |
          set -euo pipefail
          python3 -m py_compile tools/curriculum/uae_g9_stage_d_authenticated_https.py tools/curriculum/uae_g9_stage_d_browser_rtl.py
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
          dotnet publish src/Edulytics.Web/Edulytics.Web.csproj -c Release --no-restore -o /tmp/g9-web-publish
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Verify exact 82 Published G9 General Arabic DB identities
        run: |
          set -euo pipefail
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumPedagogicalLessons" WHERE "Code" LIKE '"'"'PED:UAE-MOE-MATH:L9:GENERAL:%'"'"'')" = 82
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumLessonContents" c JOIN "CurriculumPedagogicalLessons" p ON p."Id"=c."LessonNodeId" WHERE p."Code" LIKE '"'"'PED:UAE-MOE-MATH:L9:GENERAL:%'"'"' AND c."Status"=3')" = 82
      - name: Authenticate disposable G9 General student, teacher, supervisor, school admin; test all lessons
        env:
          Edulytics__Deployment__CleanBootstrap: 'false'
          Edulytics__MeetingDemo__ResetAndSeed: 'true'
          Edulytics__Deployment__RunStartupMigrations: 'false'
          RENDER_SERVICE_ID: ci-disposable
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
          export Edulytics__MeetingDemo__Password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$Edulytics__MeetingDemo__Password"
          if ! dotnet run --project tools/Edulytics.CiFixtures/Edulytics.CiFixtures.csproj -- academic > /tmp/g9-fixture.log 2>&1; then
            tail -n 80 /tmp/g9-fixture.log | grep -Eiv 'password|credential|secret|connection' || true
            exit 1
          fi
          grep -q 'MEETING_DEMO_SEED_COMPLETED' /tmp/g9-fixture.log
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/g9-key.pem -out /tmp/g9-cert.pem -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          openssl pkcs12 -export -out /tmp/g9-identity.pfx -inkey /tmp/g9-key.pem -in /tmp/g9-cert.pem -passout pass:local-test-tls >/dev/null 2>&1
          cp /tmp/g9-cert.pem /tmp/phase-uat-cert.pem
          export ASPNETCORE_URLS='https://127.0.0.1:5052'
          export ASPNETCORE_Kestrel__Certificates__Default__Path=/tmp/g9-identity.pfx
          export ASPNETCORE_Kestrel__Certificates__Default__Password=local-test-tls
          export Edulytics__MeetingDemo__ResetAndSeed='false'
          export ASPNETCORE_CONTENTROOT=/tmp/g9-web-publish
          dotnet /tmp/g9-web-publish/Edulytics.Web.dll >/tmp/g9-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent --cacert /tmp/phase-uat-cert.pem https://localhost:5052/health/ready >/dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 3
          done
          if [ "$ready" != true ]; then
            tail -n 80 /tmp/g9-web.log | grep -Eiv 'password|credential|secret|connection' || true
            exit 1
          fi
          python3 tools/curriculum/uae_g9_stage_d_authenticated_https.py || { tail -n 80 /tmp/g9-web.log | grep -Eiv 'password|credential|secret|connection' || true; exit 1; }
          python3 tools/curriculum/uae_g9_stage_d_browser_rtl.py
      - name: Assert real same-SHA 82 pages, 160 correct+wrong persisted, 164 Chromium RTL viewports
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,pathlib
          auth=json.loads(pathlib.Path('/tmp/uae-g9-stage-d-authenticated-82-lessons.json').read_text())
          rtl=json.loads(pathlib.Path('/tmp/uae-g9-stage-d-browser-rtl/report.json').read_text())
          assert auth['candidateSha']==rtl['candidateSha']==os.environ['GITHUB_SHA']
          assert auth['grade']==9 and auth['lessonPageCount']==82
          assert auth['eligibleDigital']==80 and auth['teacherOnly']==2
          assert auth['correctAttemptPersistenceCount']==auth['wrongAttemptPersistenceCount']==80
          assert auth['malformedAttemptRejectionCount']==80
          assert auth['crossSchoolAccessDenied'] is True
          assert all(auth['roleLogins'].values())
          assert auth['negativeEnglishFallbackChecks']==82
          assert rtl['rtlDesktopLessons']==rtl['rtlMobileLessons']==82
          assert rtl['screenshotsWritten']>=10
          assert auth['sourceLiteralParity']=='UNKNOWN'
          assert auth['productionWritten'] is False and rtl['productionWritten'] is False
          pathlib.Path('artifacts/uae-g9-stage-d').mkdir(parents=True,exist_ok=True)
          pathlib.Path('artifacts/uae-g9-stage-d/grade9-e2e.json').write_text(
            json.dumps({'candidateSha':os.environ['GITHUB_SHA'],'status':'PASS',
            'authenticatedLearnerPages':82,'persistedValidPracticeAttempts':160,
            'malformedPracticeRejections':80,'teacherOnly':2,
            'chromiumDesktopAndMobilePages':164,'sourceLiteralParity':'UNKNOWN',
            'productionWritten':False},indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade9-authenticated-e2e-and-rtl
          path: |
            artifacts/uae-g9-stage-d/grade9-e2e.json
            /tmp/uae-g9-stage-d-authenticated-82-lessons.json
            /tmp/uae-g9-stage-d-browser-rtl/report.json
          if-no-files-found: warn
          retention-days: 30

# Not a release by itself. Real eligible digital math grader and exact-SHA CI
# must pass before merge, Render deploy or Neon scoped production import.
