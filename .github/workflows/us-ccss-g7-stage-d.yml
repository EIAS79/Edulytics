name: Grade 7 Stage D technical diagnostics
on:
  push:
    branches: [curriculum/us-ccss-g7-full-grade-20261028]
    paths:
      - '.github/workflows/us-ccss-g7-stage-d.yml'
      - 'tools/curriculum/g7-stage-d-inventory.cjs'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G7/**'
      - 'src/Edulytics.Core/**'
      - 'src/Edulytics.Services/Mathematics/**'
      - 'src/Edulytics.Web/Views/Shared/_USCCSSG7**'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssG7**'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/USCCSSG7**'
      - 'tests/academic-us-ccss-g7-**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/us-ccss-g7-stage-d.yml'
      - 'tools/curriculum/g7-stage-d-inventory.cjs'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G7/**'
      - 'src/Edulytics.Core/**'
      - 'src/Edulytics.Services/Mathematics/**'
      - 'src/Edulytics.Web/Views/Shared/_USCCSSG7**'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssG7**'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/USCCSSG7**'
      - 'tests/academic-us-ccss-g7-**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/curriculum/g7-stage-d-inventory.cjs
  source-shards:
    needs: inventory
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        batch: [D1, D2, D3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - shell: bash
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          mapfile -t files < <(node tools/curriculum/g7-stage-d-inventory.cjs shard "$BATCH")
          node --test "${files[@]}"
  richv2:
    needs: inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/academic-us-ccss-g7-full-grade-candidate.test.cjs
  dotnet-math:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - run: dotnet restore tests/Edulytics.Tests/Edulytics.Tests.csproj
      - run: dotnet build tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-restore
      - run: |
          mkdir -p stage-d-results
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~UsCcssG7|FullyQualifiedName~USCCSSG7' --logger 'trx;LogFileName=g7.trx' --results-directory stage-d-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade7-test-results
          path: stage-d-results/
          if-no-files-found: warn
  source-handoff-report:
    needs: inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Distinguish the A-B-C academic review evidence from Stage D runtime tests
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),base='artifacts/curriculum-delivery/US-CCSS-MATH/G7';
          const files=fs.readdirSync(base).filter(x=>/^grade7-u\d\d-l\d\d-abc-cursor\.json$/.test(x));
          if(files.length!==145)throw Error('Expected 145 A-B-C handoffs');
          const pending=files.filter(f=>{const x=JSON.parse(fs.readFileSync(path.join(base,f),'utf8'));return !Number.isInteger(x.sourceElementCount)||x.sourceElementCount<=0||x.sourceElementCount!==x.verifiedEquivalentElementCount});
          console.log('Separate source-element parity evidence pending:',pending.length,'/145');
          console.log('Tracked as A-B-C evidence issue #622; no Stage D runtime defect claimed.');
          if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'A-B-C per-element parity unverified: '+pending.length+'/145. Issue #622. Technical test PASS is not academic acceptance or release.\n');
          NODE
  technical-summary:
    if: always()
    needs: [inventory, source-shards, richv2, dotnet-math]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce scoped technical outcomes
        env:
          A: ${{ needs.inventory.result }}
          B: ${{ needs.source-shards.result }}
          C: ${{ needs.richv2.result }}
          D: ${{ needs.dotnet-math.result }}
        run: |
          test "$A" = success && test "$B" = success && test "$C" = success && test "$D" = success
          echo 'G7 technical diagnostics passed. Authenticated E2E, accessibility and production deployment NOT_RUN.'
