name: US CCSS ten-lesson certification (T001)

on:
  # Read-only T001 validation on every audited branch push, even while the
  # broad historical PR remains draft. Push NEVER authorizes release.
  push:
    branches:
      - 'audit/us-ccss-b01-500-lesson-certification'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/curriculum/US_CCSS_GRADE_BY_GRADE_LESSON_ACADEMIC_CERTIFICATION_PLAN.md'
      - 'artifacts/academic-us-ccss/batches/T001-lesson-manifest.json'
      - 'artifacts/academic-us-ccss/04-lesson-certification-records.json'
      - 'tools/us-ccss-t001-release-gate.cjs'
      - 'tools/us-ccss-lesson-certification-records.cjs'
      - 'tools/us-ccss-b01-release-gate.cjs'
      - 'tests/academic-us-ccss-t001-release-gate.test.cjs'
      - 'src/Edulytics.Data/Seeding/**'
      - 'src/Edulytics.Services/LessonContent/**'
      - 'src/Edulytics.Services/Mathematics/UsCcssB01SourceTaskQuestionEngine.cs'
      - 'src/Edulytics.Core/Mathematics/Practice/UsCcssB01SourceAlignedPracticeCorrections.cs'
      - 'src/Edulytics.Core/Mathematics/Generation/question-family-registry.v1.json'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/UsCcssT001FirstTenSourceAndPracticeTests.cs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usccss-ten-t001-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-t001-10:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test exactly ten lessons and immutable evidence guards
        run: node --test tests/academic-us-ccss-t001-release-gate.test.cjs
      - name: Report T001 only (NO-GO is a truthful progress result)
        run: node tools/us-ccss-t001-release-gate.cjs --status

  verify-t001-academic-engine-and-visuals:
    needs: [inspect-t001-10]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - name: Restore production assembly and exact practice test project
        run: dotnet restore tests/Edulytics.Tests/Edulytics.Tests.csproj
      - name: Verify ten source-accurate contracts, graded arithmetic, and materialized content
        run: |
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-restore \
            --filter 'FullyQualifiedName~UsCcssT001FirstTenSourceAndPracticeTests|FullyQualifiedName~UsCcssB01V9LearnerVoiceSharedRootCorrectionTests|FullyQualifiedName~UsCcssB01SourceAlignedPracticeCorrectionTests|FullyQualifiedName~UsCcssB01V9UnrelatedGeometryConceptRuleCorrectionsTests|FullyQualifiedName~UsCommonCoreB01CollectiveRichV2AuditTests' \
            --logger 'console;verbosity=normal'

  release-t001-10-only:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    needs: [inspect-t001-10, verify-t001-academic-engine-and-visuals]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refuse T001 until all ten independently pass L1-L6 and eight dimensions
        run: node tools/us-ccss-t001-release-gate.cjs --release-check --head-sha=${{ github.event.pull_request.head.sha }}
      - name: Refuse merging this old all-500 PR as a ten-lesson deployment
        shell: bash
        run: |
          if [[ "${{ github.event.pull_request.number }}" == "492" ]]; then
            echo "::error::PR #492 contains historical all-500 changes. Isolate a ten-lesson deploy candidate branch before publishing T001."
            exit 1
          fi
