name: V7 validation

on:
  push:
    branches:
      - fix/assessment-type-ux-v7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.200"

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Edulytics.sln

      - name: Build
        run: dotnet build Edulytics.sln --no-restore

      - name: Full regression
        run: dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-build --no-restore

      - name: Localization parity
        run: python3 scripts/ci-localization-parity.py

      - name: Architecture gate
        run: python3 scripts/ci-architecture-gate.py
