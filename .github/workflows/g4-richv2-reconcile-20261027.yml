name: Grade 4 Rich V2 runtime and source contract
on:
  push:
    branches:
      - curriculum/g4-sequential-abc-20261026
    paths:
      - '.github/workflows/g4-richv2-reconcile-20261027.yml'
      - 'tools/curriculum/g4-richv2-full-grade-audit.cjs'
      - 'src/Edulytics.Core/Curriculum/LessonContent/RichV2/us-ccss-g4-ordinal-*-2021.rich-lesson-v2.json'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G4/g4-101-149-richv2-practice-audit.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade4-richv2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/curriculum/g4-richv2-full-grade-audit.cjs
      - run: node tools/curriculum/g4-reconcile-richv2.cjs --check
      - run: node --test tests/academic-us-ccss-g4-richv2-materialization.test.cjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --filter FullyQualifiedName~Grade4RichV2RegistryRuntimeTests --configuration Release --verbosity minimal
