name: US CCSS Academic Certification Evidence Safety

# Green means the evidence gate is correctly enforced, NOT that the
# curriculum is academically certified or safe to publish.
on:
  push:
    branches:
      - audit/us-ccss-b01-500-lesson-certification
    paths:
      - 'artifacts/academic-us-ccss/certification-evidence/**'
      - 'tests/academic-us-ccss-b01-l02-l6-candidate-record.test.cjs'
      - '.github/workflows/us-ccss-academic-certification-evidence.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/curriculum/EDULYTICS_US_CCSS_ACADEMIC_CERTIFICATION_EXECUTION_PLAN_2026-10-11.md'
      - 'tools/us-ccss-certification-gate.cjs'
      - 'tools/us-ccss-official-text-audit.cjs'
      - 'tests/us-ccss-official-html-math-notation.test.cjs'
      - 'tests/academic-us-ccss-certification-gate.test.cjs'
      - 'tests/academic-us-ccss-lesson-records.test.cjs'
      - 'tests/academic-us-ccss-phase04-hs-repairs.test.cjs'
      - 'tests/academic-us-ccss-g1-whole-grade-review.test.cjs'
      - 'tests/academic-us-ccss-g1-source-guarded-corrections.test.cjs'
      - 'tests/academic-us-ccss-g1-seven-topic-repairs.test.cjs'
      - 'tests/academic-us-ccss-g1-six-local-source-corrections.test.cjs'
      - 'tests/academic-us-ccss-g1-all-publisher-sources.test.cjs'
      - 'tests/academic-us-ccss-g1-student-source-146.test.cjs'
      - 'artifacts/academic-us-ccss/grade-reports/G01-146-local-student-html-sources.json'
      - 'tests/academic-us-ccss-g1-six-source-goal-teaching-repairs.test.cjs'
      - 'artifacts/academic-us-ccss/grade-reports/G01-six-source-goal-content-repairs.json'
      - 'artifacts/academic-us-ccss/grade-reports/G01-146-local-teacher-source-evidence.json'
      - 'artifacts/academic-us-ccss/grade-reports/G01-six-local-source-verified-corrections.json'
      - 'artifacts/academic-us-ccss/grade-reports/G01-seven-topic-mismatch-corrections.json'
      - 'src/Edulytics.Data/Seeding/CommonCoreG1SourceGroundedInstructionalCorrections.cs'
      - 'src/Edulytics.Core/Curriculum/LessonContent/Packs/us-ccss-math-g1-phase29-v1.lesson-content-pack.json'
      - 'docs/curriculum/us-ccss-phase04-hs-content-repair-pilot.json'
      - 'src/Edulytics.Core/Curriculum/LessonContent/Packs/us-ccss-math-hs-complex-phase29-v1.lesson-content-pack.json'
      - 'src/Edulytics.Core/Curriculum/LessonContent/Packs/us-ccss-math-hs-adv-alg-func-phase29-v1.lesson-content-pack.json'
      - 'src/Edulytics.Core/Curriculum/LessonContent/Packs/us-ccss-math-hs-vector-matrix-phase29-v1.lesson-content-pack.json'
      - 'tools/us-ccss-lesson-certification-records.cjs'
      - 'tools/us-ccss-license-edition-policy.cjs'
      - 'tools/us-ccss-publisher-clause-reconciliation.cjs'
      - 'tests/academic-us-ccss-publisher-reconciliation.test.cjs'
      - 'tools/us-ccss-three-orphan-clause-shadow.cjs'
      - 'tests/academic-us-ccss-three-orphan-clause-shadow.test.cjs'
      - 'tools/us-ccss-orphan-child-source-review.cjs'
      - 'tests/academic-us-ccss-orphan-child-source-review.test.cjs'
      - 'tests/academic-us-ccss-license-edition.test.cjs'
      - 'docs/curriculum/EDULYTICS_US_CCSS_ACADEMIC_CERTIFICATION_EXECUTION_PLAN_V1_1.md'
      - 'artifacts/academic-us-ccss/**'
      - '.github/workflows/us-ccss-academic-certification-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-academic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Protect official math superscripts and operator comparisons
        run: node --test tests/us-ccss-official-html-math-notation.test.cjs
      - name: Check evidence gate unit tests
        run: node --test tests/academic-us-ccss-certification-gate.test.cjs
      - name: Screen the 17 publisher blueprint editions and check commercial licence guardrails
        run: |
          node --test tests/academic-us-ccss-license-edition.test.cjs
          node tools/us-ccss-license-edition-policy.cjs
      - name: Recompute 121 publisher child-clause claims and reject false certifications
        run: node --test tests/academic-us-ccss-publisher-reconciliation.test.cjs
      - name: Validate independent numerical shadow cases for three parent-only US subclauses
        run: |
          node --test tests/academic-us-ccss-three-orphan-clause-shadow.test.cjs
          node tools/us-ccss-three-orphan-clause-shadow.cjs --check
      - name: Verify 15 unresolved child-standard source gaps and candidate families without promotion
        run: |
          node --test tests/academic-us-ccss-orphan-child-source-review.test.cjs
          node tools/us-ccss-orphan-child-source-review.cjs --check > /tmp/us-ccss-orphan-source-evidence.json
      - name: Recheck seven exact HS learner-body repairs and independent mathematics
        run: node --test tests/academic-us-ccss-phase04-hs-repairs.test.cjs
      - name: Verify three Grade 1 source-pinned mathematical teaching repairs
        run: node --test tests/academic-us-ccss-g1-source-guarded-corrections.test.cjs
      - name: Verify seven G1 measurement, geometry and clock repairs
        run: node --test tests/academic-us-ccss-g1-seven-topic-repairs.test.cjs
      - name: Verify six G1 local-source-corroborated content repairs
        run: node --test tests/academic-us-ccss-g1-six-local-source-corrections.test.cjs
      - name: Verify local original publisher source identity for all 146 G1 lessons
        run: node --test tests/academic-us-ccss-g1-all-publisher-sources.test.cjs
      - name: Verify all 146 G1 local original student lesson pages without asserting Edulytics rendering
        run: node --test tests/academic-us-ccss-g1-student-source-146.test.cjs
      - name: Verify six G1 teacher-goal-aligned learner-body corrections
        run: node --test tests/academic-us-ccss-g1-six-source-goal-teaching-repairs.test.cjs
      - name: Check all 146 G1 source review rows without granting signoff
        run: node --test tests/academic-us-ccss-g1-whole-grade-review.test.cjs
      - name: Verify permanent G1 L02 authenticated L6 witness against current ledger; never auto-certify
        run: node --test tests/academic-us-ccss-b01-l02-l6-candidate-record.test.cjs
      - name: Validate all 1560 lesson certification ledger records (no signoff granted)
        run: |
          node --test tests/academic-us-ccss-lesson-records.test.cjs
          node tools/us-ccss-lesson-certification-records.cjs --check
      - name: Verify certification gate exit semantics without granting approval
        shell: bash
        run: |
          set -euo pipefail
          node tools/us-ccss-certification-gate.cjs > /tmp/us-ccss-certification.json
          decision="$(node -e "const d=require('/tmp/us-ccss-certification.json');process.stdout.write(d.decision)")"
          set +e
          node tools/us-ccss-certification-gate.cjs --strict > /tmp/us-ccss-strict.json
          code="$?"
          set -e
          case "$decision:$code" in
            'NO-GO:2'|'ACADEMICALLY_CERTIFIED_FULL:0')
              echo "Certification evidence enforcement behaved correctly: $decision"
              ;;
            *)
              echo "::error::Unexpected academic gate/exit pairing: $decision exit=$code"
              exit 1
              ;;
          esac
          test -z "$(git status --porcelain)"
