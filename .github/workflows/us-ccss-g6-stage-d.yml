name: Grade 6 Stage D 147-Lesson Diagnostics
on:
  push:
    branches: [curriculum/us-ccss-g6-full-grade-20261028]
    paths:
      - '.github/workflows/us-ccss-g6-stage-d.yml'
      - 'tools/curriculum/g6-stage-d-test-matrix.cjs'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G6/**'
      - 'tests/academic-us-ccss-g6-*.test.cjs'
      - 'tests/Edulytics.Tests/**/*.cs'
      - 'tests/Edulytics.Tests/Acceptance/LevelAwareMathematicsGenerationTests.cs'
      - 'src/Edulytics.Services/Edulytics.Services.csproj'
      - 'src/Edulytics.Core/Mathematics/**'
      - 'src/Edulytics.Services/Mathematics/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/us-ccss-g6-stage-d.yml'
      - 'tools/curriculum/g6-stage-d-test-matrix.cjs'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G6/**'
      - 'tests/academic-us-ccss-g6-*.test.cjs'
      - 'tests/Edulytics.Tests/**/*.cs'
      - 'tests/Edulytics.Tests/Acceptance/LevelAwareMathematicsGenerationTests.cs'
      - 'src/Edulytics.Services/Edulytics.Services.csproj'
      - 'src/Edulytics.Core/Mathematics/**'
      - 'src/Edulytics.Services/Mathematics/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node tools/curriculum/g6-stage-d-test-matrix.cjs verify
          mkdir -p /tmp/g6
          node tools/curriculum/g6-stage-d-test-matrix.cjs inventory > /tmp/g6/inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-147-lesson-inventory
          path: /tmp/g6/inventory.json
          if-no-files-found: warn
  build:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - run: |
          dotnet restore tests/Edulytics.Tests/Edulytics.Tests.csproj
          dotnet build tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-restore
          test -s tests/Edulytics.Tests/bin/Release/net10.0/Edulytics.Tests.dll
      - uses: actions/upload-artifact@v4
        with:
          name: g6-d-compiled-test-assemblies
          path: tests/Edulytics.Tests/bin/Release/net10.0/
          if-no-files-found: error
  math:
    needs: build
    name: g6-d-${{ matrix.batch }}-math
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        batch: [D1, D2, D3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/download-artifact@v4
        with:
          name: g6-d-compiled-test-assemblies
          path: tests/Edulytics.Tests/bin/Release/net10.0/
      - name: Execute per-lesson selected math suites with real VSTest
        shell: bash
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          FILTER="$(node tools/curriculum/g6-stage-d-test-matrix.cjs filter "$BATCH")"
          test -n "$FILTER"
          mkdir -p g6-stage-d-results
          dotnet vstest tests/Edulytics.Tests/bin/Release/net10.0/Edulytics.Tests.dll --TestCaseFilter:"$FILTER" --Logger:"trx;LogFileName=g6-$BATCH.trx" --ResultsDirectory:g6-stage-d-results
          test -s "g6-stage-d-results/g6-$BATCH.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-d-${{ matrix.batch }}-math-results
          path: g6-stage-d-results/
          if-no-files-found: warn
  node:
    needs: inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          set -euo pipefail
          set -- tests/academic-us-ccss-g6-*.test.cjs
          test -f "$1"
          mkdir -p g6-stage-d-results
          node --test "$@" > g6-stage-d-results/node.tap
          cat g6-stage-d-results/node.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-d-node-regressions
          path: g6-stage-d-results/
          if-no-files-found: warn
  reconcile:
    name: g6-d-exact-run-real-TRX-per-lesson
    needs: [inventory, build, math, node]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: g6-147-lesson-inventory
          path: g6-stage-d-inventory
      - uses: actions/download-artifact@v4
        with:
          pattern: g6-d-D*-math-results
          merge-multiple: true
          path: g6-stage-d-trx
      - name: Reject missing/failed/unattributed lesson tests in actual same-run TRX
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/curriculum/g6-stage-d-trx-reconcile.py \
            --inventory g6-stage-d-inventory/inventory.json \
            --trx-dir g6-stage-d-trx \
            --output g6-stage-d-reconciled/real-g6-per-lesson-math-only.json \
            --candidate-sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-d-147-real-per-lesson-math-evidence-NOT-release
          path: g6-stage-d-reconciled/
          if-no-files-found: warn
          retention-days: 30
  g6-authenticated-https:
    name: g6-d-147-isolated-postgres-authenticated-https
    needs: reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: 'US-CCSS-G6'
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject production databases, restrict work to disposable GitHub runner
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$EDULYTICS_CI_REHEARSAL" = true
          test "$EDULYTICS_CI_REHEARSAL_PROGRAMME" = US-CCSS-G6
          test "$EDULYTICS_CLEAN_DATABASE_NAME" = edulytics_clean_ci
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile tools/phase29/g6_stage_d_authenticated_https.py
      - name: Build/publish real web app and migrate local PostgreSQL 18
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln --no-restore
          dotnet publish src/Edulytics.Web/Edulytics.Web.csproj -c Release --no-restore --output /tmp/g6-d-web-publish
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Real HTTPS students, teachers, 147 lessons and persisted Practice attempts
        env:
          RENDER_SERVICE_ID: ci-disposable
          Edulytics__MeetingDemo__ResetAndSeed: 'true'
          Edulytics__Deployment__RunStartupMigrations: 'false'
        shell: bash
        run: |
          set -euo pipefail
          rehearsal_password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$rehearsal_password"
          export Edulytics__MeetingDemo__Password="$rehearsal_password"
          if ! dotnet run --project tools/Edulytics.CiFixtures/Edulytics.CiFixtures.csproj -- academic > /tmp/g6-d-fixture.log 2>&1; then
            tail -n 90 /tmp/g6-d-fixture.log
            exit 1
          fi
          grep -q MEETING_DEMO_SEED_COMPLETED /tmp/g6-d-fixture.log
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/g6-d-key.pem -out /tmp/g6-d-cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          openssl pkcs12 -export -out /tmp/g6-d-identity.pfx \
            -inkey /tmp/g6-d-key.pem -in /tmp/g6-d-cert.pem \
            -passout pass:g6-local-ci-tls >/dev/null 2>&1
          cp /tmp/g6-d-cert.pem /tmp/phase-uat-cert.pem
          export ASPNETCORE_URLS=https://127.0.0.1:5052
          export ASPNETCORE_Kestrel__Certificates__Default__Path=/tmp/g6-d-identity.pfx
          export ASPNETCORE_Kestrel__Certificates__Default__Password=g6-local-ci-tls
          export Edulytics__MeetingDemo__ResetAndSeed=false
          export Edulytics__Deployment__CleanBootstrap=true
          export ASPNETCORE_CONTENTROOT=/tmp/g6-d-web-publish
          dotnet /tmp/g6-d-web-publish/Edulytics.Web.dll > /tmp/g6-d-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 100); do
            if curl --fail --silent --cacert /tmp/phase-uat-cert.pem https://localhost:5052/health/ready >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$web_pid" 2>/dev/null; then
              tail -n 100 /tmp/g6-d-web.log
              exit 1
            fi
            sleep 3
          done
          test "$ready" = true
          export G6_CANDIDATE_SHA="$(git rev-parse HEAD)"
          if ! python3 tools/phase29/g6_stage_d_authenticated_https.py; then
            echo G6_AUTHENTICATED_STAGE_D_FAILURE
            tail -n 75 /tmp/g6-d-web.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-d-isolated-authenticated-147-evidence-not-release
          path: /tmp/g6-147-isolated-auth-https-evidence.json
          if-no-files-found: warn
          retention-days: 30
  diagnostic:
    name: g6-d-diagnostics-not-academic-or-release
    needs: [inventory, build, math, node, reconcile, g6-authenticated-https]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          INVENTORY: ${{ needs.inventory.result }}
          BUILD: ${{ needs.build.result }}
          MATH: ${{ needs.math.result }}
          NODE: ${{ needs.node.result }}
          RECONCILE: ${{ needs.reconcile.result }}
          AUTH_HTTPS: ${{ needs.g6-authenticated-https.result }}
        run: |
          set -euo pipefail
          test "$INVENTORY" = success
          test "$BUILD" = success
          test "$MATH" = success
          test "$NODE" = success
          test "$RECONCILE" = success
          test "$AUTH_HTTPS" = success
          echo "Technical suites only. Not original element parity, authenticated E2E, DB/Auth, visual/accessibility, human academic signoff or release. NO GO."
