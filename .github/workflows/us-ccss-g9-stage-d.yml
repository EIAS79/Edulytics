name: US CCSS G9 Stage D - fail closed
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/us-ccss-g9-stage-d.yml'
      - 'tools/curriculum/g9-stage-d-audit.cjs'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G9/**'
      - 'src/Edulytics.Services/Mathematics/UsCcssAlg1**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/curriculum/g9-stage-d-audit.cjs inventory
  source-shards:
    needs: inventory
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        batch: [D1, D2, D3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/curriculum/g9-stage-d-audit.cjs ${{ matrix.batch }}
  build-and-math:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - run: dotnet restore tests/Edulytics.Tests/Edulytics.Tests.csproj
      - run: dotnet build tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-restore
      - name: Grade 9 math tests
        run: dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~UsCcssAlg1" --logger "trx;LogFileName=g9-math.trx" --results-directory stage-d-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g9-math-trx
          path: stage-d-results/
          if-no-files-found: warn
  final-fail-closed:
    needs: [source-shards, build-and-math]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/curriculum/g9-stage-d-audit.cjs final
