name: US CCSS G9 Stage D - fail closed
on:
  push:
    branches: [feat/us-ccss-alg1-coder5-full-course-20261028]
    paths:
      - '.github/workflows/us-ccss-g9-stage-d.yml'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G9/**'
      - 'src/Edulytics.Core/**'
      - 'src/Edulytics.Services/**'
      - 'tests/Edulytics.Tests/MathematicsIntelligence/**'
      - 'tools/curriculum/g9-stage-d-audit.cjs'
      - 'tools/phase29/g9_two_school_https.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/us-ccss-g9-stage-d.yml'
      - 'tools/curriculum/g9-stage-d-audit.cjs'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G9/**'
      - 'src/Edulytics.Services/Mathematics/UsCcssAlg1**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/curriculum/g9-stage-d-audit.cjs inventory
  source-shards:
    needs: inventory
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        batch: [D1, D2, D3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/curriculum/g9-stage-d-audit.cjs ${{ matrix.batch }}
  build-and-math:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - run: dotnet restore tests/Edulytics.Tests/Edulytics.Tests.csproj
      - run: dotnet build tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-restore
      - name: Grade 9 math tests
        run: dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~UsCcssAlg1|FullyQualifiedName~UsCcssAlgebra1" --logger "trx;LogFileName=g9-math.trx" --results-directory stage-d-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g9-math-trx
          path: stage-d-results/
          if-no-files-found: warn
  authenticated-g9-https:
    name: g9-132-two-school-authenticated-https-postgres
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      EDULYTICS_CI_REHEARSAL: 'true'
      G9_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EDULYTICS_CI_REHEARSAL_PROGRAMME: 'US-CCSS'
      EDULYTICS_B001_G1_ALL_READS: '0'
      EDULYTICS_B001_ALL500_READS: '0'
      EDULYTICS_B001_REQUIRE_ALL500_PRACTICE_CTA: '0'
      EDULYTICS_B001_PROBE_500_ATTEMPTS: '0'
      EDULYTICS_B001_PROBE_500_MALFORMED_ANSWERS: '0'
      EDULYTICS_B001_REQUIRE_ALL500_GRADED: '0'
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate actual G9 authenticated probe syntax
        run: python3 -m py_compile tools/phase29/g9_two_school_https.py
      - name: Publish and migrate only disposable two-school database
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet publish src/Edulytics.Web/Edulytics.Web.csproj --configuration Release --no-restore --output /tmp/g9-web-publish
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Install real Chromium for 132 lesson browser rendering and 14 visual snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Execute Grade9 132 lesson live HTTPS, exact grading and cross-school denial
        shell: bash
        env:
          RENDER_SERVICE_ID: ci-disposable
          Edulytics__Deployment__CleanBootstrap: 'false'
          Edulytics__MeetingDemo__ResetAndSeed: 'true'
          Edulytics__Deployment__RunStartupMigrations: 'false'
        run: |
          set -euo pipefail
          rehearsal_password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$rehearsal_password"
          export Edulytics__MeetingDemo__Password="$rehearsal_password"
          if ! dotnet run --project tools/Edulytics.CiFixtures/Edulytics.CiFixtures.csproj -- academic > /tmp/g9-fixture.log 2>&1; then
            tail -n 100 /tmp/g9-fixture.log
            exit 1
          fi
          grep -q 'MEETING_DEMO_SEED_COMPLETED' /tmp/g9-fixture.log || { tail -n 100 /tmp/g9-fixture.log; exit 1; }
          configured="$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -A -t -c "
            WITH selected AS (
              UPDATE \"SchoolCurriculumAdoptions\" a
              SET \"CurriculumPathway\"='Traditional',
                  \"CurriculumLevelKey\"='US-CCSS-MATH:L11:TRADITIONAL:COURSE-ALG1',
                  \"CurriculumLevelLabel\"='Algebra 1'
              FROM \"Schools\" s
              WHERE a.\"SchoolId\"=s.\"Id\"
                AND s.\"SchoolCode\"='REHEARSAL-US-SECONDARY'
                AND a.\"CurriculumLogicalLevel\"=11
                AND a.\"CurriculumPathway\" IN ('Course/pathway mapping','Traditional')
              RETURNING a.\"Id\"
            ) SELECT count(*) FROM selected;")"
          test "$configured" = 1
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/g9-key.pem -out /tmp/g9-cert.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          openssl pkcs12 -export -out /tmp/g9-identity.pfx \
            -inkey /tmp/g9-key.pem -in /tmp/g9-cert.pem \
            -passout pass:local-test-tls >/dev/null 2>&1
          cp /tmp/g9-cert.pem /tmp/phase-uat-cert.pem
          export ASPNETCORE_URLS='https://127.0.0.1:5052'
          export ASPNETCORE_Kestrel__Certificates__Default__Path=/tmp/g9-identity.pfx
          export ASPNETCORE_Kestrel__Certificates__Default__Password=local-test-tls
          export Edulytics__MeetingDemo__ResetAndSeed='false'
          export ASPNETCORE_CONTENTROOT=/tmp/g9-web-publish
          dotnet /tmp/g9-web-publish/Edulytics.Web.dll > /tmp/g9-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 100); do
            if curl --fail --silent --cacert /tmp/phase-uat-cert.pem https://localhost:5052/health/ready > /dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then tail -n 100 /tmp/g9-web.log; exit 1; fi
            sleep 3
          done
          test "$ready" = true || { tail -n 100 /tmp/g9-web.log; exit 1; }
          python3 tools/phase29/g9_two_school_https.py
      - name: Retain 7 desktop and 7 mobile authenticated Grade9 visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g9-132-browser-render-14-responsive-screenshots
          path: /tmp/g9-u*-*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Retain exact-run Grade9 HTTPS and grading evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g9-132-authenticated-https-technical-evidence
          path: /tmp/g9-132-https-practice-evidence.json
          if-no-files-found: warn
          retention-days: 30

  final-fail-closed:
    needs: [source-shards, build-and-math, authenticated-g9-https]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: g9-132-authenticated-https-technical-evidence
          path: stage-d-results
      - name: Accept only exact-run 132-lesson authenticated, persisted Grade9 evidence
        env:
          G9_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/curriculum/g9-stage-d-audit.cjs final stage-d-results/g9-132-https-practice-evidence.json
