# Adaptive V2 implementation branch policy (2026-09-28)
# Automatic triggers are disabled on this branch. This workflow is retained
# for explicit manual verification only while the additive V2 work is built.
name: Phase29 Content Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Audit Phase 29 full curriculum coverage
        run: |
          set -euo pipefail
          python3 tools/phase29/full_curriculum_closure_audit.py --write-report
      - name: Upload audit report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase29-full-curriculum-closure-audit-${{ github.sha }}
          path: artifacts/phase29/full-curriculum-closure-audit.json
          retention-days: 14
