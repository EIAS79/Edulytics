name: Phase29 Apply Runtime Acceptance Fix

on:
  push:
    paths:
      - '.github/workflows/phase29-apply-runtime-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.200'

      - name: Apply runtime fix and permanent gates
        run: python3 scripts/phase29-finalize-runtime-fix.py

      - name: Normalize xUnit single assertion
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('tests/Edulytics.Tests/Phase29/Phase29CurriculumExperienceRuntimeTests.cs')
          s = p.read_text(encoding='utf-8')
          pattern = r'''var level = Assert\.Single\(\s*levels\.Where\(x => x\.LogicalLevel == logicalLevel\)\);'''
          replacement = '''var level = Assert.Single(
                levels,
                x => x.LogicalLevel == logicalLevel);'''
          s, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected xUnit assertion pattern once, found {count}.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify build and focused Phase 29 gates
        run: |
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln --no-restore
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-build --no-restore --filter FullyQualifiedName~Phase29CurriculumExperienceRuntimeTests
          git diff --check

      - name: Commit only verified product changes
        run: |
          git rm scripts/phase29-finalize-runtime-fix.py
          git rm .github/workflows/phase29-apply-runtime-fix.yml
          git config user.name 'Edulytics Phase29 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/Edulytics.Data/Repositories/AcademicStructureRepository.cs
          git add src/Edulytics.Core/Curriculum/MathematicsCurriculumPackRegistry.cs
          git add tests/Edulytics.Tests/Phase29/Phase29CurriculumExperienceRuntimeTests.cs
          git commit -m 'Phase29: fix curriculum selector runtime contracts'
          git push origin HEAD:${{ github.ref_name }}
