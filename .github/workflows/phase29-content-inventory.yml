name: Phase29 Content Inventory

on:
  push:
    paths:
      - '.github/workflows/phase29-content-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inventory UAE source catalog
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/Edulytics.Core/Curriculum/Packs/uae-moe-math.curriculum-pack.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print('PACK',d['PackCode'],d['VersionCode'])
          for n in d['Nodes']:
              if n.get('Kind')=='SourceCatalog':
                  print(json.dumps(n,ensure_ascii=False,sort_keys=True))
          PY