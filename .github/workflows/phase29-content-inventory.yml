name: Phase29 Content Inventory

on:
  push:
    paths:
      - '.github/workflows/phase29-content-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect UAE book TOC text
        shell: bash
        run: |
          set -euo pipefail
          command -v pdftotext
          python3 - <<'PY'
          import urllib.request
          files={
            'G1':'1j4sRW2biioeWS8LyK_n-B7IGAxeSTjyz',
            'G12A':'1b6BPBNDo7AJXs8QHGaKGOFaQf6N77K86',
          }
          for name,file_id in files.items():
              url=f'https://drive.google.com/uc?export=download&id={file_id}&confirm=t'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  data=r.read()
              print(name,'downloaded',len(data),'bytes',data[:8])
              open(f'/tmp/{name}.pdf','wb').write(data)
          PY
          for name in G1 G12A; do
            pdftotext -f 1 -l 35 -layout "/tmp/${name}.pdf" "/tmp/${name}.txt" || true
            echo "===== ${name} CANDIDATE HEADINGS ====="
            grep -E -i '(^|[[:space:]])(lesson|unit|module|chapter|الدرس|الوحدة|الفصل)[[:space:]:0-9.-]|^[[:space:]]*[0-9]{1,2}[-.][0-9]{1,2}[[:space:]]+' "/tmp/${name}.txt" | head -n 160 || true
          done