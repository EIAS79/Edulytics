name: Phase29 Content Inventory

on:
  push:
    paths:
      - '.github/workflows/phase29-content-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect UAE PDF outlines
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pypdf gdown
          python3 - <<'PY'
          import gdown
          from pypdf import PdfReader

          files={
            'G1':'1j4sRW2biioeWS8LyK_n-B7IGAxeSTjyz',
            'G12':'1b6BPBNDo7AJXs8QHGaKGOFaQf6N77K86',
          }
          def walk(items,depth=0):
              for item in items:
                  if isinstance(item,list):
                      walk(item,depth+1)
                  else:
                      title=getattr(item,'title',None)
                      if title:
                          print('  '*depth + str(title)[:220])
          for name,file_id in files.items():
              out=f'/tmp/{name}.pdf'
              got=gdown.download(url=f'https://drive.google.com/uc?id={file_id}&export=download', output=out, quiet=True)
              print('\n====',name,'====')
              reader=PdfReader(out)
              print('PAGES',len(reader.pages))
              print('OUTLINE')
              try:
                  walk(reader.outline)
              except Exception as e:
                  print('OUTLINE_ERROR',repr(e))
              print('FIRST_PAGES_TEXT')
              for i,page in enumerate(reader.pages[:20]):
                  text=' '.join((page.extract_text() or '').split())
                  if text:
                      print('P',i+1,text[:1000])
          PY