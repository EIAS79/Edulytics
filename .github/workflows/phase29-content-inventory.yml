name: Phase29 Content Inventory

on:
  push:
    paths:
      - '.github/workflows/phase29-content-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Probe UAE book links
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          from html import unescape
          d=json.loads(Path('src/Edulytics.Core/Curriculum/Packs/uae-moe-math.curriculum-pack.json').read_text(encoding='utf-8'))
          for n in d['Nodes']:
              if n.get('Kind')!='SourceCatalog':
                  continue
              urls=[x.strip() for x in (n.get('SourceLocator') or '').split(';') if x.strip()]
              if not urls:
                  continue
              url=urls[0]
              print('\nCATALOG',n['Code'],n['Title'])
              print('URL',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Edulytics-curriculum-verification'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(1200000)
                      body=raw.decode('utf-8','replace')
                      print('STATUS',r.status,'FINAL',r.geturl(),'LEN',len(raw))
                      title=re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S)
                      if title:
                          print('TITLE',unescape(re.sub(r'<[^>]+>',' ',title.group(1))).strip())
                      for pattern in [r'href=["\']([^"\']+)',r'src=["\']([^"\']+)']:
                          for link in re.findall(pattern,body,re.I):
                              low=link.lower()
                              if any(token in low for token in ('.pdf','drive.google','download','viewer','file=')):
                                  print('CANDIDATE',unescape(link)[:500])
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e))
          PY