name: Phase29 Finalize Curriculum Identity Cleanup

on:
  push:
    paths:
      - '.github/workflows/phase29-content-inventory.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.200'

      - name: Apply Phase 29 identity cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          pack_path = Path('src/Edulytics.Core/Curriculum/Packs/uae-moe-math.curriculum-pack.json')
          pack = json.loads(pack_path.read_text(encoding='utf-8'))
          catalog = [
              (n['LogicalLevelFrom'], n['NativeLevel'], n.get('Pathway'))
              for n in pack['Nodes']
              if n.get('Kind') == 'SourceCatalog'
          ]
          seen = []
          for item in catalog:
              if item not in seen:
                  seen.append(item)

          expected = (
              [(grade, f'Grade {grade}', 'Common') for grade in range(1, 5)] +
              [(grade, f'Grade {grade}', pathway)
               for grade in range(5, 13)
               for pathway in ('General', 'Advanced')]
          )
          if seen != expected:
              raise SystemExit(f'UAE SourceCatalog topology drift. Expected {expected}, got {seen}')

          registry_path = Path('src/Edulytics.Core/Curriculum/MathematicsCurriculumPackRegistry.cs')
          registry = registry_path.read_text(encoding='utf-8')
          old_levels = '''            [
                new(1,"Grade 1","Cycle 1",null,true),
                new(2,"Grade 2","Cycle 1",null,true),
                new(3,"Grade 3","Cycle 1",null,true),
                new(4,"Grade 4","Cycle 1",null,true),
                new(5,"Grade 5","Cycle 2",null,true),
                new(6,"Grade 6","Cycle 2",null,true),
                new(7,"Grade 7","Cycle 2",null,true),
                new(8,"Grade 8","Cycle 2",null,true),
                new(9,"Grade 9","Secondary","Preserve current pathway metadata",true),
                new(10,"Grade 10","Secondary","Preserve current pathway metadata",true),
                new(11,"Grade 11","Secondary","Preserve current pathway metadata",true),
                new(12,"Grade 12","Secondary","Preserve current pathway metadata",true)
            ]),'''
          new_levels = '''            [
                new(1,"Grade 1","Cycle 1","Common",true),
                new(2,"Grade 2","Cycle 1","Common",true),
                new(3,"Grade 3","Cycle 1","Common",true),
                new(4,"Grade 4","Cycle 1","Common",true),
                new(5,"Grade 5","Cycle 2","General",true),
                new(5,"Grade 5","Cycle 2","Advanced",true),
                new(6,"Grade 6","Cycle 2","General",true),
                new(6,"Grade 6","Cycle 2","Advanced",true),
                new(7,"Grade 7","Cycle 2","General",true),
                new(7,"Grade 7","Cycle 2","Advanced",true),
                new(8,"Grade 8","Cycle 2","General",true),
                new(8,"Grade 8","Cycle 2","Advanced",true),
                new(9,"Grade 9","Secondary","General",true),
                new(9,"Grade 9","Secondary","Advanced",true),
                new(10,"Grade 10","Secondary","General",true),
                new(10,"Grade 10","Secondary","Advanced",true),
                new(11,"Grade 11","Secondary","General",true),
                new(11,"Grade 11","Secondary","Advanced",true),
                new(12,"Grade 12","Secondary","General",true),
                new(12,"Grade 12","Secondary","Advanced",true)
            ]),'''
          if old_levels not in registry:
              raise SystemExit('Expected legacy UAE level block not found.')
          registry = registry.replace(old_levels, new_levels, 1)

          old_validation = '''        var uae = All.Single(x => x.Code == UaeCode);
        if (uae.Levels.Max(x => x.LogicalLevel) != 12 ||
            uae.Levels.Any(x => x.LogicalLevel == 13))
        {
            throw new InvalidOperationException("UAE must stop at Grade 12.");
        }'''
          new_validation = '''        var uae = All.Single(x => x.Code == UaeCode);
        if (uae.Levels.Max(x => x.LogicalLevel) != 12 ||
            uae.Levels.Any(x => x.LogicalLevel == 13) ||
            uae.Levels.Count != 20 ||
            Enumerable.Range(1, 4).Any(level =>
                !uae.Levels.Any(x =>
                    x.LogicalLevel == level &&
                    x.Pathway == "Common")) ||
            Enumerable.Range(5, 8).Any(level =>
                !uae.Levels.Any(x =>
                    x.LogicalLevel == level &&
                    x.Pathway == "General") ||
                !uae.Levels.Any(x =>
                    x.LogicalLevel == level &&
                    x.Pathway == "Advanced")))
        {
            throw new InvalidOperationException(
                "UAE level/pathway topology must be Grade 1-4 Common and Grade 5-12 General/Advanced.");
        }'''
          if old_validation not in registry:
              raise SystemExit('Expected UAE validation block not found.')
          registry = registry.replace(old_validation, new_validation, 1)
          registry_path.write_text(registry, encoding='utf-8')

          program_path = Path('src/Edulytics.Web/Program.cs')
          program = program_path.read_text(encoding='utf-8')
          obsolete = '''    var curriculumDb =
        scope.ServiceProvider
            .GetRequiredService<
                Edulytics.Data.Contexts.EdulyticsDbContext>();

    await new Edulytics.Data.Seeding.CambridgeCompletePedagogicalInventorySeeder(
            curriculumDb)
        .SeedAsync();

'''
          if obsolete not in program:
              raise SystemExit('Expected experimental Cambridge startup block not found.')
          program_path.write_text(program.replace(obsolete, '', 1), encoding='utf-8')
          PY

          git rm src/Edulytics.Data/Seeding/CambridgeCompletePedagogicalInventorySeeder.cs

          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln --no-restore

          git rm .github/workflows/phase29-content-inventory.yml
          git diff --check

          git config user.name 'Edulytics Phase29 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Phase29: correct UAE pathways and remove synthetic Cambridge lessons'
          git push origin HEAD:phase29/curriculum-experience-and-content
