name: Phase29 Content Inventory

on:
  push:
    paths:
      - '.github/workflows/phase29-content-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect source text fields
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('src/Edulytics.Core/Curriculum/Packs')
          for filename in ['cambridge-intl-math.curriculum-pack.json','pl-national-math.curriculum-pack.json','uae-moe-math.curriculum-pack.json']:
              d=json.loads((root/filename).read_text(encoding='utf-8'))
              print('\n===',d['PackCode'],'===')
              picked=0
              for n in d['Nodes']:
                  if n.get('Kind') not in ('Outcome','Standard','Reference','Lesson','Domain'): continue
                  if picked>=12: break
                  print(json.dumps({k:n.get(k) for k in ['Code','Kind','Title','OfficialText','AuthorDescription','SourceLocator','NativeLevel','Pathway','ParentCode']},ensure_ascii=False))
                  picked+=1
          PY