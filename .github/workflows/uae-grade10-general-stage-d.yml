name: UAE Grade 10 General Stage D - fail-closed candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/uae-grade10-general-stage-d.yml'
      - 'tools/curriculum/uae_g10_stage_d_preflight.cjs'
      - 'tools/curriculum/uae_g10_stage_d_*.py'
      - 'tools/Edulytics.CleanSeed/Program.cs'
      - 'src/Edulytics.Data/Seeding/MathematicsPedagogicalLessonSeeder.cs'
      - 'tools/Edulytics.CiFixtures/MeetingDemoProvisioner.cs'
      - 'tests/academic-uae-grade10*.test.cjs'
      - 'tests/Edulytics.Tests/**/UaeG10*.cs'
      - 'tests/Edulytics.Tests/**/UaeGrade10*.cs'
      - 'src/Edulytics.Services/**/LessonContentPolicy.cs'
      - 'src/Edulytics.Services/**/LessonContentService.cs'
      - 'src/Edulytics.Services/**/StudentPrivatePracticeService.cs'
      - 'src/Edulytics.Services/**/ExactSkillContractQuestionEngine.cs'
      - 'src/**/Views/StudentPortal/Lesson.cshtml'
      - 'src/**/Views/Shared/_StudentLayout.cshtml'
      - 'src/**/Views/Shared/_RichLessonContentV2.cshtml'
      - 'src/**/wwwroot/css/**/*.css'
      - 'src/Edulytics.Core/Curriculum/LessonBlueprints/Packs/uae-g10-general-*'
      - 'src/Edulytics.Core/Curriculum/LessonContent/Packs/uae-g10-general-*'
      - 'src/Edulytics.Core/Curriculum/LessonContent/RichV2/uae-g10-general-*'
      - 'src/Edulytics.Core/Mathematics/Curriculum/lesson-skill-mappings.v1.json'
      - 'artifacts/curriculum-delivery/UAE-MOE-MATH/G10/**'
  push:
    branches: [feat/uae-g10-unified-arabic-source-rebuild]
    paths:
      - '.github/workflows/uae-grade10-general-stage-d.yml'
      - 'tools/curriculum/uae_g10_stage_d_preflight.cjs'
      - 'tests/academic-uae-grade10*.test.cjs'
      - 'tests/Edulytics.Tests/**/UaeG10*.cs'
      - 'tests/Edulytics.Tests/**/UaeGrade10*.cs'
      - 'src/Edulytics.Services/**/LessonContentPolicy.cs'
      - 'src/Edulytics.Services/**/LessonContentService.cs'
      - 'src/Edulytics.Services/**/StudentPrivatePracticeService.cs'
      - 'src/Edulytics.Services/**/ExactSkillContractQuestionEngine.cs'
      - 'src/**/Views/StudentPortal/Lesson.cshtml'
      - 'src/**/Views/Shared/_StudentLayout.cshtml'
      - 'src/**/Views/Shared/_RichLessonContentV2.cshtml'
      - 'src/**/wwwroot/css/**/*.css'
      - 'artifacts/curriculum-delivery/UAE-MOE-MATH/G10/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g10-preflight-and-node-tests:
    name: 148-lesson structural check and all prepared Node unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural, Arabic, provenance and exact identity audit
        run: |
          set -euo pipefail
          node tools/curriculum/uae_g10_stage_d_preflight.cjs
      - name: Run full UAE Grade10 prepared Node suite (fail on any test)
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -name 'academic-uae-grade10*.test.cjs' | sort)
          test "${#files[@]}" -ge 148
          node --test "${files[@]}" 2>&1 | tee g10-node-tests.log
      - name: Upload audit and Node test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-g10-structural-and-node-tests
          path: |
            artifacts/uae-g10-stage-d/g10-preflight.json
            g10-node-tests.log
          if-no-files-found: warn

  g10-fail-closed-release-decision:
    name: G10 NO_GO until lesson-level Stage D and student verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed on unresolved first-party source and Stage D obligations
        run: node tools/curriculum/uae_g10_stage_d_preflight.cjs --release
      - name: Upload explicit release decision with blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-g10-stage-d-no-go-evidence
          path: artifacts/uae-g10-stage-d/g10-preflight.json
          if-no-files-found: warn

  g10-compiled-math-tests:
    name: G10 compiled mathematical contracts and shared regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - name: Restore and build once
        run: |
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
      - name: Execute compiled Grade 10 contracts
        run: |
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~UaeG10|FullyQualifiedName~UaeGrade10|FullyQualifiedName~SeederPreservesRetiredG10Advanced|FullyQualifiedName~SeederPreservesG10AdvancedPracticeReferences" --logger "trx;LogFileName=g10-contracts.trx" --results-directory "${{ runner.temp }}/g10-test-results"
      - name: Require actual executed tests and no failures
        run: |
          python3 - <<'PY'
          import pathlib, os, xml.etree.ElementTree as ET
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'g10-test-results'/'g10-contracts.trx'
          root=ET.parse(p).getroot()
          ns={'t':'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          c=root.find('.//t:Counters',ns)
          assert c is not None and int(c.attrib['executed'])>0
          assert int(c.attrib['failed'])==0 and int(c.attrib['passed'])==int(c.attrib['executed'])
          print('G10_COMPILED_CONTRACTS_PASS',c.attrib)
          PY
      - name: Run shared Grade 7 through Grade 9 contract regression
        run: |
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~UaeG7|FullyQualifiedName~UaeG8|FullyQualifiedName~UaeG9|FullyQualifiedName~UaeGrade7|FullyQualifiedName~UaeGrade8|FullyQualifiedName~UaeGrade9" --logger "trx;LogFileName=g7-g9-regression.trx" --results-directory "${{ runner.temp }}/g10-test-results"
      - name: Upload actual compiled test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g10-compiled-math-test-results
          path: ${{ runner.temp }}/g10-test-results/*.trx
          if-no-files-found: error

  g10-authenticated-runtime:
    name: G10 isolated four-role HTTPS, all 148 Arabic pages and actual Practice diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: 'true'
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: UAE-G10
      EDULYTICS_G10_CI_PRACTICE_REHEARSAL: EXERCISE_97_DECLARED_CANDIDATES_ONLY
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile checks and build clean disposable PostgreSQL 18
        run: |
          set -euo pipefail
          python3 -m py_compile tools/curriculum/uae_g10_stage_d_authenticated_https.py tools/curriculum/uae_g10_stage_d_browser_rtl.py
          node tools/curriculum/uae_g10_stage_d_preflight.cjs
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
          dotnet publish src/Edulytics.Web/Edulytics.Web.csproj -c Release --no-restore -o /tmp/g10-web-publish
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Verify exact 148 Published G10 General Arabic DB identities
        run: |
          set -euo pipefail
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumPedagogicalLessons" WHERE "Code" LIKE '"'"'PED:UAE-MOE-MATH:L10:GENERAL:%'"'"'')" = 148
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc 'SELECT COUNT(*) FROM "CurriculumLessonContents" c JOIN "CurriculumPedagogicalLessons" p ON p."Id"=c."LessonNodeId" WHERE p."Code" LIKE '"'"'PED:UAE-MOE-MATH:L10:GENERAL:%'"'"' AND c."Status"=3')" = 148
      - name: Authenticate disposable G10 General student, teacher, supervisor, school admin; test all lessons
        env:
          Edulytics__Deployment__CleanBootstrap: 'false'
          Edulytics__MeetingDemo__ResetAndSeed: 'true'
          Edulytics__Deployment__RunStartupMigrations: 'false'
          RENDER_SERVICE_ID: ci-disposable
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
          export Edulytics__MeetingDemo__Password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$Edulytics__MeetingDemo__Password"
          if ! dotnet run --project tools/Edulytics.CiFixtures/Edulytics.CiFixtures.csproj -- academic > /tmp/g10-fixture.log 2>&1; then
            tail -n 80 /tmp/g10-fixture.log | grep -Eiv 'password|credential|secret|connection' || true
            exit 1
          fi
          grep -q 'MEETING_DEMO_SEED_COMPLETED' /tmp/g10-fixture.log
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/g10-key.pem -out /tmp/g10-cert.pem -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          openssl pkcs12 -export -out /tmp/g10-identity.pfx -inkey /tmp/g10-key.pem -in /tmp/g10-cert.pem -passout pass:local-test-tls >/dev/null 2>&1
          cp /tmp/g10-cert.pem /tmp/phase-uat-cert.pem
          export ASPNETCORE_URLS='https://127.0.0.1:5052'
          export ASPNETCORE_Kestrel__Certificates__Default__Path=/tmp/g10-identity.pfx
          export ASPNETCORE_Kestrel__Certificates__Default__Password=local-test-tls
          export Edulytics__MeetingDemo__ResetAndSeed='false'
          export ASPNETCORE_CONTENTROOT=/tmp/g10-web-publish
          dotnet /tmp/g10-web-publish/Edulytics.Web.dll >/tmp/g10-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent --cacert /tmp/phase-uat-cert.pem https://localhost:5052/health/ready >/dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 3
          done
          if [ "$ready" != true ]; then
            tail -n 80 /tmp/g10-web.log | grep -Eiv 'password|credential|secret|connection' || true
            exit 1
          fi
          auth_rc=0
          rtl_rc=0
          python3 tools/curriculum/uae_g10_stage_d_authenticated_https.py || auth_rc=$?
          python3 tools/curriculum/uae_g10_stage_d_browser_rtl.py || rtl_rc=$?
          test "$auth_rc" -eq 0 && test "$rtl_rc" -eq 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade10-authenticated-e2e-and-rtl
          path: |
            /tmp/uae-g10-stage-d-authenticated-148-lessons.json
            /tmp/uae-g10-stage-d-browser-rtl/report.json
            /tmp/uae-g10-stage-d-browser-rtl/*.png
          if-no-files-found: warn
          retention-days: 30

  g10-isolated-catalogue-replacement:
    name: G10 isolated legacy 48+52 to 148 catalogue replacement and replay
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CI: 'true'
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: UAE-G10
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate structure and pin the legacy fixture
        run: |
          set -euo pipefail
          node tools/curriculum/uae_g10_stage_d_preflight.cjs
          git worktree add --detach /tmp/g10-legacy 83c31a13ffc173c7be9d1d85b24f4fa83c222aee
          python3 - <<'PY'
          import json, pathlib, subprocess
          scope=json.loads(pathlib.Path('artifacts/curriculum-delivery/UAE-MOE-MATH/G10/grade10-legacy-rehearsal-scope.json').read_text())
          assert scope['baselineSha']=='83c31a13ffc173c7be9d1d85b24f4fa83c222aee'
          assert len(scope['legacyLessons'])==100
          expected=[]
          for pathway,n,sha in zip(('general','advanced'),(48,52),scope['blueprintBlobs']):
              rel='src/Edulytics.Core/Curriculum/LessonBlueprints/Packs/uae-g10-'+pathway+'-t1-ogl-v1.lesson-blueprint.json'
              assert subprocess.check_output(['git','-C','/tmp/g10-legacy','rev-parse','HEAD:'+rel],text=True).strip()==sha
              doc=json.loads((pathlib.Path('/tmp/g10-legacy')/rel).read_text(encoding='utf-8-sig'))
              assert len(doc['Lessons'])==n
              expected.extend(dict(code=x['LessonCode'],title=x['Title'],sourceLessonCode=x['SourceLessonCode'],blueprintCode=doc['BlueprintCode']) for x in doc['Lessons'])
          assert expected==scope['legacyLessons']
          PY
      - name: Seed original pinned legacy catalogue in empty disposable PostgreSQL
        run: |
          set -euo pipefail
          cd /tmp/g10-legacy
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet build tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj -c Release
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj -c Release --no-build
      - name: Snapshot legacy target and non-target curriculum reference rows
        run: |
          set -euo pipefail
          python3 tools/curriculum/uae_g10_stage_d_rehearsal_snapshot.py before /tmp/g10-catalogue-before.json
      - name: Build candidate and execute scoped replacement twice
        run: |
          set -euo pipefail
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
          dotnet build tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj -c Release
          for n in 1 2; do
            dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj -c Release --no-build -- --uae-g10-rehearse artifacts/curriculum-delivery/UAE-MOE-MATH/G10/grade10-legacy-rehearsal-scope.json | tee "/tmp/g10-rehearsal-$n.log"
            grep -q 'UAE_G10_ISOLATED_CATALOGUE_148_AND_148_METADATA_PASS' "/tmp/g10-rehearsal-$n.log"
            if [ "$n" = 1 ]; then
              grep -q 'UAE_G10_ISOLATED_ZERO_LEGACY_BEFORE_IMPORT deletedLessons=100 deletedMetadata=100' "/tmp/g10-rehearsal-$n.log"
              grep -q 'replay=False deletedLegacyLessons=100 deletedLegacyMetadata=100' "/tmp/g10-rehearsal-$n.log"
            else
              grep -q 'replay=True deletedLegacyLessons=0 deletedLegacyMetadata=0' "/tmp/g10-rehearsal-$n.log"
            fi
            python3 tools/curriculum/uae_g10_stage_d_rehearsal_snapshot.py after "/tmp/g10-catalogue-after-$n.json" /tmp/g10-catalogue-before.json
          done
          python3 tools/curriculum/uae_g10_stage_d_rehearsal_snapshot.py replay /tmp/g10-catalogue-after-1.json /tmp/g10-catalogue-after-2.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade10-isolated-legacy-catalogue-replacement
          path: |
            /tmp/g10-catalogue-before.json
            /tmp/g10-catalogue-after-*.json
            /tmp/g10-rehearsal-*.log
          if-no-files-found: warn
