# Adaptive V2 implementation branch policy (2026-09-28)
# Automatic triggers are disabled on this branch. This workflow is retained
# for explicit manual verification only while the additive V2 work is built.
name: Evaluation Engine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.200"

      - name: Restore
        run: dotnet restore Edulytics.sln

      - name: Build
        run: dotnet build Edulytics.sln --configuration Release --no-restore

      - name: Evaluation and privacy regression
        run: |
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --filter "FullyQualifiedName~Phase44|FullyQualifiedName~Phase43PrivacyAndReportBoundaryTests"

      - name: Localization parity
        run: python3 scripts/ci-localization-parity.py

      - name: Architecture gate
        run: python3 scripts/ci-architecture-gate.py
