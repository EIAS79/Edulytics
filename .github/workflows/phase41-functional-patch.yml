name: Phase41 Functional Patch

on:
  push:
    branches:
      - phase41-online-assessments

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[phase41-functional-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.200"

      - name: Restore
        run: dotnet restore Edulytics.sln

      - name: Apply Phase 41 functional patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'PATCH_PATTERN_MISSING: {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def append_resx(path, entries):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              additions = []
              for key, value in entries:
                  if f'name="{key}"' in text:
                      continue
                  additions.append(f'  <data name="{key}" xml:space="preserve"><value>{escape(value)}</value></data>')
              if additions:
                  if '</root>' not in text:
                      raise SystemExit(f'INVALID_RESX: {path}')
                  text = text.replace('</root>', '\n'.join(additions) + '\n</root>')
                  p.write_text(text, encoding='utf-8')

          # Fix fully-qualified enum reference in the repository patch already on the branch.
          replace(
              'src/Edulytics.Data/Repositories/AssessmentBuilderRepository.cs',
              'x.Status == Core.Enums.AcademicStructureStatus.Active)',
              'x.Status == Edulytics.Core.Enums.AcademicStructureStatus.Active)')

          # Assessment Builder service: surface eligible students and persist target/delivery/difficulty.
          replace(
              'src/Edulytics.Services/Assessments/AssessmentBuilderService.cs',
              '''        var context = await repository.GetContextAsync(access.SchoolId, assessmentId, cancellationToken);\n        return context is null\n            ? AssessmentQueryResult<AssessmentBuilderWorkspace>.Failure(AssessmentErrorCode.AssessmentNotFound)\n            : AssessmentQueryResult<AssessmentBuilderWorkspace>.Success(BuildWorkspace(access.Details!, context));\n    }\n\n    public async Task<AssessmentCommandResult> CreateManualQuestionAsync(''',
              '''        var context = await repository.GetContextAsync(access.SchoolId, assessmentId, cancellationToken);\n        if (context is null)\n            return AssessmentQueryResult<AssessmentBuilderWorkspace>.Failure(AssessmentErrorCode.AssessmentNotFound);\n\n        var targetStudents = (await repository.ListTargetStudentsAsync(access.SchoolId, assessmentId, cancellationToken))\n            .Select(x => new AssessmentTargetStudentOption(x.Id, x.StudentNumber, x.DisplayName))\n            .ToArray();\n\n        return AssessmentQueryResult<AssessmentBuilderWorkspace>.Success(\n            BuildWorkspace(access.Details!, context, targetStudents));\n    }\n\n    public async Task<AssessmentCommandResult> UpdateDeliverySettingsAsync(\n        Guid actorUserId,\n        UpdateAssessmentDeliverySettingsRequest request,\n        CancellationToken cancellationToken = default)\n    {\n        var resolved = await ResolveEditableAsync(actorUserId, request.AssessmentId, cancellationToken);\n        if (resolved.Error.HasValue) return Failure(resolved.Error.Value);\n\n        if (!Enum.IsDefined(request.TargetType) ||\n            !Enum.IsDefined(request.DeliveryMode) ||\n            !Enum.IsDefined(request.DifficultyBand))\n            return Failure(AssessmentErrorCode.Required);\n\n        Guid? targetStudentId = null;\n        if (request.TargetType == AssessmentTargetType.IndividualStudent)\n        {\n            if (!request.TargetStudentProfileId.HasValue || request.TargetStudentProfileId.Value == Guid.Empty)\n                return Failure(AssessmentErrorCode.StudentNotFound);\n\n            var eligible = await repository.ListTargetStudentsAsync(\n                resolved.SchoolId, request.AssessmentId, cancellationToken);\n            if (eligible.All(x => x.Id != request.TargetStudentProfileId.Value))\n                return Failure(AssessmentErrorCode.StudentNotEnrolled);\n\n            targetStudentId = request.TargetStudentProfileId.Value;\n        }\n\n        var assessment = resolved.Context!.Assessment;\n        assessment.TargetType = request.TargetType;\n        assessment.TargetStudentProfileId = targetStudentId;\n        assessment.DeliveryMode = request.DeliveryMode;\n        assessment.DifficultyBand = request.DifficultyBand;\n\n        return await SaveAsync(\n            resolved.Context, request.AssessmentRowVersion, assessment.Id, cancellationToken);\n    }\n\n    public async Task<AssessmentCommandResult> CreateManualQuestionAsync(''')

