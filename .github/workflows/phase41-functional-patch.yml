ficultyBand.Challenge" selected="@(assessment.DifficultyBand == AssessmentDifficultyBand.Challenge)">@A["Challenge"]</option></select><button class="school-button school-button-primary" type="submit">@A["SaveDeliverySettings"]</button></form></section>\n<section class="assessment-card"><h2>@A["AddQuestionManually"]</h2>''')

