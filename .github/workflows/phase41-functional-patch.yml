              '''public sealed record StudentAssessmentItem(\n    Guid AssessmentId,\n    string Title,\n    string SubjectName,\n    string ClassName,\n    DateOnly AssessmentDate,\n    decimal MaxScore);''',
              '''public sealed record StudentAssessmentItem(\n    Guid AssessmentId,\n    string Title,\n    string SubjectName,\n    string ClassName,\n    DateOnly AssessmentDate,\n    decimal MaxScore,\n    AssessmentDeliveryMode DeliveryMode = AssessmentDeliveryMode.Offline,\n    AssessmentDifficultyBand DifficultyBand = AssessmentDifficultyBand.AtClassLevel,\n    AssessmentTargetType TargetType = AssessmentTargetType.Class,\n    bool IsSubmitted = false);''')

          replace(
              'src/Edulytics.Services/StudentPortal/StudentPortalService.cs',
              '''            .Where(x =>\n                x.Status == AssessmentStatus.Open &&\n                enrollmentKeys.Contains((x.ClassGroupId, x.AcademicYearId)))''',
              '''            .Where(x =>\n                x.Status == AssessmentStatus.Open &&\n                enrollmentKeys.Contains((x.ClassGroupId, x.AcademicYearId)) &&\n                (x.TargetType == AssessmentTargetType.Class ||\n                 x.TargetStudentProfileId == snapshot.Profile.Id))''')

          replace(
              'src/Edulytics.Services/StudentPortal/StudentPortalService.cs',
              '''                return new StudentAssessmentItem(\n                    x.Id,\n                    x.Title,\n                    subject?.Name ?? string.Empty,\n                    classGroup?.Name ?? string.Empty,\n                    x.AssessmentDate,\n                    x.MaxScore);''',
              '''                return new StudentAssessmentItem(\n                    x.Id,\n                    x.Title,\n                    subject?.Name ?? string.Empty,\n                    classGroup?.Name ?? string.Empty,\n                    x.AssessmentDate,\n                    x.MaxScore,\n                    x.DeliveryMode,\n                    x.DifficultyBand,\n                    x.TargetType,\n                    snapshot.Results.Any(result =>\n                        result.AssessmentId == x.Id &&\n                        result.StudentProfileId == snapshot.Profile.Id));''')

          # New official online assessment delivery contracts/service.
          Path('src/Edulytics.Services/Assessments/StudentAssessmentDeliveryContracts.cs').write_text(r'''using Edulytics.Core.Enums;

namespace Edulytics.Services.Assessments;

public enum StudentAssessmentDeliveryErrorCode
{
    AccessDenied = 1,
    SchoolNotActive = 2,
    ProfileNotLinked = 3,
    AssessmentNotFound = 4,
    AssessmentNotOpen = 5,
    AssessmentOffline = 6,
    NotTargeted = 7,
    AlreadySubmitted = 8,
    InvalidSubmission = 9,
    PersistenceError = 10
}

public sealed record StudentAssessmentQuestion(
    Guid Id,
    int Order,
    string Prompt,
    decimal MaxScore);

public sealed record StudentAssessmentAttempt(
    Guid AssessmentId,
    string Title,
    DateOnly AssessmentDate,
    decimal MaxScore,
    AssessmentDifficultyBand DifficultyBand,
    IReadOnlyList<StudentAssessmentQuestion> Questions);

public sealed record StudentAssessmentResponse(
