name: UAE Grade 8 General Arabic Stage D - 76 lesson diagnostics
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/uae-g8-stage-d.yml'
      - 'tools/curriculum/uae_g8_stage_d_gate.py'
      - 'artifacts/curriculum-delivery/UAE-MOE-MATH/G8/**'
      - 'docs/curriculum/UAE_G8_GENERAL_**'
      - 'src/Edulytics.Core/Curriculum/**'
      - 'src/Edulytics.Core/Mathematics/**'
      - 'src/Edulytics.Services/LessonContent/**'
      - 'src/Edulytics.Web/Views/StudentPortal/Lesson.cshtml'
      - 'tests/academic-uae-grade8-arabic-*.test.cjs'
      - 'tests/academic-uae-grade8-general-ar-*.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  structural:
    name: G8 12 units / 76 Arabic lesson identities and source artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Grade 8 source-selected structure and fail-closed status
        run: python3 tools/curriculum/uae_g8_stage_d_gate.py --phase structural
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-g8-structural
          path: artifacts/uae-g8-stage-d/grade8-structural-gate.json
          if-no-files-found: error
  lesson-tests:
    name: G8 run all 76 authored lesson tests and general 76 gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute all 76 native lessons, not only parse test files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/uae-g8-stage-d
          node --test --test-reporter=tap tests/academic-uae-grade8-arabic-u??l??.test.cjs tests/academic-uae-grade8-general-ar-source76-stage-d-gate.test.cjs | tee artifacts/uae-g8-stage-d/grade8-lessons.tap
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-g8-lesson-test-results
          path: artifacts/uae-g8-stage-d/grade8-lessons.tap
          if-no-files-found: ignore
  dotnet:
    name: G8 shared release build and relevant UAE/US regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - name: One restore and one Release build
        run: |
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
      - name: Relevant Grade 8, Arabic and shared Grade 7 regression tests
        run: |
          mkdir -p artifacts/uae-g8-stage-d/trx
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~UaeGrade8|FullyQualifiedName~UaeG8|FullyQualifiedName~UsCcssGrade8|FullyQualifiedName~UaeGrade7' --logger 'trx;LogFileName=g8-regressions.trx' --results-directory artifacts/uae-g8-stage-d/trx
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-g8-dotnet-regressions
          path: artifacts/uae-g8-stage-d/trx
          if-no-files-found: ignore
  source-release-gate:
    name: G8 source 2019/2025 crosswalk, atomic parity and publication guards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse 100% and merge while required source evidence remains absent
        run: python3 tools/curriculum/uae_g8_stage_d_gate.py --phase source
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-g8-source-release-gate
          path: artifacts/uae-g8-stage-d/grade8-source-gate.json
          if-no-files-found: error
# This diagnostic workflow does NOT execute authenticated 76-page RTL E2E, isolated PostgreSQL
# migrations or rendered live-production acceptance. Green diagnostic jobs are not RELEASED_VERIFIED.


  isolated-db:
    name: G8 disposable PostgreSQL 18 migration, seed, 76 Arabic release metadata and Advanced isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: UAE-G8
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply real EF migration and seed on disposable database only
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Confirm exactly 76 G8 General with Published metadata and no legacy source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/uae-g8-stage-d
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          def query(q):
              return subprocess.check_output(["psql","-h","127.0.0.1","-U","postgres","-d","edulytics_clean_ci","-A","-t","-c",q],text=True).strip()
          general=query("SELECT count(*) FROM \"CurriculumPedagogicalLessons\" WHERE \"Code\" LIKE 'PED:UAE-MOE-MATH:L8:GENERAL:%'")
          advanced=query("SELECT count(*) FROM \"CurriculumPedagogicalLessons\" WHERE \"Code\" LIKE 'PED:UAE-MOE-MATH:L8:ADVANCED:%'")
          published=query("SELECT count(*) FROM \"CurriculumLessonContents\" c JOIN \"CurriculumPedagogicalLessons\" l ON l.\"Id\"=c.\"LessonNodeId\" WHERE l.\"Code\" LIKE 'PED:UAE-MOE-MATH:L8:GENERAL:%' AND c.\"Status\"=3")
          legacy=query("SELECT count(*) FROM \"CurriculumPedagogicalLessons\" WHERE \"Code\"='PED:UAE-MOE-MATH:L8:GENERAL:12:05:INFINITE-SETS'")
          translations=query("SELECT count(*) FROM \"CurriculumLessonContentTranslations\" t JOIN \"CurriculumLessonContents\" c ON c.\"Id\"=t.\"CurriculumLessonContentId\" JOIN \"CurriculumPedagogicalLessons\" l ON l.\"Id\"=c.\"LessonNodeId\" WHERE l.\"Code\" LIKE 'PED:UAE-MOE-MATH:L8:GENERAL:%'")
          result={"candidateSha":os.environ["GITHUB_SHA"],"phase":"isolated-db","database":"disposable PostgreSQL 18","generalLessons":int(general),"advancedLessons":int(advanced),"publishedGeneralMetadata":int(published),"legacyExtra":int(legacy),"persistedTranslations":int(translations),"productionWritten":False}
          ok=(result["generalLessons"]==76 and result["advancedLessons"]==77 and result["publishedGeneralMetadata"]==76 and result["legacyExtra"]==0 and result["persistedTranslations"]==0)
          result["status"]="PASS" if ok else "D_BLOCKED"
          pathlib.Path("artifacts/uae-g8-stage-d/grade8-isolated-db.json").write_text(json.dumps(result,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(result,indent=2))
          if not ok: raise SystemExit(1)
          PY
      - name: Rehearse guarded production-style 77 English to 76 Arabic release on disposable DB
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DO $
          BEGIN
            IF (SELECT count(*) FROM "CurriculumPedagogicalLessons"
                WHERE "Code" LIKE 'PED:UAE-MOE-MATH:L8:GENERAL:%')<>76 THEN
              RAISE EXCEPTION 'Isolated candidate should start with 76';
            END IF;
          END $;
          UPDATE "CurriculumLessonContents" c
            SET "ContentVersion"='supporting-practice-remediation-v2'
            WHERE c."LessonNodeId" IN (
              SELECT l."Id" FROM "CurriculumPedagogicalLessons" l
              WHERE l."Code" LIKE 'PED:UAE-MOE-MATH:L8:GENERAL:%');
          UPDATE "CurriculumPedagogicalLessons"
            SET "Title"='Legacy English Grade8 lesson'
            WHERE "Code" LIKE 'PED:UAE-MOE-MATH:L8:GENERAL:%';
          INSERT INTO "CurriculumPedagogicalLessons"(
            "Id","FrameworkVersionId","OfficialLessonNodeId","Code",
            "UnitKey","UnitTitle","Title","LogicalLevelFrom","LogicalLevelTo",
            "NativeLevel","Pathway","SortOrder","CreatedAtUtc","UpdatedAtUtc","RowVersion")
          SELECT gen_random_uuid(),l."FrameworkVersionId",NULL,
            'PED:UAE-MOE-MATH:L8:GENERAL:12:05:INFINITE-SETS',
            l."UnitKey",l."UnitTitle",'Infinite Sets',
            l."LogicalLevelFrom",l."LogicalLevelTo",l."NativeLevel",
            l."Pathway",77,NOW(),NOW(),'\x'::bytea
          FROM "CurriculumPedagogicalLessons" l
          WHERE l."Code"='PED:UAE-MOE-MATH:L8:GENERAL:12:04:USING-SETS-TO-SOLVE-PROBLEMS';
          INSERT INTO "CurriculumLessonContents"(
            "Id","FrameworkVersionId","LessonNodeId","Status",
            "ContentVersion","VerifiedAtUtc","PublishedAtUtc",
            "CreatedAtUtc","UpdatedAtUtc","RowVersion")
          SELECT gen_random_uuid(),l."FrameworkVersionId",l."Id",3,
            'supporting-practice-remediation-v2',NOW(),NOW(),NOW(),NOW(),'\x'::bytea
          FROM "CurriculumPedagogicalLessons" l
          WHERE l."Code"='PED:UAE-MOE-MATH:L8:GENERAL:12:05:INFINITE-SETS';
          DO $
          BEGIN
            IF (SELECT count(*) FROM "CurriculumPedagogicalLessons"
                WHERE "Code" LIKE 'PED:UAE-MOE-MATH:L8:GENERAL:%')<>77 THEN
              RAISE EXCEPTION 'Synthetic pre-cutover 77 lesson fixture missing';
            END IF;
          END $;
          COMMIT;
          SQL
          # Only the explicitly unlocked G8 seeder runs; no global maintenance
          # and no production database URL is present in this ephemeral job.
          export EDULYTICS_G8_SCOPED_RELEASE=CONFIRM_REPLACE_UAE_GRADE8_GENERAL_EN77_WITH_AR76
          export Edulytics__Deployment__CleanBootstrap=false
          export Edulytics__Deployment__RunStartupMigrations=false
          export Edulytics__Deployment__RunStartupDataMaintenance=false
          export Edulytics__LessonContent__ReadFromJson=true
          for attempt in 1 2; do
            dotnet run --project src/Edulytics.Web/Edulytics.Web.csproj \
              --configuration Release --no-build --no-launch-profile \
              -- --urls http://127.0.0.1:18418 >"/tmp/g8-release-$attempt.log" 2>&1 &
            pid=$!
            success=false
            for i in $(seq 1 100); do
              if grep -q 'UAE_G8_SCOPED_REPLACE_77_WITH_76_ARABIC_PASS' "/tmp/g8-release-$attempt.log"; then
                success=true
                break
              fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 2
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if [ "$success" != true ]; then
              tail -n 100 "/tmp/g8-release-$attempt.log" | grep -Eiv 'password|credential|secret|connection' || true
              exit 1
            fi
            test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT count(*) FROM \"CurriculumPedagogicalLessons\" WHERE \"Code\" LIKE 'PED:UAE-MOE-MATH:L8:GENERAL:%'")" = 76
            test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT count(*) FROM \"CurriculumPedagogicalLessons\" WHERE \"Code\" LIKE 'PED:UAE-MOE-MATH:L8:ADVANCED:%'")" = 77
            test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT count(*) FROM \"CurriculumLessonContents\" c JOIN \"CurriculumPedagogicalLessons\" l ON l.\"Id\"=c.\"LessonNodeId\" WHERE l.\"Code\" LIKE 'PED:UAE-MOE-MATH:L8:GENERAL:%' AND c.\"ContentVersion\"='supporting-practice-remediation-v2'")" = 0
          done
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path('artifacts/uae-g8-stage-d/grade8-scoped-77-to-76-rehearsal.json')
          out.write_text(json.dumps({'status':'PASS','candidateSha':os.environ['GITHUB_SHA'],
            'database':'disposable PostgreSQL18','originalEnglishFixture':77,
            'ownerApprovedArabicLessons':76,'independentCutoverRuns':2,
            'grade8AdvancedRetained':77,'productionDatabaseWritten':False},indent=2)+'\n')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-g8-isolated-postgresql
          path: |
            artifacts/uae-g8-stage-d/grade8-isolated-db.json
            artifacts/uae-g8-stage-d/grade8-scoped-77-to-76-rehearsal.json
          if-no-files-found: warn


  authenticated-e2e:
    name: G8 real authenticated HTTPS, 76 lessons, 234 attempts, Chromium desktop/mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edulytics_clean_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d edulytics_clean_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ConnectionStrings__DefaultConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      ConnectionStrings__MigrationConnection: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_CONNECTION: 'Host=127.0.0.1;Port=5432;Database=edulytics_clean_ci;Username=postgres;Password=postgres;SSL Mode=Disable'
      EDULYTICS_CLEAN_DATABASE_NAME: edulytics_clean_ci
      EDULYTICS_CLEAN_SEED_CONFIRM: I_CONFIRM_NEW_EMPTY_DATABASE
      EDULYTICS_CI_REHEARSAL: 'true'
      EDULYTICS_CI_REHEARSAL_PROGRAMME: UAE-G8
      ASPNETCORE_ENVIRONMENT: Staging
      PGPASSWORD: postgres
      Edulytics__LessonContent__ReadFromJson: 'true'
      Edulytics__Deployment__CleanBootstrap: 'true'
      Edulytics__Deployment__RunStartupDataMaintenance: 'false'
      Edulytics__Deployment__SeedCurriculum: 'false'
      Edulytics__PresentationDemo__Provision: 'false'
      Edulytics__MeetingDemo__ResetAndSeed: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and migrate on disposable PostgreSQL only
        run: |
          set -euo pipefail
          python3 -m py_compile tools/curriculum/uae_g8_stage_d_authenticated_https.py tools/curriculum/uae_g8_stage_d_browser_rtl.py
          dotnet tool restore
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln -c Release --no-restore
          dotnet publish src/Edulytics.Web/Edulytics.Web.csproj -c Release --no-restore -o /tmp/g8-web-publish
          dotnet ef database update --project src/Edulytics.Data/Edulytics.Data.csproj --startup-project src/Edulytics.Web/Edulytics.Web.csproj --context EdulyticsDbContext
          dotnet run --project tools/Edulytics.CleanSeed/Edulytics.CleanSeed.csproj
      - name: Require exactly 76 Arabic Published G8 General identities, no legacy English refs
        run: |
          set -euo pipefail
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT COUNT(*) FROM \"CurriculumPedagogicalLessons\" WHERE \"Code\" LIKE 'PED:UAE-MOE-MATH:L8:GENERAL:%'")" = 76
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT COUNT(*) FROM \"CurriculumLessonContents\" c JOIN \"CurriculumPedagogicalLessons\" l ON l.\"Id\"=c.\"LessonNodeId\" WHERE l.\"Code\" LIKE 'PED:UAE-MOE-MATH:L8:GENERAL:%' AND c.\"Status\"=3")" = 76
          test "$(psql -h 127.0.0.1 -U postgres -d edulytics_clean_ci -Atqc "SELECT COUNT(*) FROM \"CurriculumPackContentNodes\" WHERE \"Code\" LIKE 'UAE:REF:TEXTBOOK:G8:GENERAL:%' OR \"Code\" LIKE 'UAE:CATALOG:G8:GENERAL:%'")" = 0
      - name: Run isolated four-role Grade8 HTTPS and actual Chromium mobile/desktop
        env:
          Edulytics__Deployment__CleanBootstrap: 'false'
          Edulytics__MeetingDemo__ResetAndSeed: 'true'
          Edulytics__Deployment__RunStartupMigrations: 'false'
          RENDER_SERVICE_ID: ci-disposable
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python3 -m playwright install --with-deps chromium
          export Edulytics__MeetingDemo__Password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$Edulytics__MeetingDemo__Password"
          if ! dotnet run --project tools/Edulytics.CiFixtures/Edulytics.CiFixtures.csproj -- academic > /tmp/g8-fixture.log 2>&1; then
            tail -n 80 /tmp/g8-fixture.log | grep -Eiv 'password|credential|secret|connection' || true
            exit 1
          fi
          grep -q 'MEETING_DEMO_SEED_COMPLETED' /tmp/g8-fixture.log
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/g8-key.pem -out /tmp/g8-cert.pem -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          openssl pkcs12 -export -out /tmp/g8-identity.pfx -inkey /tmp/g8-key.pem -in /tmp/g8-cert.pem -passout pass:local-test-tls >/dev/null 2>&1
          cp /tmp/g8-cert.pem /tmp/phase-uat-cert.pem
          export ASPNETCORE_URLS='https://127.0.0.1:5052'
          export ASPNETCORE_Kestrel__Certificates__Default__Path=/tmp/g8-identity.pfx
          export ASPNETCORE_Kestrel__Certificates__Default__Password=local-test-tls
          export Edulytics__MeetingDemo__ResetAndSeed='false'
          export ASPNETCORE_CONTENTROOT=/tmp/g8-web-publish
          dotnet /tmp/g8-web-publish/Edulytics.Web.dll >/tmp/g8-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent --cacert /tmp/phase-uat-cert.pem https://localhost:5052/health/ready >/dev/null; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 3
          done
          if [ "$ready" != true ]; then
            tail -n 80 /tmp/g8-web.log | grep -Eiv 'password|credential|secret|connection' || true
            exit 1
          fi
          python3 tools/curriculum/uae_g8_stage_d_authenticated_https.py || { tail -n 80 /tmp/g8-web.log | grep -Eiv 'password|credential|secret|connection' || true; exit 1; }
          python3 tools/curriculum/uae_g8_stage_d_browser_rtl.py
      - name: Verify 76 pages, 234 actual persisted attempt responses, 156 rendered viewports
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          auth=json.loads(pathlib.Path('/tmp/uae-g8-stage-d-authenticated-76-lessons.json').read_text())
          rtl=json.loads(pathlib.Path('/tmp/uae-g8-stage-d-browser-rtl/report.json').read_text())
          assert auth['candidateSha']==rtl['candidateSha']==os.environ['GITHUB_SHA']
          assert auth['grade']==7 and auth['lessonPageCount']==76
          assert auth['correctAttemptPersistenceCount']==auth['wrongAttemptPersistenceCount']==auth['malformedAttemptRejectionCount']==76
          assert auth['crossSchoolAccessDenied'] is True and all(auth['roleLogins'].values())
          assert auth['negativeEnglishFallbackChecks']==76
          assert rtl['rtlDesktopLessons']==rtl['rtlMobileLessons']==76 and rtl['screenshotsWritten']>=8
          out=pathlib.Path('artifacts/uae-g8-stage-d/grade8-e2e.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'candidateSha':os.environ['GITHUB_SHA'],'status':'PASS','authenticatedLearnerPages':76,'negativeEnglishFallbackChecks':76,'persistedPracticeAttempts':234,'chromiumPagesDesktopMobile':156,'screenshots':rtl['screenshotsWritten'],'sourceLiteralParity':'UNKNOWN','productionWritten':False},indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8-authenticated-e2e
          path: artifacts/uae-g8-stage-d/grade8-e2e.json
          if-no-files-found: error
          retention-days: 30

