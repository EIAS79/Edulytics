name: Edulytiks Public SEO (offline)
on:
  push:
    paths:
      - 'public-frontdoor/**'
      - '.github/workflows/public-frontdoor-seo.yml'
  pull_request:
    paths:
      - 'public-frontdoor/**'
      - '.github/workflows/public-frontdoor-seo.yml'
permissions:
  contents: read
jobs:
  marketing-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate SEO processor syntax
        run: |
          node --check public-frontdoor/seo-postprocess.mjs
          bash -n public-frontdoor/build.sh
      - name: Run offline static SEO fixtures
        run: |
          node public-frontdoor/test-seo.mjs
          node public-frontdoor/test-image-optimization.mjs
