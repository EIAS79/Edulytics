name: Phase30 Practice Assessment Item Engine

on:
  push:
    branches:
      - phase30/practice-assessment-item-engine
    paths:
      - 'tools/phase30/apply_phase30.py'
      - '.github/workflows/phase30-implementation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: phase30/practice-assessment-item-engine
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.200'

      - name: Apply Phase 30 implementation
        run: |
          set -euo pipefail
          python tools/phase30/apply_phase30.py

      - name: Restore and compile model
        run: |
          set -euo pipefail
          dotnet restore Edulytics.sln
          dotnet build Edulytics.sln --no-restore

      - name: Generate Phase 30 PostgreSQL migration
        env:
          ConnectionStrings__DefaultConnection: 'Host=localhost;Port=5432;Database=edulytics_phase30_design;Username=postgres;Password=postgres'
          Edulytics__Hosting__RequireDataProtectionCertificate: 'false'
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef --version 10.0.11
          export PATH="$PATH:$HOME/.dotnet/tools"
          if ! ls src/Edulytics.Data/Migrations/*_Phase30PracticeAssessmentItemEngine.cs >/dev/null 2>&1; then
            dotnet ef migrations add Phase30PracticeAssessmentItemEngine \
              --project src/Edulytics.Data/Edulytics.Data.csproj \
              --startup-project src/Edulytics.Web/Edulytics.Web.csproj \
              --context EdulyticsDbContext \
              --output-dir Migrations \
              --no-build
          fi

      - name: Verify generated migration is additive
        run: |
          set -euo pipefail
          migration="$(ls src/Edulytics.Data/Migrations/*_Phase30PracticeAssessmentItemEngine.cs | head -1)"
          test -n "$migration"
          if grep -E 'Drop(Table|Column)|Rename(Table|Column)' "$migration"; then
            echo 'ERROR: Phase30 migration contains destructive/rename operations.'
            exit 1
          fi
          grep -q 'AssessmentItems' "$migration"
          grep -q 'PracticeAttempts' "$migration"
          grep -q 'LearningEvidence' "$migration"
          grep -q 'StudentItemExposures' "$migration"

      - name: Build after migration
        run: |
          set -euo pipefail
          dotnet build Edulytics.sln --no-restore

      - name: Run Phase 30 tests
        run: |
          set -euo pipefail
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj \
            --no-build \
            --filter 'FullyQualifiedName~Edulytics.Tests.Phase30'

      - name: Run full regression suite
        run: |
          set -euo pipefail
          dotnet test tests/Edulytics.Tests/Edulytics.Tests.csproj --no-build

      - name: Static Phase 30 contract checks
        run: |
          set -euo pipefail
          grep -q 'LearningEvidenceType.Practice' src/Edulytics.Services/Practice/PracticeService.cs
          grep -q 'StudentItemExposure' src/Edulytics.Services/Practice/PracticeService.cs
          grep -q 'IsEnrolledInAdoptionAsync' src/Edulytics.Services/Practice/PracticeService.cs
          grep -q 'AssessmentResults' tests/Edulytics.Tests/Phase30/Phase30PracticeEngineTests.cs
          if grep -R -nE 'OpenAI|Gemini|Claude|Question Bank' src/Edulytics.Services/Practice src/Edulytics.Data/Repositories/PracticeRepository.cs; then
            echo 'ERROR: forbidden external-AI/question-bank dependency in Phase30 runtime.'
            exit 1
          fi
          git diff --check

      - name: Remove maintenance-only runner files
        run: |
          set -euo pipefail
          git rm tools/phase30/apply_phase30.py .github/workflows/phase30-implementation.yml

      - name: Commit verified Phase 30 product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m 'Phase30: add practice and assessment item engine'
          git push origin HEAD:phase30/practice-assessment-item-engine
