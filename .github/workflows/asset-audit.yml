name: Static asset audit

on:
  push:
    branches:
      - chore/asset-audit-cleanup-20260911

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit wwwroot references
        run: python3 scripts/audit_static_assets.py --report asset-audit-report.txt
      - name: Preserve report
        uses: actions/upload-artifact@v4
        with:
          name: asset-audit-report
          path: asset-audit-report.txt
          if-no-files-found: error

  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Public production smoke test
        shell: bash
        run: |
          set -euo pipefail
          base="https://edulytiks.com"

          echo "Cold/wake-up probe:"
          curl -sS -L --max-redirs 5 --max-time 150 -o /tmp/cold-body \
            -w 'status=%{http_code} final=%{url_effective} ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}\n' \
            "$base/"

          check_public() {
            local path="$1" expected="$2"
            local metrics code final ttfb total size
            metrics=$(curl -sS -L --max-redirs 5 --max-time 30 -o /tmp/body -w '%{http_code} %{url_effective} %{time_starttransfer} %{time_total}' "$base$path")
            read -r code final ttfb total <<<"$metrics"
            size=$(wc -c </tmp/body)
            printf '%-42s status=%s ttfb=%ss total=%ss bytes=%s final=%s\n' "$path" "$code" "$ttfb" "$total" "$size" "$final"
            test "$code" = "$expected"
          }
          check_exact() {
            local path="$1" expected="$2"
            local metrics code ttfb total size
            metrics=$(curl -sS --max-time 30 -o /tmp/body -w '%{http_code} %{time_starttransfer} %{time_total}' "$base$path")
            read -r code ttfb total <<<"$metrics"
            size=$(wc -c </tmp/body)
            printf '%-42s status=%s ttfb=%ss total=%ss bytes=%s\n' "$path" "$code" "$ttfb" "$total" "$size"
            test "$code" = "$expected"
          }
          check_redirect() {
            local path="$1"
            local headers metrics code ttfb total location
            headers=$(mktemp)
            metrics=$(curl -sS --max-time 30 -D "$headers" -o /dev/null -w '%{http_code} %{time_starttransfer} %{time_total}' "$base$path")
            read -r code ttfb total <<<"$metrics"
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$headers")
            printf '%-42s status=%s ttfb=%ss total=%ss location=%s\n' "$path" "$code" "$ttfb" "$total" "$location"
            test "$code" = "302" || test "$code" = "303"
            printf '%s' "$location" | grep -qi '/account/login'
          }

          check_public / 200
          check_public /account/login 200
          check_public /contact 200
          check_exact /health/live 200
          check_exact /health/ready 200
          check_exact /css/public-site-v31.css 200
          check_exact /js/public-site-v31.js 200
          check_exact /js/public-content-v31.js 200
          check_exact /set-culture 404
          check_redirect /student/learning
          check_redirect /lesson-content
          check_redirect /School/Users/Create
