name: Full Grade Curriculum Gate - Fail Closed Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/curriculum/EDULYTICS_GRADE_FIRST_FULL_GRADE_EXECUTION_PLAN_V1.md'
      - 'docs/curriculum/GRADE_FIRST_FULL_GRADE_EXECUTOR_SOP.md'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G1/full-grade-progress.json'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G1/grade-manifest.json'
      - 'tools/curriculum/us-ccss-full-grade-gate.cjs'
      - 'tests/us-ccss-full-grade-gate.test.cjs'
      - '.github/workflows/us-ccss-full-grade-gate.yml'
  push:
    branches: [main]
    paths:
      - 'docs/curriculum/EDULYTICS_GRADE_FIRST_FULL_GRADE_EXECUTION_PLAN_V1.md'
      - 'docs/curriculum/GRADE_FIRST_FULL_GRADE_EXECUTOR_SOP.md'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G1/full-grade-progress.json'
      - 'artifacts/curriculum-delivery/US-CCSS-MATH/G1/grade-manifest.json'
      - 'tools/curriculum/us-ccss-full-grade-gate.cjs'
      - 'tests/us-ccss-full-grade-gate.test.cjs'
      - '.github/workflows/us-ccss-full-grade-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade-gate-contract:
    name: g1-full-grade-negative-control
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test initial 146/96 scope and fail-closed rules
        run: node --test tests/us-ccss-full-grade-gate.test.cjs
      - name: Confirm incomplete 96 new lessons do NOT pass full-grade release
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tools/curriculum/us-ccss-full-grade-gate.cjs --release --sha="$(git rev-parse HEAD)" > /tmp/grade-gate-decision.json
          rc=$?
          set -e
          cat /tmp/grade-gate-decision.json
          test "$rc" -eq 1
          node -e "const x=require('/tmp/grade-gate-decision.json');if(x.outcome!=='NO_GO'||x.newAccepted!==0||x.newNotAccepted!==96||x.productionLive!==false)process.exit(1)"
      - name: Save blocked release decision, not an academic certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade-full-gate-no-go-initial
          path: /tmp/grade-gate-decision.json
          if-no-files-found: warn
