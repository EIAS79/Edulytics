<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edulytics — المثلثات متساوية الساقين ومتساوية الأضلاع</title><style>body{font:1rem/1.9 system-ui,"Noto Sans Arabic",Arial,sans-serif;background:#f4f7fc;color:#19324b;margin:0}main{max-width:860px;margin:auto;padding:1rem}section{padding:1rem;border:1px solid #bbccdb;border-radius:12px;background:white;margin:1rem 0}li{margin:1rem 0}textarea{box-sizing:border-box;width:100%;font:inherit;padding:.5rem;border:1px solid #97abbf;border-radius:7px}button{font:inherit;color:white;background:#15517b;border:0;border-radius:7px;padding:.7rem;cursor:pointer}textarea:focus-visible,button:focus-visible{outline:3px solid #d18c2c}</style></head><body><main><h1>المثلثات متساوية الساقين ومتساوية الأضلاع</h1><p>المنهج الإماراتي الوزاري — الصف التاسع العام — الوحدة 13 الدرس 6؛ كتاب الطالب 03-1.pdf الصفحات 765–773.</p><section><h2>المفهوم</h2><p>زوايا قاعدة المثلث متساوي الساقين متطابقة، والمتساوي الأضلاع زواياه الثلاث ٦٠°.</p></section><section><h2>Cool-down — مراجعة المعلم</h2><form id="f"><ol><li><label for="q1">زاوية رأس مثلث متساوي الساقين ٤٠°. احسب زاويتي القاعدة واذكر المبرر.</label><textarea id="q1" rows="3" required></textarea></li><li><label for="q2">إذا كانت زاويتا القاعدة ٦٥° لكل واحدة، فما قياس زاوية الرأس؟</label><textarea id="q2" rows="3" required></textarea></li><li><label for="q3">مثلث متساوي الأضلاع فيه ضلعان ٣س−٢ وس+٦. أوجد س وطول الضلع.</label><textarea id="q3" rows="3" required></textarea></li><li><label for="q4">مثلث فيه زاويتان متساويتان ٤٨°. ما الاستنتاج عن الضلعين المقابلين وقياس الثالثة؟</label><textarea id="q4" rows="3" required></textarea></li><li><label for="q5">هل كل مثلث متساوي الساقين متساوي الأضلاع؟ اعط مثالًا مضادًا.</label><textarea id="q5" rows="3" required></textarea></li><li><label for="q6">ارسم مثلثًا متساوي الساقين مع قطعة من الرأس إلى منتصف القاعدة، واكتب خطوات برهان أنها منصف زاوية وعمود على القاعدة.</label><textarea id="q6" rows="3" required></textarea></li></ol><button type="submit">تجهيز إجابات المعلم</button></form><label for="out">سجل محلي</label><textarea id="out" rows="10" readonly></textarea><p id="status" role="status"></p></section></main><script>'use strict';document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const answers=[1,2,3,4,5,6].map(i=>({question:i,response:document.getElementById('q'+i).value.trim(),review:'TEACHER_REVIEW_REQUIRED'}));if(answers.some(x=>!x.response)){document.getElementById('status').textContent='أكمل إجاباتك.';return;}document.getElementById('out').value=JSON.stringify({lesson:'UAE-MOE-MATH/G9/GENERAL/13-6',graded:false,submitted:false,review:'TEACHER_REVIEW_REQUIRED',answers},null,2);document.getElementById('status').textContent='سجل محلي لم يُرسل إلى Edulytics.';});</script></body></html>
