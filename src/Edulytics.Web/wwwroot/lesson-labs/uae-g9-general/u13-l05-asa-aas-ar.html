<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edulytics — تطابق المثلثات ASA/AAS</title><style>body{font:1rem/1.8 system-ui,"Noto Sans Arabic",Arial,sans-serif;background:#f4f7fa;margin:0;color:#193047}main{max-width:850px;margin:auto;padding:1rem}section{padding:1rem;margin:1rem 0;border:1px solid #bfd0df;border-radius:10px;background:white}li{margin:1rem 0}textarea{font:inherit;width:100%;box-sizing:border-box;border:1px solid #94aabe;border-radius:7px;padding:.5rem}button{font:inherit;padding:.7rem;background:#154e7b;color:white;border:0;border-radius:7px;cursor:pointer}textarea:focus-visible,button:focus-visible{outline:3px solid #d38d30}</style></head><body><main><h1>إثبات تطابق المثلثات ASA/AAS</h1><p>المنهج الإماراتي الوزاري — الصف التاسع العام — الوحدة 13 الدرس 5، كتاب الطالب 03-1.pdf الصفحات 755–764.</p><section><h2>المفهوم</h2><p>ASA: زاويتان والضلع المحصور بينهما. AAS: زاويتان وضلع غير محصور. AAA تكفي للتشابه فقط. التطبيق الحر يراجع بواسطة المعلم.</p></section><section><h2>تقويم ختامي (Cool-down)</h2><form id="f"><ol><li><label for="q1">زاويتان متناظرتان في مثلثين قياسهما ٤٠° و٧٠°، وبينهما ضلع ٨ سم متطابق. بيّن سبب التطابق واسم القاعدة.</label><textarea id="q1" required rows="3"></textarea></li><li><label for="q2">زاويتان ٣٥° و٧٥° وضلع طوله ١٠ سم غير محصور بينهما، متناظر في المثلثين. أي قاعدة تثبت التطابق؟</label><textarea id="q2" required rows="3"></textarea></li><li><label for="q3">ارسم مثلثين زواياهما ٤٠° و٧٠° و٧٠° لكن حجم أحدهما ضعف الآخر، واشرح لماذا لا تثبت AAA التطابق.</label><textarea id="q3" required rows="3"></textarea></li><li><label for="q4">كيف تتحقق من أن الضلع المعطى محصور بين الزاويتين في حالة ASA وليس غير محصور كما في AAS؟</label><textarea id="q4" required rows="3"></textarea></li><li><label for="q5">مثلثان يتشاركان ضلعًا ويحتوي كل منهما على زاويتين متناظرتين متطابقتين عند طرفيه. كيف تستعمل انعكاسية الضلع ومسلمة ASA؟</label><textarea id="q5" required rows="3"></textarea></li><li><label for="q6">بعد إثبات ΔABC≅ΔDEF بقاعدة AAS، اذكر الأجزاء المتناظرة التي يمكن استنتاج تطابقها بواسطة CPCTC.</label><textarea id="q6" required rows="3"></textarea></li></ol><button type="submit">تجهيز الإجابات للمعلم</button></form><label for="out">السجل المحلي</label><textarea id="out" rows="10" readonly></textarea><p id="status" role="status"></p></section></main><script>'use strict';document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const answers=[1,2,3,4,5,6].map(i=>({question:i,response:document.getElementById('q'+i).value.trim(),review:'TEACHER_REVIEW_REQUIRED'}));if(answers.some(x=>!x.response)){document.getElementById('status').textContent='أكمل إجاباتك.';return;}document.getElementById('out').value=JSON.stringify({lesson:'UAE-MOE-MATH/G9/GENERAL/13-5',graded:false,submitted:false,review:'TEACHER_REVIEW_REQUIRED',answers},null,2);document.getElementById('status').textContent='تم تجهيز السجل محليًا؛ لم يُرسل إلى Edulytics.';});</script></body></html>
