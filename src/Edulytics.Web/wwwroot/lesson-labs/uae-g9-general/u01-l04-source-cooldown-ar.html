<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edulytics — خاصية التوزيع</title><style>body{font:1rem/1.9 system-ui,"Noto Sans Arabic",Arial,sans-serif;background:#f4f7fc;color:#19324b;margin:0}main{max-width:860px;margin:auto;padding:1rem}section{padding:1rem;border:1px solid #bbccdb;border-radius:12px;background:white;margin:1rem 0}li{margin:1rem 0}textarea{box-sizing:border-box;width:100%;font:inherit;padding:.5rem;border:1px solid #97abbf;border-radius:7px}button{font:inherit;color:white;background:#15517b;border:0;border-radius:7px;padding:.7rem;cursor:pointer}textarea:focus-visible,button:focus-visible{outline:3px solid #d18c2c}</style></head><body><main><h1>خاصية التوزيع</h1><p>المنهج الوزاري الإماراتي — الصف التاسع العام — الوحدة 1، الدرس 4؛ مرجع كتاب الطالب 01.pdf المطبوعة ٢٥–٣١.</p><section><h2>تقويم ختامي (Cool-down) — مراجعة المعلم</h2><p>أجب دون مساعدة. تراجع الشروح والرسوم مع المعلم، ولا تُحتسب درجة آلية.</p><form id="f"><ol><li><label for="q1">اكتب ٥(س + ٢) بصورة موسعة.</label><textarea id="q1" rows="3" required></textarea></li>
<li><label for="q2">اكتب ٨ن − ١٢ باستخدام العامل المشترك ٤.</label><textarea id="q2" rows="3" required></textarea></li>
<li><label for="q3">هل −(س − ٤) = −س − ٤؟</label><textarea id="q3" rows="3" required></textarea></li></ol><button type="submit">تجهيز إجابات المعلم</button></form><label for="out">السجل المحلي</label><textarea id="out" rows="10" readonly></textarea><p id="status" role="status" aria-live="polite"></p></section></main><script>'use strict';document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const answers=Array.from({length:3},(_,i)=>({question:i+1,response:document.getElementById('q'+(i+1)).value.trim(),review:'TEACHER_REVIEW_REQUIRED'}));if(answers.some(a=>!a.response)){document.getElementById('status').textContent='أكمل الإجابات قبل تجهيز السجل.';return;}document.getElementById('out').value=JSON.stringify({lesson:'PED:UAE-MOE-MATH:L9:GENERAL:01:04:DISTRIBUTIVE-PROPERTY',graded:false,submitted:false,review:'TEACHER_REVIEW_REQUIRED',answers},null,2);document.getElementById('status').textContent='سجل محلي لم يُرسل إلى Edulytics ولم تُحتسب درجة.';});</script></body></html>
