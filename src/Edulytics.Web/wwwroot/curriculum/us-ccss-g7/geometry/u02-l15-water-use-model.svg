<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title desc">
  <title id="title">Water-use model with shower rate and bath comparison</title>
  <desc id="desc">A first-party graph with minutes on the horizontal axis and liters on the vertical axis. The shower model V equals 8t is a line through the origin. A horizontal bath reference is at 70 liters. They meet at 8.75 minutes.</desc>
  <rect width="700" height="420" fill="white"/>
  <line x1="80" y1="350" x2="630" y2="350" stroke="currentColor" stroke-width="3"/>
  <line x1="80" y1="350" x2="80" y2="45" stroke="currentColor" stroke-width="3"/>
  <text x="300" y="400" font-size="20">shower duration t (minutes)</text>
  <text x="22" y="230" font-size="20" transform="rotate(-90 22 230)">water V (liters)</text>
  <line x1="80" y1="350" x2="560" y2="70" stroke="currentColor" stroke-width="4"/>
  <line x1="80" y1="105" x2="620" y2="105" stroke="currentColor" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="500" cy="105" r="7" fill="currentColor"/>
  <text x="515" y="95" font-size="18">(8.75, 70)</text>
  <text x="420" y="165" font-size="20">shower: V = 8t</text>
  <text x="315" y="95" font-size="20">bath reference: 70 L</text>
  <text x="70" y="355" font-size="16" text-anchor="end">0</text>
  <text x="70" y="110" font-size="16" text-anchor="end">70</text>
</svg>