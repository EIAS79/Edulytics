<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">Circumference measures boundary and area measures coverage</title><desc id="desc">Two first-party circles of radius 5 are shown. The left circle highlights only the boundary for fencing or trim, while the right circle shades the interior for paint, grass, or material coverage.</desc>
<rect width="760" height="400" fill="white"/>
<circle cx="200" cy="185" r="120" fill="none" stroke="currentColor" stroke-width="8"/><line x1="200" y1="185" x2="320" y2="185" stroke="currentColor" stroke-width="2"/><text x="235" y="170" font-size="18">r=5</text><text x="115" y="340" font-size="21">boundary → C=10π</text>
<circle cx="560" cy="185" r="120" fill="currentColor" fill-opacity=".10" stroke="currentColor" stroke-width="3"/><line x1="560" y1="185" x2="680" y2="185" stroke="currentColor" stroke-width="2"/><text x="595" y="170" font-size="18">r=5</text><text x="485" y="340" font-size="21">coverage → A=25π</text>
</svg>