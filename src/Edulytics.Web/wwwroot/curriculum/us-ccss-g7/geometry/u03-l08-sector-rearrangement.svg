<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
<title id="title">Circle sectors rearranged into an almost rectangle</title><desc id="desc">A first-party circle split into equal wedges is shown beside alternating wedges rearranged into an almost rectangular strip. The strip height is radius r and its base approaches half the circumference, pi r.</desc>
<rect width="800" height="420" fill="white"/><circle cx="180" cy="190" r="125" fill="none" stroke="currentColor" stroke-width="3"/>
<g stroke="currentColor" stroke-width="2"><line x1="180" y1="190" x2="180" y2="65"/><line x1="180" y1="190" x2="268" y2="102"/><line x1="180" y1="190" x2="305" y2="190"/><line x1="180" y1="190" x2="268" y2="278"/><line x1="180" y1="190" x2="180" y2="315"/><line x1="180" y1="190" x2="92" y2="278"/><line x1="180" y1="190" x2="55" y2="190"/><line x1="180" y1="190" x2="92" y2="102"/></g>
<path d="M410 260 L455 120 L500 260 L545 120 L590 260 L635 120 L680 260" fill="none" stroke="currentColor" stroke-width="4"/>
<line x1="410" y1="260" x2="680" y2="260" stroke="currentColor" stroke-width="2"/><line x1="410" y1="120" x2="680" y2="120" stroke="currentColor" stroke-width="2" stroke-dasharray="8 6"/>
<text x="475" y="330" font-size="20">base approaches C/2 = πr</text><text x="695" y="200" font-size="20">height r</text><text x="430" y="75" font-size="20">area ≈ (πr)(r) = πr²</text>
</svg>