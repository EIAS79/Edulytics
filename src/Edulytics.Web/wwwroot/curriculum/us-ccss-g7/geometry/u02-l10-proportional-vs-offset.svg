<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" role="img" aria-labelledby="title desc">
<title id="title">Original Edulytiks comparison of a proportional and an offset line</title>
<desc id="desc">Left graph: points (0,0),(1,8),(2,16),(3,24) on a line through the origin. Right graph: points (0,10),(1,8),(2,6),(3,4),(4,2) on a straight line not through the origin. The two panels have different numerical y-axis units and must not be treated as one graph.</desc>
<rect width="580" height="300" rx="8" fill="#ffffff"/>
<g stroke="#d3dbe8" stroke-width="1">
<path d="M50 220H260M50 185H260M50 150H260M50 115H260M50 80H260M50 45H260M340 220H550M340 185H550M340 150H550M340 115H550M340 80H550M340 45H550"/>
<path d="M50 45V220M102.5 45V220M155 45V220M207.5 45V220M260 45V220M340 45V220M392.5 45V220M445 45V220M497.5 45V220M550 45V220"/>
</g>
<g stroke="#1b2a42" stroke-width="2" fill="none"><path d="M50 45V220H260M340 45V220H550"/></g>
<g font-family="Arial,sans-serif" fill="#15243c" font-size="14">
<text x="52" y="24">A: Price = 8 × shirts</text>
<text x="343" y="24">B: y = 10 − 2x</text>
<text x="155" y="260">Shirt count x</text>
<text x="455" y="260">Input x</text>
<text x="22" y="45">32</text><text x="28" y="223">0</text>
<text x="305" y="45">10</text><text x="318" y="223">0</text>
<text x="49" y="239">0</text><text x="151" y="239">2</text><text x="251" y="239">4</text>
<text x="339" y="239">0</text><text x="441" y="239">2</text><text x="543" y="239">4</text>
<text x="52" y="287" font-size="12">Line through origin</text>
<text x="344" y="287" font-size="12">Straight line with offset</text>
</g>
<path d="M50 220L260 45" stroke="#1764a4" stroke-width="3" fill="none"/>
<path d="M340 45L550 185" stroke="#bb5c25" stroke-width="3" fill="none"/>
<g fill="#1764a4"><circle cx="50" cy="220" r="4"/><circle cx="102.5" cy="176.25" r="4"/><circle cx="155" cy="132.5" r="4"/><circle cx="207.5" cy="88.75" r="4"/></g>
<g fill="#bb5c25"><circle cx="340" cy="45" r="4"/><circle cx="392.5" cy="80" r="4"/><circle cx="445" cy="115" r="4"/><circle cx="497.5" cy="150" r="4"/><circle cx="550" cy="185" r="4"/></g>
</svg>
