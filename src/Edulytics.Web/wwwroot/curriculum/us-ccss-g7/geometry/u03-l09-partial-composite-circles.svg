<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="title desc">
<title id="title">Full, half, quarter, and composite circle areas</title><desc id="desc">A first-party diagram shows a full circle of radius 6, a semicircle of radius 6, a quarter-circle of radius 6, and a rectangle with a circular cutout to illustrate exact areas in terms of pi and composite subtraction.</desc>
<rect width="780" height="420" fill="white"/>
<circle cx="115" cy="135" r="75" fill="none" stroke="currentColor" stroke-width="3"/><line x1="115" y1="135" x2="190" y2="135" stroke="currentColor"/><text x="125" y="125" font-size="17">r=6</text><text x="55" y="235" font-size="18">full: 36π</text>
<path d="M260 185 A75 75 0 0 1 410 185 L260 185" fill="none" stroke="currentColor" stroke-width="3"/><text x="275" y="235" font-size="18">half: 18π</text>
<path d="M500 185 L500 110 A75 75 0 0 1 575 185 Z" fill="none" stroke="currentColor" stroke-width="3"/><text x="480" y="235" font-size="18">quarter: 9π</text>
<rect x="600" y="70" width="140" height="180" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="670" cy="160" r="45" fill="none" stroke="currentColor" stroke-width="3"/><text x="600" y="285" font-size="17">rectangle − circle</text>
<text x="90" y="355" font-size="20">Use exact π terms for circular pieces; add or subtract only regions that are actually present.</text>
</svg>