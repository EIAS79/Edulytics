<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">One wheel rotation travels one circumference</title><desc id="desc">A first-party wheel of diameter 10 units rolls along a straight path. Three marked positions show that each complete rotation advances the wheel by 10 pi units, so three rotations travel 30 pi units.</desc>
<rect width="760" height="390" fill="white"/><line x1="60" y1="300" x2="710" y2="300" stroke="currentColor" stroke-width="3"/>
<circle cx="150" cy="210" r="90" fill="none" stroke="currentColor" stroke-width="4"/><line x1="150" y1="120" x2="150" y2="300" stroke="currentColor" stroke-width="2"/>
<text x="165" y="215" font-size="18">d=10</text><text x="80" y="345" font-size="18">1 rotation → 10π units</text>
<path d="M250 285 H610" stroke="currentColor" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="currentColor"/></marker></defs>
<text x="330" y="265" font-size="20">3 rotations → 30π units</text><text x="120" y="55" font-size="20">distance = circumference × rotations</text>
</svg>