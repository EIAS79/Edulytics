<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="title desc">
<title id="title">Circumference is proportional to diameter</title>
<desc id="desc">A first-party table of approximate circle measurements and a graph of circumference versus diameter. The points lie near a line through the origin with slope about 3.14.</desc>
<rect width="720" height="410" fill="white"/>
<text x="45" y="45" font-size="22">Measured circles</text>
<text x="45" y="82" font-size="18">d: 2, 4, 6, 8 cm</text>
<text x="45" y="115" font-size="18">C: 6.3, 12.5, 18.9, 25.1 cm</text>
<text x="45" y="148" font-size="18">C/d ≈ 3.15, 3.13, 3.15, 3.14</text>
<line x1="390" y1="335" x2="675" y2="335" stroke="currentColor" stroke-width="3"/>
<line x1="390" y1="335" x2="390" y2="55" stroke="currentColor" stroke-width="3"/>
<line x1="390" y1="335" x2="655" y2="75" stroke="currentColor" stroke-width="3"/>
<g fill="currentColor"><circle cx="455" cy="271" r="5"/><circle cx="520" cy="207" r="5"/><circle cx="585" cy="143" r="5"/><circle cx="650" cy="79" r="5"/></g>
<text x="500" y="385" font-size="18">diameter d</text><text x="360" y="220" font-size="18" transform="rotate(-90 360 220)">circumference C</text>
<text x="470" y="55" font-size="18">slope ≈ π</text>
</svg>