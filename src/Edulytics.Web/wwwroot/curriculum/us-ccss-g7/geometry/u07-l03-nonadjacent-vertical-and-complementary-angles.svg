<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="g7-u07-l03-title g7-u07-l03-desc">
  <title id="g7-u07-l03-title">Vertical angles and nonadjacent complementary angles</title>
  <desc id="g7-u07-l03-desc">Two straight lines cross at O, forming opposite angles of 55 and 55 degrees and 125 and 125 degrees. Adjacent 55 and 125 degree angles add to 180 degrees. At two different vertices, a 28 degree angle and a 62 degree angle are complementary even though they do not share a vertex. This is an original reference figure. Draw and measure your own intersecting lines.</desc>
  <style>.bg{fill:#fff}.panel{fill:#f6f9fc;stroke:#687c8d;stroke-width:1.5}.line{stroke:#19334b;stroke-width:3.2;stroke-linecap:round}.ray{stroke:#95501e;stroke-width:3}.heading{font:bold 19px system-ui,sans-serif;fill:#18334b}.lab{font:17px system-ui,sans-serif;fill:#18334b}.note{font:15px system-ui,sans-serif;fill:#18334b}</style>
  <rect class="bg" width="1080" height="430"/>
  <text class="heading" x="22" y="30">Nonadjacent and vertical angles</text>
  <rect class="panel" x="18" y="45" width="502" height="340" rx="8"/>
  <rect class="panel" x="540" y="45" width="520" height="340" rx="8"/>
  <text class="heading" x="35" y="79">Opposite angles at intersecting lines</text>
  <line id="intersecting-horizontal" class="line" x1="87" y1="235" x2="423" y2="235"/>
  <line id="intersecting-diagonal" class="line" x1="163.23" y1="366.06" x2="346.77" y2="103.94" data-angle-deg="55"/>
  <circle cx="255" cy="235" r="5" fill="#19334b"/>
  <text class="lab" x="264" y="254">O</text>
  <text class="lab" x="294" y="207">55°</text>
  <text class="lab" x="174" y="180">125°</text>
  <text class="lab" x="184" y="283">55°</text>
  <text class="lab" x="314" y="292">125°</text>
  <text class="note" x="35" y="362">Vertical angles match; adjacent 125° + 55° = 180°</text>
  <text class="heading" x="555" y="79">Separate complementary angles</text>
  <line class="line" x1="682" y1="304" x2="792" y2="304"/>
  <line id="separate-angle-28" class="ray" x1="682" y1="304" x2="775.59" y2="254.24" data-angle-deg="28"/>
  <text class="lab" x="735" y="281">28°</text>
  <text class="note" x="671" y="323">A</text>
  <line class="line" x1="875" y1="304" x2="1000" y2="304"/>
  <line id="separate-angle-62" class="ray" x1="875" y1="304" x2="926.64" y2="206.88" data-angle-deg="62"/>
  <text class="lab" x="926" y="267">62°</text>
  <text class="note" x="863" y="323">B</text>
  <text class="note" x="555" y="362">A and B are distinct vertices: 28° + 62° = 90°</text>
  <text class="note" x="22" y="413">Original Edulytiks reference; use a straightedge and protractor for your own drawing and measurement.</text>
</svg>
