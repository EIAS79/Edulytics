<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Four consistent representations of a proportional relationship</title>
  <desc id="desc">A first-party diagram showing a context of four credits per task, the equation y equals 4x, a table with zero to zero, one to four, two to eight, and three to twelve, and a line through the origin and points one comma four, two comma eight, and three comma twelve.</desc>
  <rect width="760" height="420" fill="white"/>
  <rect x="25" y="25" width="330" height="155" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="45" y="55" font-size="22">Context</text>
  <text x="45" y="88" font-size="18">A learner earns 4 credits per completed task.</text>
  <text x="45" y="125" font-size="22">Equation: y = 4x</text>
  <text x="45" y="155" font-size="17">x = tasks, y = credits</text>
  <rect x="25" y="205" width="330" height="185" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="45" y="235" font-size="22">Table</text>
  <text x="55" y="270" font-size="18">x</text><text x="115" y="270" font-size="18">0</text><text x="175" y="270" font-size="18">1</text><text x="235" y="270" font-size="18">2</text><text x="295" y="270" font-size="18">3</text>
  <text x="55" y="310" font-size="18">y</text><text x="115" y="310" font-size="18">0</text><text x="175" y="310" font-size="18">4</text><text x="235" y="310" font-size="18">8</text><text x="290" y="310" font-size="18">12</text>
  <text x="45" y="355" font-size="17">Every nonzero y/x = 4.</text>
  <rect x="390" y="25" width="345" height="365" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="410" y="55" font-size="22">Graph</text>
  <line x1="445" y1="340" x2="700" y2="340" stroke="currentColor" stroke-width="3"/>
  <line x1="445" y1="340" x2="445" y2="85" stroke="currentColor" stroke-width="3"/>
  <line x1="445" y1="340" x2="650" y2="115" stroke="currentColor" stroke-width="4"/>
  <circle cx="510" cy="265" r="6" fill="currentColor"/><circle cx="575" cy="190" r="6" fill="currentColor"/><circle cx="640" cy="115" r="6" fill="currentColor"/>
  <text x="515" y="255" font-size="16">(1,4)</text><text x="580" y="180" font-size="16">(2,8)</text><text x="645" y="105" font-size="16">(3,12)</text>
  <text x="535" y="375" font-size="18">tasks x</text>
  <text x="415" y="235" font-size="18" transform="rotate(-90 415 235)">credits y</text>
</svg>