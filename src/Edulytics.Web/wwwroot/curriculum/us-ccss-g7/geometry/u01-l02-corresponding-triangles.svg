<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 675 325" role="img" aria-labelledby="g7u01l02-title g7u01l02-desc">
  <title id="g7u01l02-title">Corresponding triangles and angles</title>
  <desc id="g7u01l02-desc">Original right triangle A(0,0), B(4,0), C(0,3) and scaled copy D(0,0), E(6,0), F(0,4.5) in a conventional coordinate system. Both are drawn at the SAME 24-pixel-per-unit page scale; ABC legs are 4 and 3 units and DEF legs are 6 and 4.5. Corresponding vertices A↔D, B↔E and C↔F, scale factor 1.5, right angles at A and D. SVG drawing y coordinates are inverted solely to place increasing mathematical y upward.</desc>
  <style>
    .panel{fill:#fff;stroke:#555;stroke-width:1.5}.shape{fill:#dcecf3;stroke:#152d40;stroke-width:2.5;stroke-linejoin:round}
    .bad{fill:#f0f0f0;stroke:#661a1a;stroke-width:2.5;stroke-dasharray:6 3;stroke-linejoin:round}
    .heading{fill:#101820;font:bold 17px system-ui,sans-serif}.minor{fill:#263746;font:13px system-ui,sans-serif}
    .caption{fill:#101820;font:15px system-ui,sans-serif}.math{fill:#101820;font:bold 16px system-ui,sans-serif}
    .line{stroke:#101820;stroke-width:2}.dot{fill:#101820}
  </style>
  <rect width="675" height="325" fill="#fff"/>
  <text x="24" y="29" class="heading">Corresponding triangles and angles</text>
  <rect class="panel" x="26" y="46" width="290" height="235" rx="10"/><rect class="panel" x="356" y="46" width="290" height="235" rx="10"/><text x="42" y="73" class="heading">ABC: original triangle</text><text x="372" y="73" class="heading">DEF: scaled copy (k = 1.5)</text><polygon class="shape" points="115,232 211,232 115,160" /><polygon class="shape" points="438,232 582,232 438,124" /><text class="math" x="95" y="251">A</text><text class="math" x="218" y="251">B</text><text class="math" x="95" y="149">C</text><text class="math" x="419" y="251">D</text><text class="math" x="591" y="251">E</text><text class="math" x="419" y="101">F</text><text class="caption" x="145" y="226">4</text><text class="caption" x="102" y="191">3</text><text class="caption" x="506" y="226">6</text><text class="caption" x="425" y="169">4.5</text><text class="caption" x="29" y="310">A ↔ D, B ↔ E, C ↔ F; right angle 90° at A and D</text>
</svg>
