<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="title desc">
  <title id="title">Compare constant-speed graphs on the same axes</title>
  <desc id="desc">A first-party distance-time graph. Line A runs from the origin to 20 seconds comma 50 meters and is steeper. Line B runs from the origin to 30 seconds comma 50 meters. A dashed delayed-start segment runs from 10 seconds comma zero meters to 40 seconds comma 50 meters and does not pass through the shared origin.</desc>
  <rect width="680" height="430" fill="white"/>
  <line x1="85" y1="350" x2="620" y2="350" stroke="currentColor" stroke-width="3"/>
  <line x1="85" y1="350" x2="85" y2="45" stroke="currentColor" stroke-width="3"/>
  <text x="310" y="405" font-size="20">shared elapsed time (seconds)</text>
  <text x="22" y="220" font-size="20" transform="rotate(-90 22 220)">distance (meters)</text>
  <g font-size="16" text-anchor="middle">
    <text x="85" y="374">0</text><text x="215" y="374">10</text><text x="345" y="374">20</text>
    <text x="475" y="374">30</text><text x="605" y="374">40</text>
  </g>
  <text x="70" y="356" font-size="16" text-anchor="end">0</text>
  <text x="70" y="58" font-size="16" text-anchor="end">50</text>
  <line x1="85" y1="350" x2="345" y2="55" stroke="currentColor" stroke-width="5"/>
  <line x1="85" y1="350" x2="475" y2="55" stroke="currentColor" stroke-width="3"/>
  <line x1="215" y1="350" x2="605" y2="55" stroke="currentColor" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="280" y="95" font-size="20">A: 50 m in 20 s</text>
  <text x="440" y="115" font-size="20">B: 50 m in 30 s</text>
  <text x="390" y="305" font-size="18">delayed start</text>
</svg>