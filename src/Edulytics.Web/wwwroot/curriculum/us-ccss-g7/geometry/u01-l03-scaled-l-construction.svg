<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 925 380" role="img" aria-labelledby="g7u01l03-title g7u01l03-desc">
  <title id="g7u01l03-title">Constructing scaled L-shaped figures</title>
  <desc id="g7u01l03-desc">The original six-vertex L-shaped polygon has coordinates (0,0),(6,0),(6,2),(4,2),(4,5),(0,5). The smaller scaled copy has scale factor one half and the larger scaled copy has scale factor three; all corresponding x and y coordinates are multiplied by those same factors. All three appear at the same drawing unit (13 pixels), so displayed lengths honestly show the factors, rather than fitting shapes to identical bounding boxes. Student constructions require teacher review.</desc>
  <style>
    .panel{fill:#fff;stroke:#555;stroke-width:1.5}.shape{fill:#dcecf3;stroke:#152d40;stroke-width:2.5;stroke-linejoin:round}
    .bad{fill:#f0f0f0;stroke:#661a1a;stroke-width:2.5;stroke-dasharray:6 3;stroke-linejoin:round}
    .heading{fill:#101820;font:bold 17px system-ui,sans-serif}.minor{fill:#263746;font:13px system-ui,sans-serif}
    .caption{fill:#101820;font:15px system-ui,sans-serif}.math{fill:#101820;font:bold 16px system-ui,sans-serif}
    .line{stroke:#101820;stroke-width:2}.dot{fill:#101820}
  </style>
  <rect width="925" height="380" fill="#fff"/>
  <text x="24" y="29" class="heading">Constructing scaled L-shaped figures</text>
  <rect class="panel" x="20" y="48" width="260" height="284" rx="10" /><text class="heading" x="34" y="73">Original L</text><text class="minor" x="34" y="92">6 units wide, 5 high</text><rect class="panel" x="325" y="48" width="260" height="284" rx="10" /><text class="heading" x="339" y="73">Half-size copy</text><text class="minor" x="339" y="92">k = 1/2</text><rect class="panel" x="635" y="48" width="278" height="284" rx="10" /><text class="heading" x="649" y="73">Triple-size copy</text><text class="minor" x="649" y="92">k = 3</text><polygon class="shape" points="80,127 158,127 158,153 132,153 132,192 80,192" /><polygon class="shape" points="383,127 422,127 422,140 409,140 409,159.5 383,159.5" /><polygon class="shape" points="669,111 903,111 903,189 825,189 825,306 669,306" /><text x="35" y="359" class="math">Width 6; height 5</text><text x="340" y="359" class="math">Width 3; height 2.5</text><text x="650" y="359" class="math">Width 18; height 15</text>
</svg>
