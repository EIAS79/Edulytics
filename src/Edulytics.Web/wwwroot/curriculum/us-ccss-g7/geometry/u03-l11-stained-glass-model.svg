<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Stained-glass circular window cost model</title><desc id="desc">A first-party circular stained-glass window of radius 2 meters is divided into simple colored geometric regions. A modeling panel lists total circular area, glass cost per square meter, trim cost per meter of circumference, and a reminder to state waste and labor assumptions.</desc>
<rect width="760" height="430" fill="white"/>
<circle cx="220" cy="205" r="150" fill="none" stroke="currentColor" stroke-width="5"/><line x1="220" y1="55" x2="220" y2="355" stroke="currentColor" stroke-width="2"/><line x1="70" y1="205" x2="370" y2="205" stroke="currentColor" stroke-width="2"/>
<polygon points="220,55 370,205 220,355 70,205" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="8 5"/><text x="235" y="195" font-size="18">r=2 m</text>
<rect x="430" y="65" width="290" height="285" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="455" y="105" font-size="20">Model assumptions</text><text x="455" y="145" font-size="18">glass area = 4π m²</text><text x="455" y="180" font-size="18">glass rate = 45 / m²</text><text x="455" y="215" font-size="18">trim uses circumference</text><text x="455" y="250" font-size="18">state waste allowance</text><text x="455" y="285" font-size="18">state labor assumption</text><text x="455" y="320" font-size="18">round only at the end</text>
</svg>