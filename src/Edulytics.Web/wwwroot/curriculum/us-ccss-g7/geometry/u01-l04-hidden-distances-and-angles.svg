<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 305" role="img" aria-labelledby="g7u01l04-title g7u01l04-desc">
<title id="g7u01l04-title">Corresponding unmarked diagonals and equal angles</title>
<desc id="g7u01l04-desc">Two rectangles plotted at the same 20-pixel-per-unit drawing scale. The original is 4 units wide and 3 units tall with an unconnected vertex-to-vertex diagonal of 5 units. The scaled copy uses scale factor 2, is 8 units wide and 6 units tall, and has a matching diagonal of 10 units. Both lower-left right angles remain 90 degrees. Dashed line segments represent the diagonals to measure; learners must draw and justify their own scaled figures.</desc>
<style>
.panel{fill:#fff;stroke:#405163;stroke-width:1.8}.shape{fill:#e5f3fc;stroke:#112b45;stroke-width:2.5}.diag{stroke:#8b2e19;stroke-width:2.5;stroke-dasharray:7 5}.letter{fill:#102339;font:600 15px system-ui,sans-serif}.heading{fill:#102339;font:700 18px system-ui,sans-serif}.note{fill:#102339;font:14px system-ui,sans-serif}
</style>
<rect width="620" height="305" fill="#fff"/>
<text x="20" y="28" class="heading">Scale factor 2: even an unmarked distance scales</text>
<rect class="panel" x="18" y="45" width="218" height="215" rx="8"/>
<rect class="panel" x="260" y="45" width="340" height="215" rx="8"/>
<text x="32" y="69" class="heading">Original: 4 by 3</text>
<text x="274" y="69" class="heading">Copy: 8 by 6</text>
<polygon class="shape" points="70,220 150,220 150,160 70,160"/>
<polygon class="shape" points="315,220 475,220 475,100 315,100"/>
<line class="diag" x1="70" y1="220" x2="150" y2="160"/>
<line class="diag" x1="315" y1="220" x2="475" y2="100"/>
<text class="letter" x="51" y="239">A</text><text class="letter" x="155" y="239">B</text><text class="letter" x="154" y="157">C</text><text class="letter" x="52" y="157">D</text>
<text class="letter" x="294" y="239">E</text><text class="letter" x="480" y="239">F</text><text class="letter" x="481" y="99">G</text><text class="letter" x="296" y="99">H</text>
<text class="note" x="32" y="252">Diagonal AC = 5 units</text>
<text class="note" x="274" y="252">Diagonal EG = 10 units</text>
<text class="note" x="20" y="286">Corresponding angles: 90° ↔ 90°. Measure diagonals or reason with the scale.</text>
</svg>
