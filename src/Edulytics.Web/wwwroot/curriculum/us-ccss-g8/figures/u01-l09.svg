<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Original Grade 8 U01 L09 geometry representations</title><desc id="desc">Horizontal parallel lines y=1 and y=4; a common translation by (2,3) maps them to y=4 and y=7; a half-turn about (0,0) maps them to y=-1 and y=-4; reflection in y=0 produces the same line equations but does not reverse x. Distance remains three.</desc><rect width="960" height="560" fill="#fff"/><rect x="16" y="95" width="925" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="25" y="43" font-size="24" fill="#0f172a">U01 L09 — independent first-party geometry</text><line id="source-0-0" x1="58" y1="337" x2="254" y2="337" stroke="#2563eb" stroke-width="3"/><line id="image-0-0" x1="114" y1="253" x2="310" y2="253" stroke="#be123c" stroke-width="3"/><line id="source-0-1" x1="58" y1="253" x2="254" y2="253" stroke="#2563eb" stroke-width="3"/><line id="image-0-1" x1="114" y1="169" x2="310" y2="169" stroke="#be123c" stroke-width="3"/><text x="30" y="175" font-size="16" fill="#0f172a">translate (+2,+3)</text><text x="30" y="492" font-size="14" fill="#0f172a">Parallel; distance = 3</text><line id="source-1-0" x1="355" y1="337" x2="551" y2="337" stroke="#2563eb" stroke-width="3"/><line id="image-1-0" x1="523" y1="393" x2="327" y2="393" stroke="#16a34a" stroke-width="3"/><line id="source-1-1" x1="355" y1="253" x2="551" y2="253" stroke="#2563eb" stroke-width="3"/><line id="image-1-1" x1="523" y1="477" x2="327" y2="477" stroke="#16a34a" stroke-width="3"/><text x="327" y="175" font-size="16" fill="#0f172a">rotate 180° about O</text><text x="327" y="492" font-size="14" fill="#0f172a">Parallel; distance = 3</text><line id="source-2-0" x1="652" y1="337" x2="848" y2="337" stroke="#2563eb" stroke-width="3"/><line id="image-2-0" x1="652" y1="393" x2="848" y2="393" stroke="#7e22ce" stroke-width="3"/><line id="source-2-1" x1="652" y1="253" x2="848" y2="253" stroke="#2563eb" stroke-width="3"/><line id="image-2-1" x1="652" y1="477" x2="848" y2="477" stroke="#7e22ce" stroke-width="3"/><text x="624" y="175" font-size="16" fill="#0f172a">reflect across y=0</text><text x="624" y="492" font-size="14" fill="#0f172a">Parallel; distance = 3</text></svg>
