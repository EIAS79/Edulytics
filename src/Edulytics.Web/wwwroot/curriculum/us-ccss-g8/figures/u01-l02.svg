<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc"><title id="title">Grade 8: 120-degree counterclockwise rotation and vertical reflection</title><desc id="desc">Original first-party models for Naming the Moves. Left: asymmetric quadrilateral O(0,0), A(2,0), B(2.8,1), C(1.2,1.7) rotates 120 degrees counterclockwise around O; O stays fixed, A moves to approximately (-1,1.732). Right: quadrilateral P(1,0.5), Q(3,0.5), R(2.5,2), S(1.4,1.4) reflects across x=0, so each image has the opposite x-coordinate and unchanged y-coordinate. Both motions preserve side lengths; reflection reverses orientation but rotation does not. These are independent Edulytiks constructions, not copies of publisher artwork.</desc><rect width="900" height="610" fill="#fff"/><rect x="22" y="78" width="426" height="466" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><rect x="456" y="78" width="426" height="466" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="25" y="37" font-size="26" font-weight="bold" fill="#111827">Naming the Moves: original models</text><text x="38" y="110" font-size="20" font-weight="bold" fill="#111827">120° counterclockwise rotation</text><text x="472" y="110" font-size="20" font-weight="bold" fill="#111827">Reflection across x = 0</text><text x="38" y="133" font-size="14" fill="#334155">Fixed center O; all vertices turn by the same angle</text><text x="472" y="133" font-size="14" fill="#334155">Mirror line midway between corresponding points</text><line x1="130" y1="355" x2="440" y2="355" stroke="#cbd5e1" stroke-width="1"/><line x1="240" y1="162" x2="240" y2="477" stroke="#cbd5e1" stroke-width="1"/><line x1="680" y1="160" x2="680" y2="500" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 6"/><text x="690" y="182" font-size="16" fill="#334155">x = 0</text><polygon id="rotation-original" points="240,355 378,355 433.2,286 322.8,237.7" stroke="#1d4ed8" stroke-width="3.5" fill="#1d4ed8" fill-opacity="0.13" stroke-linejoin="round"/><polygon id="rotation-image" points="240,355 171,235.48849 83.64425,222.18389 97.01522,341.9431" stroke="#be123c" stroke-width="3.5" fill="#be123c" fill-opacity="0.13" stroke-linejoin="round"/><polygon id="reflection-original" points="733,393.5 839,393.5 812.5,314 754.2,345.8" stroke="#1d4ed8" stroke-width="3.5" fill="#1d4ed8" fill-opacity="0.13" stroke-linejoin="round"/><polygon id="reflection-image" points="627,393.5 521,393.5 547.5,314 605.8,345.8" stroke="#be123c" stroke-width="3.5" fill="#be123c" fill-opacity="0.13" stroke-linejoin="round"/><circle cx="240" cy="355" r="4.5" fill="#1d4ed8"/><text x="247" y="374" font-size="15" font-weight="600" fill="#1d4ed8">O</text><circle cx="378" cy="355" r="4.5" fill="#1d4ed8"/><text x="385" y="374" font-size="15" font-weight="600" fill="#1d4ed8">A</text><circle cx="433.2" cy="286" r="4.5" fill="#1d4ed8"/><text x="440.2" y="305" font-size="15" font-weight="600" fill="#1d4ed8">B</text><circle cx="322.8" cy="237.7" r="4.5" fill="#1d4ed8"/><text x="329.8" y="256.7" font-size="15" font-weight="600" fill="#1d4ed8">C</text><circle cx="171" cy="235.48849" r="4.5" fill="#be123c"/><text x="148" y="225.48849" font-size="15" font-weight="600" fill="#be123c">A′</text><circle cx="83.64425" cy="222.18389" r="4.5" fill="#be123c"/><text x="60.64425" y="212.18389" font-size="15" font-weight="600" fill="#be123c">B′</text><circle cx="97.01522" cy="341.9431" r="4.5" fill="#be123c"/><text x="74.01522" y="331.9431" font-size="15" font-weight="600" fill="#be123c">C′</text><circle cx="733" cy="393.5" r="4.5" fill="#1d4ed8"/><text x="740" y="383.5" font-size="15" font-weight="600" fill="#1d4ed8">P</text><circle cx="839" cy="393.5" r="4.5" fill="#1d4ed8"/><text x="846" y="383.5" font-size="15" font-weight="600" fill="#1d4ed8">Q</text><circle cx="812.5" cy="314" r="4.5" fill="#1d4ed8"/><text x="819.5" y="304" font-size="15" font-weight="600" fill="#1d4ed8">R</text><circle cx="754.2" cy="345.8" r="4.5" fill="#1d4ed8"/><text x="761.2" y="335.8" font-size="15" font-weight="600" fill="#1d4ed8">S</text><circle cx="627" cy="393.5" r="4.5" fill="#be123c"/><text x="602" y="383.5" font-size="15" font-weight="600" fill="#be123c">P′</text><circle cx="521" cy="393.5" r="4.5" fill="#be123c"/><text x="496" y="383.5" font-size="15" font-weight="600" fill="#be123c">Q′</text><circle cx="547.5" cy="314" r="4.5" fill="#be123c"/><text x="522.5" y="304" font-size="15" font-weight="600" fill="#be123c">R′</text><circle cx="605.8" cy="345.8" r="4.5" fill="#be123c"/><text x="580.8" y="335.8" font-size="15" font-weight="600" fill="#be123c">S′</text><path d="M 295 355 A 55 55 0 0 0 212.5 307.3686" stroke="#15803d" stroke-width="3" fill="none"/><text x="278" y="274" font-size="18" font-weight="bold" fill="#166534">120° CCW</text><text x="40" y="524" font-size="14" fill="#1d4ed8">Blue: original</text><text x="177" y="524" font-size="14" fill="#be123c">Red: image</text><text x="475" y="524" font-size="14" fill="#1d4ed8">Blue: original</text><text x="625" y="524" font-size="14" fill="#be123c">Red: mirrored image</text><text x="27" y="575" font-size="15" fill="#334155">Rotation preserves orientation. Reflection reverses orientation. Both preserve distances.</text></svg>
