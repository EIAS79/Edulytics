<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-labelledby="title desc"><title id="title">Grade 8 U01 L16 original geometric proof</title><desc id="desc">Original triangle A(0,0), B(6,0), C(2,3), with a line through C at y=3 parallel to base AB at y=0. Alternate interior angles at C equal the two base angles. Three consecutive angles at C lie on a straight 180-degree line. Static visual: teacher reviews construction and proof.</desc><rect width="860" height="560" fill="white"/><rect x="18" y="92" width="824" height="425" rx="10" stroke="#cbd5e1" fill="#f8fafc"/><text x="29" y="44" font-size="22" fill="#0f172a">U01 L16 — first-party coordinate model</text><line id="base" x1="200" y1="430" x2="626" y2="430" stroke="#2563eb" stroke-width="3"/><line id="leg-a" x1="200" y1="430" x2="342" y2="217" stroke="#2563eb" stroke-width="3"/><line id="leg-b" x1="626" y1="430" x2="342" y2="217" stroke="#2563eb" stroke-width="3"/><line id="parallel-through-C" x1="129" y1="217" x2="697" y2="217" stroke="#16a34a" stroke-width="3"/><text x="35" y="138" font-size="18" fill="#0f172a">Transferred base angles + vertex angle = 180°</text></svg>
