><line x1="68" x2="708" y1="572" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="570" font-size="12" fill="#444">-3</text><line x1="68" x2="708" y1="500.57142857142856" y2="500.57142857142856" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="498.57142857142856" font-size="12" fill="#444">-2</text><line x1="68" x2="708" y1="429.14285714285717" y2="429.14285714285717" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="427.14285714285717" font-size="12" fill="#444">-1</text><line x1="68" x2="708" y1="357.7142857142857" y2="357.7142857142857" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="355.7142857142857" font-size="12" fill="#444">0</text><line x1="68" x2="708" y1="286.2857142857143" y2="286.2857142857143" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="284.2857142857143" font-size="12" fill="#444">1</text><line x1="68" x2="708" y1="214.85714285714286" y2="214.85714285714286" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="212.85714285714286" font-size="12" fill="#444">2</text><line x1="68" x2="708" y1="143.42857142857144" y2="143.42857142857144" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="141.42857142857144" font-size="12" fill="#444">3</text><line x1="68" x2="708" y1="72" y2="72" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="70" font-size="12" fill="#444">4</text><line x1="68" x2="708" y1="357.7142857142857" y2="357.7142857142857" stroke="#111827" stroke-width="2"/><line x1="388" x2="388" y1="72" y2="572" stroke="#111827" stroke-width="2"/><circle cx="452" cy="286.2857142857143" r="6" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"/><text x="460" y="274.2857142857143" font-weight="600" font-size="13" fill="#111827">P (1, 1)</text><circle cx="196" cy="286.2857142857143" r="6" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"/><text x="204" y="274.2857142857143" font-weight="600" font-size="13" fill="#111827">A (-3, 1)</text><circle cx="452" cy="286.2857142857143" r="6" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"/><text x="460" y