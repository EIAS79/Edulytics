<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc"><title id="title">Reflections across the coordinate axes</title><desc id="desc">The original point P(3,2) is reflected in the x-axis to X(3,−2) and separately in the y-axis to Y(−3,2). Only the coordinate perpendicular to the mirror changes.</desc><rect width="800" height="650" fill="white"/><text x="40" y="39" font-size="25" font-weight="bold" fill="#0f172a">Reflections across the coordinate axes</text><line x1="68" x2="68" y1="72" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="70" y="590" font-size="12" fill="#444">-5</text><line x1="132" x2="132" y1="72" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="134" y="590" font-size="12" fill="#444">-4</text><line x1="196" x2="196" y1="72" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="198" y="590" font-size="12" fill="#444">-3</text><line x1="260" x2="260" y1="72" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="262" y="590" font-size="12" fill="#444">-2</text><line x1="324" x2="324" y1="72" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="326" y="590" font-size="12" fill="#444">-1</text><line x1="388" x2="388" y1="72" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="390" y="590" font-size="12" fill="#444">0</text><line x1="452" x2="452" y1="72" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="454" y="590" font-size="12" fill="#444">1</text><line x1="516" x2="516" y1="72" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="518" y="590" font-size="12" fill="#444">2</text><line x1="580" x2="580" y1="72" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="582" y="590" font-size="12" fill="#444">3</text><line x1="644" x2="644" y1="72" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="646" y="590" font-size="12" fill="#444">4</text><line x1="708" x2="708" y1="72" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="710" y="590" font-size="12" fill="#444">5</text><line x1="68" x2="708" y1="572" y2="572" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="570" font-size="12" fill="#444">-4</text><line x1="68" x2="708" y1="509.5" y2="509.5" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="507.5" font-size="12" fill="#444">-3</text><line x1="68" x2="708" y1="447" y2="447" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="445" font-size="12" fill="#444">-2</text><line x1="68" x2="708" y1="384.5" y2="384.5" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="382.5" font-size="12" fill="#444">-1</text><line x1="68" x2="708" y1="322" y2="322" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="320" font-size="12" fill="#444">0</text><line x1="68" x2="708" y1="259.5" y2="259.5" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="257.5" font-size="12" fill="#444">1</text><line x1="68" x2="708" y1="197" y2="197" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="195" font-size="12" fill="#444">2</text><line x1="68" x2="708" y1="134.5" y2="134.5" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="132.5" font-size="12" fill="#444">3</text><line x1="68" x2="708" y1="72" y2="72" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="70" font-size="12" fill="#444">4</text><line x1="68" x2="708" y1="322" y2="322" stroke="#111827" stroke-width="2"/><line x1="388" x2="388" y1="72" y2="572" stroke="#111827" stroke-width="2"/><circle cx="580" cy="197" r="6" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"/><text x="588" y="185" font-weight="600" font-size="13" fill="#111827">P (3, 2)</text><circle cx="580" cy="447" r="6" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"/><text x="588" y="435" font-weight="600" font-size="13" fill="#111827">X (3, -2)</text><circle cx="196" cy="197" r="6" fill="#1d4ed8" stroke="#fff" stroke-width="1.5"/><text x="204" y="185" font-weight="600" font-size="13" fill="#111827">Y (-3, 2)</text></svg>
