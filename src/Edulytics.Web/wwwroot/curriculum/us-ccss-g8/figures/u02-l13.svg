<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" role="img" aria-labelledby="title desc"><title id="title">Sunlight shadow height approximation</title><desc id="desc">Original two similar-right-triangle model: 72-inch person casts 48-inch shadow; 171-inch estimated lamppost casts 114-inch shadow. Both modeled ratios are 1.5; field data 43/29 differs due to measured rounding and physical approximation. Diagram is not a verified real image or teacher observation.</desc><rect width="920" height="600" fill="#fff"/><rect x="10" y="78" width="900" height="502" fill="#f8fafc" stroke="#cbd5e1"/><text x="25" y="40" font-size="22" fill="#0f172a">Sunlight shadow height approximation</text><line id="person-height" x1="70" y1="480" x2="70" y2="336" stroke="#2563eb" stroke-width="2.5"/><line id="person-shadow" x1="70" y1="480" x2="166" y2="480" stroke="#15803d" stroke-width="2.5"/><line id="person-sunray" x1="70" y1="336" x2="166" y2="480" stroke="#b91c1c" stroke-width="2.5"/><text x="70" y="510" font-size="15" fill="#0f172a">person height 72; shadow 48 inches</text><line id="lamppost-height" x1="470" y1="480" x2="470" y2="257.7" stroke="#2563eb" stroke-width="2.5"/><line id="lamppost-shadow" x1="470" y1="480" x2="618.2" y2="480" stroke="#15803d" stroke-width="2.5"/><line id="lamppost-sunray" x1="470" y1="257.7" x2="618.2" y2="480" stroke="#b91c1c" stroke-width="2.5"/><text x="470" y="510" font-size="15" fill="#0f172a">lamppost height 171; shadow 114 inches</text><text x="80" y="540" font-size="15" fill="#0f172a">All heights are estimates; 43/29 differs from 1.5.</text></svg>
