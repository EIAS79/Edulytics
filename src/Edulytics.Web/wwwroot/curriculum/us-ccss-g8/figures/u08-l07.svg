<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img" aria-labelledby="title desc"><title id="title">Two area descriptions of a square</title><desc id="desc">For positive a and b, the outer square has side a+b and area (a+b)². Four right triangles each have area ab/2; subtracting them leaves c² and yields a²+b²=c².</desc><rect width="800" height="650" fill="white"/><text x="40" y="39" font-size="25" font-weight="bold" fill="#0f172a">Two area descriptions of a square</text><rect x="200" y="135" width="400" height="400" fill="#f0f9ff" stroke="#1d4ed8" stroke-width="3"/><polygon points="200,135 371.43,135 200,363.57" fill="#fdba74" fill-opacity="0.85" stroke="#9a3412" stroke-width="2"/><polygon points="371.43,135 600,135 600,306.43" fill="#fdba74" fill-opacity="0.85" stroke="#9a3412" stroke-width="2"/><polygon points="600,306.43 600,535 428.57,535" fill="#fdba74" fill-opacity="0.85" stroke="#9a3412" stroke-width="2"/><polygon points="200,363.57 428.57,535 200,535" fill="#fdba74" fill-opacity="0.85" stroke="#9a3412" stroke-width="2"/><polygon points="371.42857142857144,135 600,306.42857142857144 428.57142857142856,535 200,363.57142857142856" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/><text x="280" y="350" font-size="23" font-weight="bold" fill="#1d4ed8">c² = 25</text><text x="220" y="115" font-size="19" fill="#111827">outer side = a+b = 7</text><text x="160" y="570" font-size="19" fill="#111827">4 triangles × (ab/2) = 24</text><text x="160" y="604" font-size="19" fill="#111827">(a+b)² − 2ab = c²; 49 − 24 = 25</text></svg>
