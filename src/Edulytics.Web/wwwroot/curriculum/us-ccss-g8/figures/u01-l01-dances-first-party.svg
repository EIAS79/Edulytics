<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Three original six-frame triangle dance cards</title>
<desc id="desc">Original Edulytiks cards A B and C, six frames each. Same non-symmetric triangle rotates or slides. A and B turn clockwise first; C turns counterclockwise. Students describe a dance for a partner to identify, then reverse it.</desc>
