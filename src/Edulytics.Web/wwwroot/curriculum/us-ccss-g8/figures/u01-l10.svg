<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Original Grade 8 U01 L10 geometry representations</title><desc id="desc">Triangle A(0,0), B(1,2), C(5,2) and 180-degree image C(5,2), D(4,0), A(0,0) around M(2.5,1) form parallelogram ABCD. Original triangle area 4 and parallelogram area 8. Isosceles triangle with B(-1,0), C(1,0), A(0,sqrt(8)) has AB=AC=3.</desc><rect width="960" height="560" fill="#fff"/><rect x="16" y="95" width="925" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="25" y="43" font-size="24" fill="#0f172a">U01 L10 — independent first-party geometry</text><polygon id="triangle-original" points="115,390 180,260 440,260" fill="#2563eb" fill-opacity=".13" stroke="#2563eb" stroke-width="3"/><polygon id="triangle-halfturn" points="440,260 375,390 115,390" fill="#be123c" fill-opacity=".13" stroke="#be123c" stroke-width="3"/><text x="35" y="155" font-size="16" fill="#0f172a">ABC and its 180° image CDA</text><text x="275" y="330" font-size="16" fill="#0f172a">M</text><text x="40" y="493" font-size="14" fill="#0f172a">Area triangle = 4; parallelogram = 8</text><polygon id="isosceles-original" points="615,395 765,395 690,182.86797" fill="#16a34a" fill-opacity=".13" stroke="#16a34a" stroke-width="3"/><text x="520" y="155" font-size="16" fill="#0f172a">Isosceles: equal legs 3, base 2</text><text x="680" y="475" font-size="15" fill="#0f172a">AB = AC = 3</text></svg>
