<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" role="img" aria-labelledby="title desc"><title id="title">Rectangle scaling from a 8.5-by-11 page</title><desc id="desc">Independent diagram with rectangles A (8.5,11), C (4.25,5.5), E (2.125,2.75) aligned at the same lower left corner with shared diagonal, and B (5.5,8.5), D (2.75,4.25) forming a distinct second diagonal family. Source activity requires student sorting, measuring and explanation. Static candidate diagram, not publisher artwork.</desc><rect width="920" height="600" fill="#fff"/><rect x="10" y="78" width="900" height="502" fill="#f8fafc" stroke="#cbd5e1"/><text x="25" y="40" font-size="22" fill="#0f172a">Rectangle scaling from a 8.5-by-11 page</text><rect id="rect-A" x="105" y="213" width="187" height="242" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><rect id="rect-C" x="105" y="334" width="93.5" height="121" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><rect id="rect-E" x="105" y="394.5" width="46.75" height="60.5" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-width="2"/><rect id="rect-B" x="553" y="268" width="121" height="187" fill="#b91c1c" fill-opacity=".14" stroke="#b91c1c" stroke-width="2"/><rect id="rect-D" x="553" y="361.5" width="60.5" height="93.5" fill="#b91c1c" fill-opacity=".14" stroke="#b91c1c" stroke-width="2"/><line id="family-ACE-diagonal" x1="105" y1="455" x2="292" y2="213" stroke="#2563eb" stroke-width="2.5"/><line id="family-BD-diagonal" x1="553" y1="455" x2="674" y2="268" stroke="#b91c1c" stroke-width="2.5"/><text x="90" y="505" font-size="15" fill="#0f172a">A, C, E: scale 1, 1/2, 1/4</text><text x="518" y="505" font-size="15" fill="#0f172a">B, D: other aspect ratio</text></svg>
