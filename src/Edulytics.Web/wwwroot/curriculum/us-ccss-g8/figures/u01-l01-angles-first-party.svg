<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-labelledby="title desc">
<title id="title">Four original ray diagrams for an odd-one-out discussion</title>
<desc id="desc">A: two opposite horizontal rays. B: rightward and upward rays. C: rightward and diagonal up-right rays. D: rightward and diagonal up-left rays. All rays share a vertex. Give reasons for more than one possible odd-one-out.</desc>
<rect width="980" height="330" fill="white"/>
<text x="20" y="30" font-size="21" font-family="sans-serif" fill="#111827">Which one does not belong? Justify the choice.</text>
<g id="angle-A" data-degrees="180">
<rect x="25" y="55" width="220" height="225" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="37" y="81" font-size="24" font-family="sans-serif" fill="#111827">A</text>
<line id="ray-A-0" x1="133.0000" y1="191.0000" x2="203.0000" y2="191.0000" stroke="#1d4ed8" stroke-width="5"/>
<line id="ray-A-1" x1="133.0000" y1="191.0000" x2="63.0000" y2="191.0000" stroke="#be123c" stroke-width="5"/>
<circle cx="133" cy="191" r="6" fill="#111827"/>
</g>
<g id="angle-B" data-degrees="90">
<rect x="265" y="55" width="220" height="225" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="277" y="81" font-size="24" font-family="sans-serif" fill="#111827">B</text>
<line id="ray-B-0" x1="373.0000" y1="191.0000" x2="443.0000" y2="191.0000" stroke="#1d4ed8" stroke-width="5"/>
<line id="ray-B-1" x1="373.0000" y1="191.0000" x2="373.0000" y2="121.0000" stroke="#be123c" stroke-width="5"/>
<circle cx="373" cy="191" r="6" fill="#111827"/>
</g>
<g id="angle-C" data-degrees="45">
<rect x="505" y="55" width="220" height="225" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="517" y="81" font-size="24" font-family="sans-serif" fill="#111827">C</text>
<line id="ray-C-0" x1="613.0000" y1="191.0000" x2="683.0000" y2="191.0000" stroke="#1d4ed8" stroke-width="5"/>
<line id="ray-C-1" x1="613.0000" y1="191.0000" x2="662.4975" y2="141.5025" stroke="#be123c" stroke-width="5"/>
<circle cx="613" cy="191" r="6" fill="#111827"/>
</g>
<g id="angle-D" data-degrees="125">
<rect x="745" y="55" width="220" height="225" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
<text x="757" y="81" font-size="24" font-family="sans-serif" fill="#111827">D</text>
<line id="ray-D-0" x1="853.0000" y1="191.0000" x2="923.0000" y2="191.0000" stroke="#1d4ed8" stroke-width="5"/>
<line id="ray-D-1" x1="853.0000" y1="191.0000" x2="812.8496" y2="133.6594" stroke="#be123c" stroke-width="5"/>
<circle cx="853" cy="191" r="6" fill="#111827"/>
</g>
<text x="22" y="312" font-size="16" font-family="sans-serif" fill="#334155">All rays have a common vertex. Several different answers can be justified.</text>
</svg>
