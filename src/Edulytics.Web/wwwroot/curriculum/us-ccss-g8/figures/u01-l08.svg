<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Original Grade 8 U01 L08 geometry representations</title><desc id="desc">Four original right isosceles triangles rotate by 0, -90, -180 and -270 degrees around O(0,0), with OA=OB=3. Separate half-turn images of segment P(0,0), Q(4,0) about endpoint Q(4,0), midpoint M(2,0), off-line C(2,2).</desc><rect width="960" height="560" fill="#fff"/><rect x="16" y="95" width="925" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="25" y="43" font-size="24" fill="#0f172a">U01 L08 — independent first-party geometry</text><polygon id="quarter-0" points="223,323 388,323 223,158" fill="#2563eb" fill-opacity=".13" stroke="#2563eb" stroke-width="3"/><polygon id="quarter-1" points="223,323 223,488 388,323" fill="#be123c" fill-opacity=".13" stroke="#be123c" stroke-width="3"/><polygon id="quarter-2" points="223,323 58,323 223,488" fill="#16a34a" fill-opacity=".13" stroke="#16a34a" stroke-width="3"/><polygon id="quarter-3" points="223,323 223,158 58,323" fill="#7e22ce" fill-opacity=".13" stroke="#7e22ce" stroke-width="3"/><text x="40" y="155" font-size="16" fill="#0f172a">Four 90° clockwise quarter-turns around O</text><text x="232" y="326" font-size="16" fill="#0f172a">O</text><line id="original-segment" x1="600" y1="395" x2="740" y2="395" stroke="#2563eb" stroke-width="3"/><line id="half-endpoint" x1="880" y1="395" x2="740" y2="395" stroke="#be123c" stroke-width="3"/><line id="half-midpoint" x1="740" y1="395" x2="600" y2="395" stroke="#16a34a" stroke-width="3"/><line id="half-off-line" x1="740" y1="255" x2="600" y2="255" stroke="#7e22ce" stroke-width="3"/><text x="490" y="155" font-size="16" fill="#0f172a">180° segment rotations: three centers</text><text x="480" y="493" font-size="13" fill="#0f172a">Red endpoint; green midpoint; purple off-line</text></svg>
