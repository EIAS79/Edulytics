<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" role="img" aria-labelledby="title desc"><title id="title">U03 L05: stack height is affine</title><desc id="desc">First-party analytic plot of 6 cups 15 cm and 12 cups 23 cm. Slope is four thirds centimeters per cup and intercept is seven centimeters. For modeled height at least 50 cm, 33 whole cups are required, because 32 cups are below 50 cm and 33 cups are 51 cm. Diagram is not sourced publisher pixels or physical classroom verification.</desc><rect width="920" height="580" fill="white"/><rect x="15" y="82" width="889" height="468" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="28" y="45" font-size="23" fill="#0f172a">U03 L05: stack height is affine</text><line id="cup-line" x1="110" y1="515" x2="110" y2="515" stroke="#e2e8f0" stroke-width="3"/><line id="cup-height-line" x1="110" y1="461.8" x2="635" y2="107.13333" stroke="#2563eb" stroke-width="3"/><circle id="cup-six" cx="200" cy="401" r="5" fill="#b91c1c"/><circle id="cup-twelve" cx="290" cy="340.2" r="5" fill="#b91c1c"/><circle id="cup-thirty-two" cx="590" cy="137.53333" r="5" fill="#b91c1c"/><circle id="cup-thirty-three" cx="605" cy="127.4" r="5" fill="#15803d"/><text x="625" y="210" font-size="18" fill="#0f172a">h = 7 + (4/3)n</text><text x="625" y="248" font-size="16" fill="#0f172a">6 cups = 15 cm</text><text x="625" y="281" font-size="16" fill="#0f172a">12 cups = 23 cm</text><text x="625" y="321" font-size="16" fill="#0f172a">At least 50 cm: 33 cups</text></svg>
