<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" role="img" aria-labelledby="title desc"><title id="title">U03 L04: two hourly wages</title><desc id="desc">Original first-party comparison of linear wages y=8.4x and y=7x for nonnegative worked hours. At x=12 lines give 100.8 and 84 dollars. No source graph artwork is copied and this static graph is not a student-completed or authenticated figure.</desc><rect width="920" height="580" fill="white"/><rect x="15" y="82" width="889" height="468" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="28" y="45" font-size="23" fill="#0f172a">U03 L04: two hourly wages</text><line id="wage-840" x1="110" y1="490" x2="570" y2="154" stroke="#2563eb" stroke-width="3"/><line id="wage-700" x1="110" y1="490" x2="570" y2="210" stroke="#be123c" stroke-width="3"/><circle id="wage-at-12-high" cx="386" cy="288.4" r="6" fill="#2563eb"/><circle id="wage-at-12-low" cx="386" cy="322" r="6" fill="#be123c"/><text x="580" y="200" font-size="17" fill="#0f172a">After 12 hours:</text><text x="580" y="242" font-size="16" fill="#0f172a">$100.80 versus $84.00</text><text x="580" y="281" font-size="16" fill="#0f172a">Difference = $16.80</text></svg>
