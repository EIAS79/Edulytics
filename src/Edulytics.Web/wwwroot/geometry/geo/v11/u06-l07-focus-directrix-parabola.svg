<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 510" role="img" aria-labelledby="parabola-title parabola-desc">
<title id="parabola-title">Focus-directrix parabola x squared equals eight y</title>
<desc id="parabola-desc">In Cartesian coordinates the focus F is at (0,2) and directrix is horizontal y equals negative 2. The vertex is V at the origin. Point P at (4,2) is four units from focus and four units above the directrix, so it lies on the parabola x squared equals 8y. A horizontal segment P to F and vertical segment P to the directrix show these equal distances.</desc>
<rect width="690" height="510" fill="#fff"/>
<text x="42" y="31" font-family="sans-serif" font-size="20" fill="#132f48">Equidistant locus: focus and directrix</text>
<g stroke="#d5dee5" stroke-width="1">
<path d="M60 60 V450 M140 60 V450 M220 60 V450 M300 60 V450 M380 60 V450 M460 60 V450 M540 60 V450"/>
<path d="M60 60 H540 M60 140 H540 M60 220 H540 M60 300 H540 M60 380 H540"/>
</g>
<path d="M60 300 H550 M300 445 V58" stroke="#132f48" stroke-width="2" fill="none"/>
<text x="559" y="307" font-family="sans-serif" font-size="16" fill="#132f48">x</text>
<text x="310" y="52" font-family="sans-serif" font-size="16" fill="#132f48">y</text>
<path d="M60 380 H548" stroke="#b45309" stroke-width="4" stroke-dasharray="11 7"/>
<text x="551" y="383" font-family="sans-serif" font-size="16" fill="#7b390c">y = −2</text>
<path d="M60 120 Q300 480 540 120" fill="none" stroke="#15547c" stroke-width="5"/>
<circle cx="300" cy="220" r="6" fill="#b45309"/>
<text x="313" y="207" font-family="sans-serif" font-size="17" fill="#132f48">F(0, 2)</text>
<circle cx="300" cy="300" r="5" fill="#15547c"/>
<text x="312" y="326" font-family="sans-serif" font-size="17" fill="#132f48">V(0, 0)</text>
<circle cx="460" cy="220" r="6" fill="#15547c"/>
<text x="471" y="207" font-family="sans-serif" font-size="17" fill="#132f48">P(4, 2)</text>
<path d="M300 220 H460 V380" fill="none" stroke="#b45309" stroke-width="3"/>
<path d="M460 231 H446 V245" stroke="#b45309" stroke-width="2" fill="none"/>
<text x="360" y="211" font-family="sans-serif" font-size="15" fill="#7b390c">4 units</text>
<text x="470" y="303" font-family="sans-serif" font-size="15" fill="#7b390c">4 units</text>
<text x="58" y="480" font-family="sans-serif" font-size="17" fill="#132f48">distance(P, F) = distance(P, directrix) = 4</text>
</svg>
