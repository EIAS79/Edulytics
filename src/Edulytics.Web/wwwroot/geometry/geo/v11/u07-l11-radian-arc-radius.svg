<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 470" role="img" aria-labelledby="radian-title radian-desc">
<title id="radian-title">Radian measure equals arc length divided by radius</title>
<desc id="radian-desc">A circle of radius r has a sector of central angle 60 degrees, or pi divided by 3 radians. The highlighted curved boundary is arc length s. Since one sixth of the full circumference is highlighted, s equals pi r divided by 3 and s divided by r equals pi divided by 3 radians.</desc>
<rect width="750" height="470" fill="#fff"/>
<text x="42" y="35" font-family="sans-serif" font-size="20" fill="#132f48">Central angle and intercepted arc</text>
<circle cx="320" cy="235" r="150" fill="none" stroke="#15547c" stroke-width="3"/>
<path d="M320 235 L470 235 A150 150 0 0 0 395 105 Z" fill="#c4e6f4" fill-opacity=".9"/>
<path d="M470 235 A150 150 0 0 0 395 105" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
<line x1="320" y1="235" x2="470" y2="235" stroke="#15547c" stroke-width="3"/>
<line x1="320" y1="235" x2="395" y2="105" stroke="#15547c" stroke-width="3"/>
<circle cx="320" cy="235" r="5" fill="#132f48"/>
<text x="298" y="255" font-family="sans-serif" font-size="17" fill="#132f48">O</text>
<text x="386" y="255" font-family="sans-serif" font-size="18" fill="#132f48">r</text>
<text x="408" y="145" font-family="sans-serif" font-size="18" fill="#7b390c">arc s</text>
<path d="M378 235 A58 58 0 0 0 349 185" fill="none" stroke="#132f48" stroke-width="2"/>
<text x="374" y="215" font-family="sans-serif" font-size="16" fill="#132f48">60°</text>
<text x="520" y="166" font-family="sans-serif" font-size="20" fill="#132f48">θ = π/3 rad</text>
<text x="520" y="209" font-family="sans-serif" font-size="19" fill="#132f48">s = (π/3)r</text>
<text x="520" y="250" font-family="sans-serif" font-size="19" fill="#132f48">θ = s/r</text>
<text x="42" y="428" font-family="sans-serif" font-size="18" fill="#132f48">One-sixth turn gives one-sixth of the full circumference.</text>
</svg>
