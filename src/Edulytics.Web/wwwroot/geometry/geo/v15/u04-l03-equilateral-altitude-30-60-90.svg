<svg xmlns="http://www.w3.org/2000/svg" width="750" height="465" viewBox="0 0 750 465" role="img" aria-labelledby="alt-title alt-description">
<title id="alt-title">Altitude of a full-side 2s equilateral triangle</title>
<desc id="alt-description">Equilateral triangle ABC has full side 2s and midpoint M on BC. Altitude AM is perpendicular to BC and has length s times square root three for positive s. Half-base BM and MC are each s. Right triangles ABM and ACM have a 30 degree angle at A, 60 degree angle at B or C, and 90 degree angle at M; each has sides s, s square root three, and 2s.</desc>
<rect width="750" height="465" fill="white"/>
<text x="30" y="38" font-family="sans-serif" font-size="21" fill="#152f45">From equilateral side 2s to 30°–60°–90°</text>
<path d="M250 72.872 L90 350 L410 350 Z" fill="#d7e9f5" fill-opacity=".55" stroke="#185b84" stroke-width="3"/>
<path d="M250 72.872 V350" fill="none" stroke="#a55a24" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M250 328 H272 V350" fill="none" stroke="#172f45" stroke-width="2"/>
<g fill="#163d58" font-size="18" font-family="sans-serif">
<text x="246" y="65">A</text><text x="68" y="366">B</text><text x="417" y="367">C</text><text x="240" y="373">M</text>
<text x="139" y="206">2s</text><text x="362" y="207">2s</text>
<text x="158" y="374">s</text><text x="330" y="374">s</text>
<text x="265" y="205">s√3</text><text x="217" y="120">30°</text>
<text x="105" y="334">60°</text><text x="278" y="342">90°</text>
<text x="460" y="155">AB = BC = CA = 2s</text>
<text x="460" y="197">BM = MC = s</text>
<text x="460" y="239">AM² = (2s)² − s²</text>
<text x="460" y="279">AM = s√3,  s &gt; 0</text>
<text x="30" y="427" font-size="15">The full equilateral side is 2s; the short leg of either half-triangle is s (not 2s).</text>
</g>
</svg>
