<svg xmlns="http://www.w3.org/2000/svg" width="820" height="550" viewBox="0 0 820 550" role="img" aria-labelledby="arc-graph-title arc-graph-description">
<title id="arc-graph-title">Arc length is proportional to radius for a constant central angle of 1.5 radians</title>
<desc id="arc-graph-description">Accessible Cartesian graph with horizontal axis radius r in metres and vertical axis arc length s in metres. The original model s equals 1.5 times r is a straight line through the origin. Marked points have radius and arc-length coordinates (2,3), (6,9), (11,16.5), (14,21), and (20,30). The gradient is 1.5 radians because arc length divided by radius is 1.5 for every nonzero radius. All data and geometric marks are original first-party work.</desc>
<rect width="820" height="550" fill="#ffffff"/>
<text x="45" y="40" font-size="22" font-family="sans-serif" fill="#102e46">Arc length s = 1.5r</text>
<g stroke="#dbe6ee" stroke-width="1">
<path d="M100 90 V450 M235 90 V450 M370 90 V450 M505 90 V450 M640 90 V450"/>
<path d="M100 90 H640 M100 180 H640 M100 270 H640 M100 360 H640 M100 450 H640"/>
</g>
<path d="M100 70 V450 H680" fill="none" stroke="#1f4055" stroke-width="3"/>
<path d="M100 450 L640 90" fill="none" stroke="#135d90" stroke-width="4"/>
<g fill="#135d90" stroke="#ffffff" stroke-width="2">
<circle cx="154" cy="414" r="6"/><circle cx="262" cy="342" r="6"/><circle cx="397" cy="252" r="6"/><circle cx="478" cy="198" r="6"/><circle cx="640" cy="90" r="6"/>
</g>
<g font-family="sans-serif" font-size="15" fill="#102e46">
<text x="88" y="473">0</text><text x="228" y="473">5</text><text x="359" y="473">10</text><text x="497" y="473">15</text><text x="630" y="473">20</text>
<text x="56" y="454">0</text><text x="48" y="365">7.5</text><text x="49" y="275">15</text><text x="40" y="185">22.5</text><text x="49" y="95">30</text>
<text x="681" y="458">r (m)</text><text x="37" y="66">s (m)</text>
<text x="164" y="414">(2,3)</text><text x="272" y="342">(6,9)</text>
<text x="405" y="253">(11,16.5)</text><text x="486" y="199">(14,21)</text>
<text x="647" y="88">(20,30)</text>
<text x="100" y="513">Slope Δs/Δr = 1.5: central angle θ = 1.5 radians</text>
</g>
</svg>
