<svg xmlns="http://www.w3.org/2000/svg" width="820" height="570" viewBox="0 0 820 570" role="img" aria-labelledby="geo-dilation-title geo-dilation-description">
<title id="geo-dilation-title">A quadrilateral and its one-fifth dilation from a shared centre</title>
<desc id="geo-dilation-description">An original coordinate grid with centre A at (2,3). Original vertices B=(6,3), C=(8,9), and D=(4,9) form parallelogram ABCD. Small image vertices B prime=(2.8,3), C prime=(3.2,4.2), and D prime=(2.4,4.2) form A B prime C prime D prime. Every image point lies on the ray from A to its original point, at one fifth the distance, so the entire polygon is a dilation with centre A and factor 1/5. The larger polygon is outlined in blue, the smaller in amber. All coordinates are first-party values.</desc>
<rect width="820" height="570" fill="#fff"/>
<text x="46" y="36" font-family="sans-serif" font-size="21" fill="#132d49">Shared centre A; scale factor 1/5</text>
<g stroke="#d9e4ed" stroke-width="1">
<path d="M50 40 V490 M120 40 V490 M190 40 V490 M260 40 V490 M330 40 V490 M400 40 V490 M470 40 V490 M540 40 V490 M610 40 V490 M680 40 V490"/>
<path d="M50 490 H680 M50 445 H680 M50 400 H680 M50 355 H680 M50 310 H680 M50 265 H680 M50 220 H680 M50 175 H680 M50 130 H680 M50 85 H680 M50 40 H680"/>
</g>
<path d="M50 40 V490 H710" fill="none" stroke="#213c54" stroke-width="2.5"/>
<g font-family="sans-serif" font-size="13" fill="#213c54">
<text x="43" y="509">0</text><text x="185" y="509">2</text><text x="325" y="509">4</text><text x="465" y="509">6</text><text x="605" y="509">8</text>
<text x="31" y="359">3</text><text x="31" y="224">6</text><text x="31" y="89">9</text>
<text x="712" y="490">x</text><text x="50" y="26">y</text>
</g>
<polygon points="190,355 470,355 610,85 330,85" fill="#b9dff0" fill-opacity=".4" stroke="#145a85" stroke-width="3"/>
<polygon points="190,355 246,355 274,301 218,301" fill="#ffe2ae" fill-opacity=".85" stroke="#99520e" stroke-width="3"/>
<g fill="#145a85" stroke="#fff" stroke-width="2">
<circle cx="470" cy="355" r="5"/><circle cx="610" cy="85" r="5"/><circle cx="330" cy="85" r="5"/>
</g>
<g fill="#99520e" stroke="#fff" stroke-width="2">
<circle cx="246" cy="355" r="5"/><circle cx="274" cy="301" r="5"/><circle cx="218" cy="301" r="5"/>
</g>
<circle cx="190" cy="355" r="6" fill="#172b3c"/>
<g font-family="sans-serif" font-size="15" fill="#132d49">
<text x="160" y="383">A(2,3)</text><text x="478" y="352">B(6,3)</text><text x="617" y="90">C(8,9)</text><text x="337" y="82">D(4,9)</text>
<text x="241" y="380">B′(2.8,3)</text><text x="285" y="302">C′(3.2,4.2)</text><text x="110" y="294">D′(2.4,4.2)</text>
<text x="50" y="552">Image rule: X′ = A + (X − A)/5, for B, C and D.</text>
</g>
</svg>
