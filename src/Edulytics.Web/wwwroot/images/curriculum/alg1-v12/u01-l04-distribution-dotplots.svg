<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 510" role="img" aria-labelledby="title desc"><title id="title">Five original distribution dot plots</title><desc id="desc">Original fictional five distributions; values 1 through 5 have frequencies A 1,2,4,2,1; B 2,2,2,2,2; C 5,3,1,1,1; D 4,1,1,1,4; E 1,1,1,3,5. Create ten original cards and match them.</desc><rect width="850" height="510" fill="white"/><g font-family="Arial,sans-serif"><text x="30" y="35" font-size="20" text-anchor="start">Five first-party dot plots: use five frequency cards to match</text><text x="135" y="81" font-size="16" text-anchor="middle">A bell</text><line x1="50" y1="230" x2="260" y2="230" stroke="#303a48" stroke-width="2"/><text x="64" y="248" font-size="12" text-anchor="middle">1</text><circle cx="64" cy="218" r="7" fill="#4f61a8"/><text x="107" y="248" font-size="12" text-anchor="middle">2</text><circle cx="107" cy="218" r="7" fill="#4f61a8"/><circle cx="107" cy="196" r="7" fill="#4f61a8"/><text x="150" y="248" font-size="12" text-anchor="middle">3</text><circle cx="150" cy="218" r="7" fill="#4f61a8"/><circle cx="150" cy="196" r="7" fill="#4f61a8"/><circle cx="150" cy="174" r="7" fill="#4f61a8"/><circle cx="150" cy="152" r="7" fill="#4f61a8"/><text x="193" y="248" font-size="12" text-anchor="middle">4</text><circle cx="193" cy="218" r="7" fill="#4f61a8"/><circle cx="193" cy="196" r="7" fill="#4f61a8"/><text x="236" y="248" font-size="12" text-anchor="middle">5</text><circle cx="236" cy="218" r="7" fill="#4f61a8"/><text x="405" y="81" font-size="16" text-anchor="middle">B uniform</text><line x1="320" y1="230" x2="530" y2="230" stroke="#303a48" stroke-width="2"/><text x="334" y="248" font-size="12" text-anchor="middle">1</text><circle cx="334" cy="218" r="7" fill="#4f61a8"/><circle cx="334" cy="196" r="7" fill="#4f61a8"/><text x="377" y="248" font-size="12" text-anchor="middle">2</text><circle cx="377" cy="218" r="7" fill="#4f61a8"/><circle cx="377" cy="196" r="7" fill="#4f61a8"/><text x="420" y="248" font-size="12" text-anchor="middle">3</text><circle cx="420" cy="218" r="7" fill="#4f61a8"/><circle cx="420" cy="196" r="7" fill="#4f61a8"/><text x="463" y="248" font-size="12" text-anchor="middle">4</text><circle cx="463" cy="218" r="7" fill="#4f61a8"/><circle cx="463" cy="196" r="7" fill="#4f61a8"/><text x="506" y="248" font-size="12" text-anchor="middle">5</text><circle cx="506" cy="218" r="7" fill="#4f61a8"/><circle cx="506" cy="196" r="7" fill="#4f61a8"/><text x="675" y="81" font-size="16" text-anchor="middle">C right skew</text><line x1="590" y1="230" x2="800" y2="230" stroke="#303a48" stroke-width="2"/><text x="604" y="248" font-size="12" text-anchor="middle">1</text><circle cx="604" cy="218" r="7" fill="#4f61a8"/><circle cx="604" cy="196" r="7" fill="#4f61a8"/><circle cx="604" cy="174" r="7" fill="#4f61a8"/><circle cx="604" cy="152" r="7" fill="#4f61a8"/><circle cx="604" cy="130" r="7" fill="#4f61a8"/><text x="647" y="248" font-size="12" text-anchor="middle">2</text><circle cx="647" cy="218" r="7" fill="#4f61a8"/><circle cx="647" cy="196" r="7" fill="#4f61a8"/><circle cx="647" cy="174" r="7" fill="#4f61a8"/><text x="690" y="248" font-size="12" text-anchor="middle">3</text><circle cx="690" cy="218" r="7" fill="#4f61a8"/><text x="733" y="248" font-size="12" text-anchor="middle">4</text><circle cx="733" cy="218" r="7" fill="#4f61a8"/><text x="776" y="248" font-size="12" text-anchor="middle">5</text><circle cx="776" cy="218" r="7" fill="#4f61a8"/><text x="135" y="301" font-size="16" text-anchor="middle">D bimodal</text><line x1="50" y1="450" x2="260" y2="450" stroke="#303a48" stroke-width="2"/><text x="64" y="468" font-size="12" text-anchor="middle">1</text><circle cx="64" cy="438" r="7" fill="#4f61a8"/><circle cx="64" cy="416" r="7" fill="#4f61a8"/><circle cx="64" cy="394" r="7" fill="#4f61a8"/><circle cx="64" cy="372" r="7" fill="#4f61a8"/><text x="107" y="468" font-size="12" text-anchor="middle">2</text><circle cx="107" cy="438" r="7" fill