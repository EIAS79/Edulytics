<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 510" role="img" aria-labelledby="title desc"><title id="title">Original picture-frame geometry model</title><desc id="desc">Picture 8 by 5 inches surrounded by a uniform border of thickness x; at x=1 outer dimensions10 by7 inches, outer area70, inner area40, frame area30 square inches.</desc><rect width="850" height="510" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="38" font-size="21" text-anchor="start">Original geometric constraint: uniform picture border</text><rect x="145" y="120" width="540" height="300" fill="#e0e9f5" stroke="#334054" stroke-width="3"/><rect x="200" y="162" width="430" height="215" fill="white" stroke="#334054" stroke-width="3"/><text x="415" y="270" font-size="21" text-anchor="middle">Picture 8 by 5 inches</text><text x="415" y="458" font-size="18" text-anchor="middle">Outer: (8+2x) by (5+2x); x=1 inch</text><text x="165" y="280" font-size="18" text-anchor="start">x</text><text x="650" y="280" font-size="18" text-anchor="start">x</text><text x="415" y="145" font-size="18" text-anchor="start">x</text><text x="415" y="405" font-size="18" text-anchor="start">x</text><text x="115" y="489" font-size="14" text-anchor="start">Border material = outer 70 square inches - picture 40 = 30.</text></g></svg>
