<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="graphTitle graphDesc" viewBox="0 0 740 440">
<title id="graphTitle">Two different fictional exponential-growth models</title><desc id="graphDesc">Discrete N(t)=50 times 2^t yields 50,100,200,400,800. P(t)=20 times 3^t yields 20,60,180,540,1620 for integer t from 0 to 4. Dashed connections are only visual guides.</desc>
