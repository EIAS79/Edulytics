<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#69d86d"/><stop offset=".55" stop-color="#2f9a56"/><stop offset="1" stop-color="#176b4b"/></linearGradient>
 <linearGradient id="leaf2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#91e77b"/><stop offset="1" stop-color="#2d9158"/></linearGradient>
 <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9b7044"/><stop offset="1" stop-color="#61422f"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#073946" flood-opacity=".34"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<g filter="url(#shadow)">
 <!-- left forest cluster -->
 <g transform="translate(175 350)"><path d="M0 185c8-106 54-185 126-185s117 82 126 185" fill="#225f4f" opacity=".45"/><rect x="111" y="129" width="27" height="115" rx="12" fill="url(#trunk)"/><circle cx="124" cy="111" r="76" fill="url(#leaf)"/><circle cx="66" cy="138" r="57" fill="url(#leaf2)"/><circle cx="185" cy="141" r="61" fill="url(#leaf)"/></g>
 <g transform="translate(410 422)"><rect x="48" y="75" width="20" height="93" rx="10" fill="url(#trunk)"/><circle cx="60" cy="65" r="57" fill="url(#leaf)"/><circle cx="24" cy="86" r="39" fill="url(#leaf2)"/><circle cx="100" cy="88" r="42" fill="url(#leaf)"/></g>
 <!-- right forest cluster -->
 <g transform="translate(1220 390)"><rect x="91" y="112" width="27" height="119" rx="12" fill="url(#trunk)"/><circle cx="105" cy="91" r="73" fill="url(#leaf)"/><circle cx="45" cy="122" r="54" fill="url(#leaf2)"/><circle cx="167" cy="121" r="60" fill="url(#leaf)"/></g>
 <g transform="translate(1030 448)"><rect x="48" y="77" width="20" height="91" rx="10" fill="url(#trunk)"/><circle cx="58" cy="67" r="54" fill="url(#leaf)"/><circle cx="18" cy="90" r="38" fill="url(#leaf2)"/><circle cx="96" cy="88" r="41" fill="url(#leaf)"/></g>
</g>
<!-- mission bushes, kept separate from terrain -->
<g id="mission-bushes" filter="url(#shadow)">
 <g transform="translate(390 575)"><ellipse cx="0" cy="0" rx="145" ry="78" fill="#236e4d" opacity=".38"/><circle cx="-72" cy="-12" r="54" fill="url(#leaf2)"/><circle cx="-16" cy="-35" r="68" fill="url(#leaf)"/><circle cx="54" cy="-18" r="62" fill="url(#leaf2)"/><circle cx="102" cy="8" r="43" fill="#328f55"/></g>
 <g transform="translate(1110 575)"><ellipse cx="0" cy="0" rx="145" ry="78" fill="#236e4d" opacity=".38"/><circle cx="-96" cy="7" r="44" fill="#328f55"/><circle cx="-52" cy="-17" r="60" fill="url(#leaf2)"/><circle cx="18" cy="-35" r="68" fill="url(#leaf)"/><circle cx="84" cy="-12" r="56" fill="url(#leaf2)"/></g>
</g>
<!-- rocks and grasses -->
<g fill="#416c65" opacity=".86"><ellipse cx="120" cy="690" rx="40" ry="17"/><ellipse cx="250" cy="748" rx="28" ry="13"/><ellipse cx="1370" cy="715" rx="36" ry="15"/><ellipse cx="1460" cy="650" rx="25" ry="12"/><ellipse cx="820" cy="760" rx="31" ry="13"/></g>
<g stroke="#1f7650" stroke-width="7" stroke-linecap="round" opacity=".72"><path d="M80 820l-12-44M95 820l9-52M115 820l25-44M1490 820l-15-50M1510 820l7-56M1530 820l23-48M665 800l-8-38M680 800l16-42M697 800l26-31"/></g>
<!-- ambient lantern glows -->
<g fill="#fff3a1" opacity=".3" filter="url(#glow)"><circle cx="330" cy="610" r="35"/><circle cx="780" cy="522" r="38"/><circle cx="1170" cy="585" r="35"/><circle cx="975" cy="690" r="30"/></g>
</svg>