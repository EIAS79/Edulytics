<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 965 690" role="img" aria-labelledby="title desc">
<title id="title">Edulytiks-original Grade 6 tiling investigations, four patterns and two equal-area constructions</title>
<desc id="desc">Not publisher imagery. Four 2 by 2 square targets: A contains four blue unit squares; B contains eight yellow half-square right triangles; C contains two blue squares on the left and four yellow triangles on the right; D is C with its lower-right unit cell uncovered. A, B, C each cover 4 square units, but D only 3. Two new complete arrangements V and H use exactly two blue squares and four yellow half-squares, one set vertically and one horizontally, giving each tile type area 2 square units in both.</desc>
<rect width="965" height="690" fill="white"/>
<g font-family="Arial, sans-serif">
<text x="26" y="40" font-size="24" font-weight="700" fill="#17324a">1.1: Compare four FIRST-PARTY tiling patterns</text>
<text x="26" y="63" font-size="14" fill="#17324a">Each target is 2 × 2 unit squares. Analyze complete coverage, colors and polygon types. Not the publisher diagram.</text>
<g aria-label="A: All blue squares"><text x="34" y="99" font-size="17" font-weight="700" fill="#17324a">A</text><rect x="34" y="119" width="51" height="51" fill="#3377bb"/><rect x="34" y="119" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><rect x="85" y="119" width="51" height="51" fill="#3377bb"/><rect x="85" y="119" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><rect x="34" y="170" width="51" height="51" fill="#3377bb"/><rect x="34" y="170" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><rect x="85" y="170" width="51" height="51" fill="#3377bb"/><rect x="85" y="170" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><text x="34" y="242" font-size="13" fill="#17324a">All blue squares</text></g>
<g aria-label="B: All yellow triangles"><text x="265" y="99" font-size="17" font-weight="700" fill="#17324a">B</text><polygon points="265,119 316,119 316,170" fill="#ecc24d"/><polygon points="265,119 265,170 316,170" fill="#ecc24d"/><line x1="265" y1="119" x2="316" y2="170" stroke="#17324a" stroke-width="1.8"/><rect x="265" y="119" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><polygon points="316,119 367,119 367,170" fill="#ecc24d"/><polygon points="316,119 316,170 367,170" fill="#ecc24d"/><line x1="316" y1="119" x2="367" y2="170" stroke="#17324a" stroke-width="1.8"/><rect x="316" y="119" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><polygon points="265,170 316,170 316,221" fill="#ecc24d"/><polygon points="265,170 265,221 316,221" fill="#ecc24d"/><line x1="265" y1="170" x2="316" y2="221" stroke="#17324a" stroke-width="1.8"/><rect x="265" y="170" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><polygon points="316,170 367,170 367,221" fill="#ecc24d"/><polygon points="316,170 316,221 367,221" fill="#ecc24d"/><line x1="316" y1="170" x2="367" y2="221" stroke="#17324a" stroke-width="1.8"/><rect x="316" y="170" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><text x="265" y="242" font-size="13" fill="#17324a">All yellow triangles</text></g>
<g aria-label="C: Both tile types"><text x="496" y="99" font-size="17" font-weight="700" fill="#17324a">C</text><rect x="496" y="119" width="51" height="51" fill="#3377bb"/><rect x="496" y="119" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><polygon points="547,119 598,119 598,170" fill="#ecc24d"/><polygon points="547,119 547,170 598,170" fill="#ecc24d"/><line x1="547" y1="119" x2="598" y2="170" stroke="#17324a" stroke-width="1.8"/><rect x="547" y="119" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><rect x="496" y="170" width="51" height="51" fill="#3377bb"/><rect x="496" y="170" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><polygon points="547,170 598,170 598,221" fill="#ecc24d"/><polygon points="547,170 547,221 598,221" fill="#ecc24d"/><line x1="547" y1="170" x2="598" y2="221" stroke="#17324a" stroke-width="1.8"/><rect x="547" y="170" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><text x="496" y="242" font-size="13" fill="#17324a">Both tile types</text></g>
<g aria-label="D: One white gap"><text x="727" y="99" font-size="17" font-weight="700" fill="#17324a">D</text><rect x="727" y="119" width="51" height="51" fill="#3377bb"/><rect x="727" y="119" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><polygon points="778,119 829,119 829,170" fill="#ecc24d"/><polygon points="778,119 778,170 829,170" fill="#ecc24d"/><line x1="778" y1="119" x2="829" y2="170" stroke="#17324a" stroke-width="1.8"/><rect x="778" y="119" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><rect x="727" y="170" width="51" height="51" fill="#3377bb"/><rect x="727" y="170" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><rect x="778" y="170" width="51" height="51" fill="white" stroke="#17324a" stroke-width="2" stroke-dasharray="5 4"/><rect x="778" y="170" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><text x="727" y="242" font-size="13" fill="#17324a">One white gap</text></g>
<text x="26" y="285" font-size="15" fill="#17324a">A, B, C cover all 4 square units; D leaves 1 square unit uncovered (3 of 4 covered).</text>
<path d="M26 316 H940" stroke="#d4e0e5" stroke-width="2"/>
<text x="26" y="353" font-size="24" font-weight="700" fill="#17324a">Construct: same pieces, two different complete arrangements</text>
<text x="26" y="378" font-size="14" fill="#17324a">Both use 2 blue unit squares + 4 yellow half-square triangles. Draw or cut out and rearrange.</text>
<g aria-label="V: Squares left; triangles right"><text x="95" y="407" font-size="17" font-weight="700" fill="#17324a">V</text><rect x="95" y="427" width="51" height="51" fill="#3377bb"/><rect x="95" y="427" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><polygon points="146,427 197,427 197,478" fill="#ecc24d"/><polygon points="146,427 146,478 197,478" fill="#ecc24d"/><line x1="146" y1="427" x2="197" y2="478" stroke="#17324a" stroke-width="1.8"/><rect x="146" y="427" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><rect x="95" y="478" width="51" height="51" fill="#3377bb"/><rect x="95" y="478" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><polygon points="146,478 197,478 197,529" fill="#ecc24d"/><polygon points="146,478 146,529 197,529" fill="#ecc24d"/><line x1="146" y1="478" x2="197" y2="529" stroke="#17324a" stroke-width="1.8"/><rect x="146" y="478" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><text x="95" y="550" font-size="13" fill="#17324a">Squares left; triangles right</text></g>
<g aria-label="H: Squares top; triangles below"><text x="530" y="407" font-size="17" font-weight="700" fill="#17324a">H</text><rect x="530" y="427" width="51" height="51" fill="#3377bb"/><rect x="530" y="427" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><rect x="581" y="427" width="51" height="51" fill="#3377bb"/><rect x="581" y="427" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><polygon points="530,478 581,478 581,529" fill="#ecc24d"/><polygon points="530,478 530,529 581,529" fill="#ecc24d"/><line x1="530" y1="478" x2="581" y2="529" stroke="#17324a" stroke-width="1.8"/><rect x="530" y="478" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><polygon points="581,478 632,478 632,529" fill="#ecc24d"/><polygon points="581,478 581,529 632,529" fill="#ecc24d"/><line x1="581" y1="478" x2="632" y2="529" stroke="#17324a" stroke-width="1.8"/><rect x="581" y="478" width="51" height="51" fill="none" stroke="#17324a" stroke-width="1.7"/><text x="530" y="550" font-size="13" fill="#17324a">Squares top; triangles below</text></g>
<text x="28" y="606" font-size="15" fill="#17324a">Blue area = 2 square units; yellow area = 4 × ½ = 2 square units; total = 4.</text>
<text x="28" y="629" font-size="15" fill="#17324a">Ask learners to make both, justify no gap/overlap, then design a third complete arrangement.</text>
<text x="28" y="659" font-size="12" fill="#17324a">Source-aligned first-party DRAWING alternative; distinct from the separate eight-hexagon triangular-unit comparison.</text>
